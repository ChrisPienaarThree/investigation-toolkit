<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3CA Investigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: step tabs, a side panel (event list, guidance, checks) and the main work area.
   Under 900 px everything stacks in one column: the panel comes after the work area. */
:root {
  --bg:#eef1f4; --surface:#fff; --surface-2:#f5f7f9; --ink:#142132; --muted:#5a6779; --line:#d3dae2;
  --accent:#1d4ea3; --accent-ink:#fff; --accent-soft:#e3ebf8;
  --err:#b42318; --err-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff3dc; --tip:#276a8a; --tip-soft:#e4f1f7; --ok:#20734a; --ok-soft:#e3f4ea;
  --q:#1d5fc4; --brand:#0f2a4d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0e141b; --surface:#161f2a; --surface-2:#1c2633; --ink:#e3e9f0; --muted:#96a3b4; --line:#2b3746;
  --accent:#82a8ff; --accent-ink:#0b1220; --accent-soft:#1d2c47;
  --err:#ff8a80; --err-soft:#3a1d1d; --warn:#f5b74e; --warn-soft:#362a14; --tip:#7cc4e4; --tip-soft:#15303c; --ok:#6fd39c; --ok-soft:#14301f;
  --q:#8ab4ff; --brand:#0a1d36; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0e141b; --surface:#161f2a; --surface-2:#1c2633; --ink:#e3e9f0; --muted:#96a3b4; --line:#2b3746;
  --accent:#82a8ff; --accent-ink:#0b1220; --accent-soft:#1d2c47;
  --err:#ff8a80; --err-soft:#3a1d1d; --warn:#f5b74e; --warn-soft:#362a14; --tip:#7cc4e4; --tip-soft:#15303c; --ok:#6fd39c; --ok-soft:#14301f;
  --q:#8ab4ff; --brand:#0a1d36; color-scheme:dark }
[hidden] { display:none !important; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--f-body); }
h1,h2,h3 { font-family:var(--f-display); font-weight:600; line-height:1.15; margin:0 0 6px; }
h2 { font-size:1.45rem; } h3 { font-size:1.1rem; margin-top:14px; }
p { margin:4px 0; } .muted { color:var(--muted); } .small { font-size:.86rem; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:5px 11px; cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:var(--accent); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.sm { padding:2px 8px; font-size:.85rem; }
.btn.danger { color:var(--err); }
input[type=text], input[type=date], input[type=time], select, textarea { width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:5px 8px; min-width:0; }
textarea { min-height:58px; resize:vertical; }
label.f { display:block; margin:10px 0 2px; font-weight:600; font-size:.9rem; }
.proc { border-top:1px dashed var(--line); padding-top:6px; margin:8px 0; }
.tests { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:4px 12px; margin:6px 0; }
.tests label { display:flex; gap:6px; align-items:center; justify-content:space-between; } .tests select { width:auto; flex:none; }
.paper { background:#fff; color:#000; padding:8px; border-radius:var(--r); }
#print { display:none; }
.col, label.f .col { font-family:var(--f-display); color:var(--accent); margin-right:4px; }
label.chk { display:flex; gap:6px; align-items:center; margin:4px 0; cursor:pointer; }
#app { height:100%; display:flex; flex-direction:column; }
.top { background:var(--brand); color:#fff; display:flex; align-items:center; gap:10px; padding:8px 14px; flex-wrap:wrap; }
.top .co { font-family:var(--f-display); font-weight:700; letter-spacing:.14em; font-size:.82rem; color:#9fc0ff; text-transform:uppercase; }
.top .app { font-family:var(--f-display); font-weight:600; font-size:1.3rem; }
.top .case-name { flex:1 1 160px; min-width:0; color:#d6e2f5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top .btn { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); }
.tabs { display:flex; gap:2px; padding:6px 10px 0; background:var(--surface-2); border-bottom:1px solid var(--line); overflow-x:auto; }
.tab { border:1px solid transparent; border-bottom:0; background:none; padding:6px 12px; border-radius:var(--r) var(--r) 0 0; cursor:pointer; white-space:nowrap; }
.tab.on { background:var(--surface); border-color:var(--line); font-weight:600; }
.tab[disabled] { color:var(--muted); cursor:not-allowed; }
.tab .n { display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent); text-align:center; font-size:.8rem; line-height:20px; margin-right:5px; }
.tab.done .n { background:var(--ok); color:#fff; }
.work { flex:1; display:grid; grid-template-columns:300px minmax(0,1fr); min-height:0; overflow:hidden; }
.panel { background:var(--surface); overflow:auto; padding:12px 14px; min-width:0; border-right:1px solid var(--line); }
.main { overflow:auto; padding:14px 18px 40px; min-width:0; }
.wrap { max-width:980px; }
.card { border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; margin:10px 0; background:var(--surface); }
.guide { background:var(--tip-soft); border-color:var(--tip); font-size:.88rem; }
.guide ol, .guide ul { margin:4px 0; padding-left:20px; }
.issue { display:block; width:100%; text-align:left; border:0; border-left:3px solid var(--tip); background:var(--tip-soft); padding:4px 8px; margin:3px 0; border-radius:4px; cursor:pointer; font-size:.86rem; }
.issue.warn { border-color:var(--warn); background:var(--warn-soft); }
.eyebrow { font-family:var(--f-display); text-transform:uppercase; letter-spacing:.08em; font-size:.8rem; color:var(--muted); font-weight:600; margin:8px 0 2px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 12px; }
.pair { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:6px; align-items:center; }
.pair .plus { color:var(--muted); font-weight:600; }
.preview { font-size:.85rem; color:var(--muted); margin-top:3px; }
.preview b { color:var(--ink); }
.q { color:var(--q); font-weight:600; }
table.ev { border-collapse:collapse; width:100%; } table.ev th, table.ev td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle; }
table.ev th { font-size:.82rem; color:var(--muted); font-weight:600; }
table.ev tr.nsig td.t input { color:var(--muted); }
table.ev td.n { width:30px; color:var(--muted); } table.ev td.tm { width:96px; } table.ev td.s { width:96px; } table.ev td.mv { width:110px; white-space:nowrap; }
.elist button { display:flex; gap:8px; width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:6px 8px; margin:4px 0; cursor:pointer; }
.elist button.on { border-color:var(--accent); background:var(--accent-soft); }
.elist .st { flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--line); text-align:center; line-height:16px; font-size:.75rem; }
.elist .st.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
.meas { display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:6px; align-items:center; margin:5px 0; }
.lt { font-weight:700; font-family:var(--f-display); font-size:1.05rem; color:var(--accent); text-align:center; }
.addrow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; margin:6px 0; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.chip { border:1px solid var(--line); background:var(--surface-2); border-radius:99px; padding:1px 9px; font-size:.82rem; cursor:pointer; }
.chip:hover { border-color:var(--accent); }
.aibar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0 10px; }
.rai-bg { position:fixed; inset:0; background:rgba(10,18,30,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:16px; }
.rai { background:var(--surface); color:var(--ink); border-radius:10px; padding:16px 18px; width:min(720px,100%); max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.rai-item { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); font-size:.9rem; cursor:pointer; }
.rai-item input { margin-top:4px; }
.nav { display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
.rate { display:inline-flex; gap:3px; }
.rb { border:1px solid var(--line); background:var(--surface); border-radius:4px; min-width:76px; padding:3px 6px; cursor:pointer; font-size:.85rem; }
.rb.on.r3 { background:var(--err); border-color:var(--err); color:#fff; } .rb.on.r2 { background:var(--warn); border-color:var(--warn); color:#fff; } .rb.on.r1 { background:var(--muted); border-color:var(--muted); color:#fff; }
.tw { overflow-x:auto; } table.st { border-collapse:collapse; width:100%; font-size:.88rem; } table.st th, table.st td { border:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
table.st th { background:var(--surface-2); }
table.st th .col { display:block; font-family:var(--f-display); color:var(--accent); }
.src { font-size:.78rem; color:var(--muted); margin-top:18px; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:7px 14px; border-radius:var(--r); z-index:60; font-size:.9rem; }
@media (max-width: 900px) {
  #app { height:auto; min-height:100%; } .work { grid-template-columns:minmax(0,1fr); overflow:visible; }
  .main { order:-1; padding:10px 12px 20px; }
  .panel { border-right:0; border-top:1px solid var(--line); }
  .panel .elist-w { display:none; }
  .meas { grid-template-columns:36px minmax(0,1fr) auto; }
  table.ev td.tm { width:74px; } table.ev td.mv { width:auto; }
  .top .co { display:none; }
}
@page { size:A4 landscape; margin:10mm; }
@media print { #app, .toast, .kit-tip { display:none !important; } #print { display:block; } body { background:#fff; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="co">Istec Training</span><span class="app">3CA Investigator</span>
    <span class="case-name" id="case-name"></span>
    <button class="btn" data-act="new" title="Start a new, empty case. Save the current case first if you want to keep it.">New</button>
    <button class="btn" data-act="open" title="Open a 3CA case file you saved before (.3ca-case.json).">Open</button>
    <button class="btn" data-manual="" title="Open the user manual for this tool.">User manual</button>
    <button class="btn" data-act="aiSettings" hidden title="Choose your AI provider and enter your own API key. The key stays in this browser and is never saved in case files.">AI settings</button>
    <button class="btn" data-act="save" title="Download this case as a file (.3ca-case.json) to keep or send.">Save</button>
    <input type="file" id="f-open" accept=".json,application/json" hidden>
    <input type="file" id="f-cb" accept=".json,application/json" hidden>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="work">
    <aside class="panel" id="panel"></aside>
    <section class="main" id="main"></section>
  </div>
</div>
<div id="print"></div>
<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';
      i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  async function permission(handle, ask) {
    if (!handle || !handle.queryPermission) return 'denied';
    try {
      let s = await handle.queryPermission({ mode: 'readwrite' });
      if (s !== 'granted' && ask) s = await handle.requestPermission({ mode: 'readwrite' });
      return s;
    } catch (e) { return 'denied'; }
  }
  /* opts: {tool, ext, label, mime} e.g. {tool:'tripod', ext:'.tripod.json', label:'Tripod Beta case'} */
  function FileLink(opts) {
    const types = [{ description: opts.label, accept: { [opts.mime || 'application/json']: [opts.ext.slice(opts.ext.lastIndexOf('.'))] } }];
    const key = id => 'handle:' + opts.tool + ':' + id;
    return {
      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {
        if (!hasFSA) { download(suggested, text, opts.mime || 'application/json'); return { handle: null, name: suggested, downloaded: true }; }
        let h;
        try { h = await window.showSaveFilePicker({ suggestedName: suggested, types, id: 'iikit-cases' }); }
        catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
        await this.write(h, text);
        await KitStore.set(key(id), h);
        return { handle: h, name: h.name };
      },
      async write(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); },
      /* Open a file; returns {handle|null, name, text} or null. */
      async open() {
        if (hasFSA) {
          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }
          catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
          const f = await hs[0].getFile();
          return { handle: hs[0], name: f.name, text: await f.text(), modified: f.lastModified };
        }
        const f = await pickWithInput(opts.ext + ',.json,application/json');
        return f ? { handle: null, name: f.name, text: await f.text(), modified: f.lastModified } : null;
      },
      async link(id, h) { if (h) await KitStore.set(key(id), h); },
      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },
      permission,
      download: (name, text) => download(name, text, opts.mime || 'application/json')
    };
  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));
        localStorage.setItem(RK, JSON.stringify(L.slice(-500)));
      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };
  /* action summary helper: items [{status, due}] with open statuses */
  function actionStats(items, isOpen, dueOf) {
    const today = new Date().toISOString().slice(0, 10);
    let open = 0, overdue = 0; const dues = [];
    (items || []).forEach(a => { if (isOpen(a)) { open++; const d = dueOf(a); if (d) dues.push(String(d).slice(0, 10)); if (d && d < today) overdue++; } });
    return { total: (items || []).length, open, overdue, dues };
  }

  /* ---------- dashboard -> tool hand-off ---------- */
  const KitHandoff = {
    async put(tool, handle, name) { return KitStore.set('handoff:' + tool, { handle, name, at: Date.now() }); },
    async take(tool) { const v = await KitStore.get('handoff:' + tool); await KitStore.del('handoff:' + tool); return v && Date.now() - v.at < 10 * 60000 ? v : null; }
  };

  return { VERSION, hasFSA, hasDirPicker, KitStore, FileLink, KitRegistry, KitHandoff, actionStats, download, pickWithInput, permission };
})();
if (typeof module !== 'undefined') module.exports = KIT;

/* KitTips: hover tips with a 0.4 s delay for every element that has a title (or data-tip).
   The title moves to data-tip on first hover, so the browser's own slow tip does not also appear;
   icon-only controls keep an aria-label. On touch screens a long press (0.5 s) shows the tip. */
(function () {
  'use strict';
  const DELAY = 400, PRESS = 500;
  let tip = null, timer = 0, cur = null;
  function box() {
    if (tip) return tip;
    const s = document.createElement('style');
    s.textContent = '.kit-tip{position:fixed;z-index:2147483000;max-width:320px;padding:6px 9px;border-radius:6px;background:#1f252c;color:#fff;font:12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .12s}.kit-tip.on{opacity:1}@media print{.kit-tip{display:none}}';
    document.head.appendChild(s);
    tip = document.createElement('div'); tip.className = 'kit-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
    return tip;
  }
  function target(el) {
    const t = el && el.closest && el.closest('[title],[data-tip]');
    if (!t || t.closest('svg') && t.tagName.toLowerCase() === 'title') return null;
    if (t.hasAttribute('title')) {
      const v = t.getAttribute('title');
      if (v) { t.setAttribute('data-tip', v); if (!t.getAttribute('aria-label') && !t.textContent.trim()) t.setAttribute('aria-label', v); }
      t.removeAttribute('title');
    }
    return t.getAttribute('data-tip') ? t : null;
  }
  function show(t) {
    const b = box(); b.textContent = t.getAttribute('data-tip');
    const r = t.getBoundingClientRect(); b.style.left = '0px'; b.style.top = '0px'; b.classList.add('on');
    const w = b.offsetWidth, h = b.offsetHeight, vw = innerWidth;
    let y = r.bottom + 6; if (y + h > innerHeight - 4) y = Math.max(4, r.top - h - 6);
    b.style.left = Math.max(4, Math.min(vw - w - 4, r.left + r.width / 2 - w / 2)) + 'px'; b.style.top = y + 'px';
  }
  function hide() { clearTimeout(timer); cur = null; if (tip) tip.classList.remove('on'); }
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const t = target(e.target); if (t === cur) return;
    hide(); if (!t) return; cur = t; timer = setTimeout(() => { if (cur === t && t.isConnected) show(t); }, DELAY);
  }, true);
  document.addEventListener('pointerout', e => { if (cur && !cur.contains(e.relatedTarget)) hide(); }, true);
  document.addEventListener('pointerdown', e => {
    hide();
    if (e.pointerType !== 'touch') return;
    const t = target(e.target); if (!t) return;
    cur = t; timer = setTimeout(() => { if (cur === t) { show(t); setTimeout(hide, 2500); } }, PRESS);
  }, true);
  ['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, e => { if (e.pointerType === 'touch' && !(tip && tip.classList.contains('on'))) hide(); }, true));

window.TOOL_MANUAL = {"title":"3CA Investigator · User manual","html":"\n<h1 id=\"start\">3CA Investigator: user manual</h1>\n<p>Version 1.5.7 (26 Nov 2026). This manual explains how to work through a 3CA analysis in the tool, step by step, and how to print the worksheet. Most pictures use a short fictional example made for this manual: <b>MAN-3C-01, caustic splash at drain valve DV-7</b>. The Step 1 picture shows the practice case <b>3C-EX-01</b> that is built into the tool.</p>\n<div class=\"tip\">3CA is Control Change Cause Analysis. The tool follows the <b>NRI-3 (2007) 3CA Control Change Cause Analysis Investigator's Manual, 2nd edition, Draft 1.3</b>, by J. Kingston for the Noordwijk Risk Initiative Foundation. Get the manual itself from <b>www.nri.eu.com</b>. The column headings in the tool are the manual's. The guidance in the tool and in this user manual is our own summary, not the manual's text.</div>\n\n<h2 id=\"about\">1. What the tool is for</h2>\n<p>3CA looks at an incident as a series of <b>changes</b>. Some changes made the situation more dangerous or took away control. For each of these <b>significant events</b> you ask:</p>\n<ul>\n  <li>What changed, and who or what made it change?</li>\n  <li>Which <b>barriers</b> or <b>work controls</b> could have stopped the change or made it smaller?</li>\n  <li>In what way did each of them not work?</li>\n  <li>Which <b>processes</b> should have put them in place or picked up the problem?</li>\n  <li>Which <b>management arrangements</b> let those processes fail?</li>\n</ul>\n<p>The answers go on one worksheet with columns (0) to (8). Anything you do not know yet, you write as \"?\". The tool collects every \"?\" into a list of <b>further enquiries</b>. That list is a result of the analysis, not a failure.</p>\n\n<h2 id=\"quick-start\">2. Quick start</h2>\n<ol>\n  <li><b>Step 1:</b> type the case details and list all the events in time order. Tick the significant ones. Or load the practice case, or <span class=\"ui\">Import events from Casebook</span>.</li>\n  <li><b>Step 2:</b> for each significant event, fill in columns (1) to (4).</li>\n  <li><b>Step 3:</b> rate each event 3, 2 or 1, and choose which rows to analyse further.</li>\n  <li><b>Steps 4 to 6:</b> for each barrier or control on those rows, fill in columns (6), (7) and (8).</li>\n  <li><b>Step 7:</b> deal with the \"?\" list, record the independent review, then <span class=\"ui\">Print / PDF</span> or <span class=\"ui\">Word</span>.</li>\n  <li>Click <span class=\"ui\">Save</span> often. It downloads the case as a <code>.3ca-case.json</code> file.</li>\n</ol>\n\n<h2 id=\"screen\" class=\"page\">3. The screen</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1 . Use <span class=\"ui\">↑</span> <span class=\"ui\">↓</span> to put them in order. An event you leave out is a gap in the analysis.</li>\n  <li>Then, in one pass, tick <b>Significant</b> for each event that made later events more dangerous or took away control over them.</li>\n</ol>\n<p>Stay at the level of the work itself. Decisions by managers are picked up later, in columns (7) and (8).</p>\n<h3>Where the events can come from</h3>\n<ul>\n  <li><span class=\"ui\">Training case 3C-EX-01</span> (empty case only): a contractor worker drowned at an overflowing dam (fictional mine). Some events are missing on purpose: finding them is part of the exercise.</li>\n  <li><span class=\"ui\">Import events from Casebook</span>: choose a <code>.casebook-case.json</code> file exported from the Storyline Casebook. The events come in time order from all the storyline timelines, unticked. Case details only fill empty fields.</li>\n</ul>\n\n<h2 id=\"step2\" class=\"page\">5. Step 2: Describe each event, columns (1) to (4)</h2>\n<p>Work on one significant event at a time. Choose it in the list on the left, or with <span class=\"ui\">← Previous</span> and <span class=\"ui\">Next →</span>.</p>\n<table>\n  <tr><th>Column</th><th>What to write</th><th>Manual example</th></tr>\n  <tr><td>(1) What is the effect on risk or control?</td><td>Why this event is in the analysis: the risk it created or the control it took away.</td><td>No one controls the open drain</td></tr>\n  <tr><td>(2) What is the change?</td><td>The change that <b>defines</b> the event, as object or situation + attribute changed. Not what it caused later.</td><td>open drain + unattended</td></tr>\n  <tr><td>(3) What is the agent of change and action?</td><td>Who or what made the change happen + the action, in the present tense, with a verb that takes an object.</td><td>Fitter + leaves [the area]</td></tr>\n  <tr><td>(4) What work controls or protective barriers could have been effective on (2) or (3)</td><td>Each measure that could have stopped the change or made it smaller. Include ones a rule or standard asked for, and ones that could simply have helped.</td><td>(b) Open drains recorded on the handover log</td></tr>\n</table>\n<ul>\n  <li>A <b>barrier</b> protects against an unwanted change. A <b>work control</b> makes a wanted change happen and protects as a side effect. You do not need to say which one it is.</li>\n  <li>Each measure gets a letter: (a), (b), (c)… If the same measure also fits another event, use <span class=\"ui\">Reuse</span> so it keeps its letter.</li>\n  <li><b>Ideas: the 10 phrases</b> gives starting words such as \"Barrier between…\" or \"Use less of…\". Apply them to the nouns and verbs in (2) and (3).</li>\n  <li>The line under (2) and (3) shows the whole sentence as you type.</li>\n  <li>Not known? Write \"?\". It goes on the further enquiries list.</li>\n</ul>\n\n<h2 id=\"step3\">6. Step 3: Prioritise, column (5)</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RV >: A4 landscape. Choose \"Save as PDF\" in the print window to make a PDF.</li>\n  <li><span class=\"ui\">Word</span>: downloads a <code>.doc</code> file that opens in Microsoft Word, landscape.</li>\n</ul>\n<p>The report has the case details, the full worksheet (0) to (8), the further enquiries with their status, and the review record. Columns (6) to (8) of a measure appear on the first row that uses its letter.</p>\n\n<h2 id=\"saving\">11. Saving your work</h2>\n<ul>\n  <li>The tool keeps your case in the browser of the device you are using. That copy does not travel with a USB stick and is lost if the browser data is cleared.</li>\n  <li><span class=\"ui\">Save</span> downloads the case as <code>&lt;title&gt;.3ca-case.json</code>. On the USB kit, move it into <b>My cases</b>. On a phone or tablet it goes to Downloads (Files on an iPhone or iPad).</li>\n  <li><span class=\"ui\">Open</span> loads a saved file. <span class=\"ui\">New</span> starts an empty case: click it twice within 3 seconds. Save first if you want to keep the current case.</li>\n  <li>START HERE on the USB kit lists the <code>.3ca-case.json</code> files in My cases. <span class=\"ui\">Open</span> there brings the case into the tool.</li>\n</ul>\n\n<h2 id=\"ai\" class=\"page\">12. Using AI to help you</h2>\n<p>Each step has a ✦ button. The AI reads the case so far and suggests text for that step. You tick the suggestions you want; nothing is added without your tick.</p>\n<table>\n  <tr><th>Step</th><th>Button</th><th>What it suggests</th></tr>\n  <tr><td>1</td><td>Suggest events</td><td>Events from the summary that are not listed yet, and events to mark significant</td></tr>\n  <tr><td>2</td><td>Draft columns (1) to (4)</td><td>The effect, the change, the agent and action, and barriers or controls for the selected event. A measure already listed keeps its letter.</td></tr>\n  <tr><td>3</td><td>Suggest ratings</td><td>A rating for each event, with a reason</td></tr>\n  <tr><td>4</td><td>Draft column (6)</td><td>Expected and actual behaviour for each measure</td></tr>\n  <tr><td>5</td><td>Suggest processes</td><td>Processes from the manual's list, or a decision to assume the risk</td></tr>\n  <tr><td>6</td><td>Draft column (8)</td><td>A management arrangement and why, for each process without one</td></tr>\n  <tr><td>7</td><td>Check the analysis</td><td>Points to look at. Ticked points go into the review comments, marked as an AI check. It does not replace the independent review.</td></tr>\n</table>\n<p>The AI is told to write \"?\" for facts it does not have. Check every suggestion against your evidence.</p>\n<h3>Setting up your own AI key</h3>\n<ol>\n  <li>Get an API key from Anthropic (Claude), OpenAI or Google (Gemini). The provider bills the owner of the key.</li>\n  <li>Click <span class=\"ui\">AI settings</span>, choose the provider, paste the key and click <span class=\"ui\">Test connection</span>.</li>\n  <li>Leave <b>Remember on this device</b> off on shared computers, then click <span class=\"ui\">Save</span>.</li>\n</ol>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACpQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCpQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAA s is right: that is the job of the team and the independent reviewer.</li>\n  <li>Cases are saved as files you download. The tool does not keep a linked file up to date as the other toolkit tools can.</li>\n</ul>\n\n<h2 id=\"trouble\">15. Troubleshooting</h2>\n<table>\n  <tr><th>Problem</th><th>Fix</th></tr>\n  <tr><td>Steps 4 to 6 say no measures are taken forward</td><td>In Step 3, give the rows a rating and tick <b>Analyse further</b>. The measures must be linked to those rows in Step 2.</td></tr>\n  <tr><td>A \"?\" stays on the list after I answered it</td><td>Replace the \"?\" in the worksheet field itself. The status alone does not change the worksheet.</td></tr>\n  <tr><td>\"This is not a 3CA case file\"</td><td>Use <span class=\"ui\">Open</span> for <code>.3ca-case.json</code> files and <span class=\"ui\">Import events from Casebook</span> for <code>.casebook-case.json</code> files.</td></tr>\n  <tr><td>My case is gone on another computer</td><td>The browser copy stays on the first computer. Use <span class=\"ui\">Open</span> and choose the file you saved.</td></tr>\n  <tr><td>The Training case button is missing</td><td>It shows only in an empty case. Save your work, click <span class=\"ui\">New</span> twice, and it appears in Step 1.</td></tr>\n</table>\n"};

  // Section 2.6.2: the second reason behind an ineffective measure, offered beside the 17 processes in column (7)
  const ASSUMED_RISK = 'Decision to assume the risk';
  // Task step (xi): what can happen to a "?" by the end of the investigation
  const STATUS = { open: 'Open', answered: 'Answered (update the worksheet)', research: 'Separate research recommended', accepted: 'Uncertainty accepted' };
  // Task steps (viii)-(x): judgemental rather than factual words (manual: "inadequate", "not adequate", "housekeeping was poor")
  const JUDGE = /\b(inadequate(ly)?|not adequate|insufficient(ly)?|poor(ly)?|careless(ly|ness)?|negligen(t|ce)|improper(ly)?|inappropriate(ly)?|unsatisfactory|lack of|lacking|deficient|human error|complacen(t|cy)|substandard|sloppy)\b/i;

  const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const has = s => !!String(s || '').trim();
  const q = s => /\?/.test(String(s || ''));

  function blank(title) {
    return { format: FORMAT, version: 1, id: uid(), created: new Date().toISOString(),
      meta: { title: title || '', ref: '', date: '', location: '', team: '', summary: '' }, events: [], measures: [], enq: {}, review: { by: '', date: '', comments: '' } };
  }
  function event(c, text, sig) {
    const e = { id: uid(), text: text || '', time: '', sig: sig !== false, effect: '', change: { obj: '', attr: '' }, agent: { who: '', action: '' },
      measures: [], rating: null, forward: true };
    c.events.push(e); return e;
  }
  const ev = (c, id) => c.events.find(e => e.id === id);
  const significant = c => c.events.filter(e => e.sig);
  function remove(c, id) {
    c.events = c.events.filter(e => e.id !== id);
  }
  function move(c, id, d) {
    const i = c.events.findIndex(e => e.id === id), j = i + d;
    if (i < 0 || j < 0 || j >= c.events.length) return;
    [c.events[i], c.events[j]] = [c.events[j], c.events[i]];
  }
  // Barriers and controls are case-wide so one measure keeps its letter on every row (task step vi)
  function addMeasure(c, text) {
    const m = { id: uid().replace(/^e/, 'm'), text: text || '', how: '', procs: [] };
    c.measures.push(m); return m;
  }
  function link(c, eid, mid) { const e = ev(c, eid); if (e && !e.measures.includes(mid)) e.measures.push(mid); }
  function unlink(c, eid, mid) { const e = ev(c, eid); if (e) e.measures = e.measures.filter(x => x !== mid); }
  function dropMeasure(c, mid) { c.measures = c.measures.filter(m => m.id !== mid); c.events.forEach(e => { e.measures = e.measures.filter(x => x !== mid); }); }
  function letter(c, mid) {
    let i = c.measures.findIndex(m => m.id === mid); if (i < 0) return '?';
    let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(97 + r) + s; i = Math.floor((i - 1) / 26); }
    return '(' + s + ')';
  }
  // Column (7) entries hang off a measure; each carries its own column (8) answer (task step x: one process at a time)
  function addProc(c, mid, name) {
    const m = c.measures.find(x => x.id === mid); if (!m) return null;
    const p = { id: uid().replace(/^e/, 'p'), name: name || '', text: '', tests: {}, arr: '', why: '' };
    m.procs.push(p); return p;
  }
  function dropProc(c, pid) { c.measures.forEach(m => { m.procs = m.procs.filter(p => p.id !== pid); }); }
  // Measures taken forward to columns (6)-(8), highest-rated rows first (task step viii: "in order of priority")
  function forward(c) {
    const top = m => Math.max(0, ...c.events.filter(e => e.sig && e.forward && e.measures.includes(m.id)).map(e => e.rating || 0.5));
    return c.measures.filter(m => top(m) > 0).sort((a, b) => top(b) - top(a) || c.measures.indexOf(a) - c.measures.indexOf(b));
  }
  const changeText = e => [e.change.obj, e.change.attr].filter(has).join(' ');
  const agentText = e => [e.agent.who, e.agent.action].filter(has).join(' ');
  const described = e => has(e.effect) && has(e.change.obj) && has(e.change.attr) && has(e.agent.who) && has(e.agent.action) && e.measures.length > 0;

  // "?" entries are a deliverable: every field holding a "?" goes on the list of further enquiries (task steps iv, v, ix, x, xi)
  function enquiries(c) {
    const L = [];
    significant(c).forEach((e, i) => {
      const n = '[' + (i + 1) + ']';
      [['(1)', e.effect], ['(2)', changeText(e)], ['(3)', agentText(e)]].forEach(([col, t]) => { if (q(t)) L.push({ key: e.id + col, col, where: n + ' ' + col, text: t }); });
    });
    c.measures.forEach(m => {
      const l = letter(c, m.id);
      [['(4)', m.text], ['(6)', m.how]].forEach(([col, t]) => { if (q(t)) L.push({ key: m.id + col, col, where: l + ' ' + col, text: t }); });
      m.procs.forEach(p => {
        if (q(p.text)) L.push({ key: p.id + '(7)', col: '(7)', where: l + ' (7) ' + p.name, text: p.text });
        if (p.name === ASSUMED_RISK) ASSUMED.forEach(t => { if (p.tests[t] === '?') L.push({ key: p.id + t, col: '(7)', where: l + ' (7) assumed risk', text: 'Decision to assume the risk: ' + t + '?' }); });
        if (q(p.why)) L.push({ key: p.id + '(8)', col: '(8)', where: l + ' (8) ' + (p.arr || ''), text: p.why });
      });

    return L;
  }

  // Checks are guidance (never block). sev 'warn' = something the worksheet still needs; 'tip' = method advice.
  function check(c) {
    const L = [], add = (code, sev, step, msg, at) => L.push({ code, sev, step, msg, at: at || null });
    const S = significant(c);
    if (!c.events.length) add('3C-1', 'warn', 1, 'List the events of the incident, then mark the significant ones (task step ii).');
    else if (!S.length) add('3C-1', 'warn', 1, 'No significant events yet: mark the events that significantly increase risk or decrease control of later events (task step ii).');
    c.events.forEach((e, i) => { if (!has(e.text)) add('3C-0', 'warn', 1, 'Event ' + (i + 1) + ' has no description.', e.id); });
    S.forEach((e, i) => {
      const n = '[' + (i + 1) + '] ';
      if (!has(e.effect)) add('3C-2', 'warn', 2, n + 'Column (1): say in what way the event is significant, the risk created or the control lost (task step iii).', e.id);
      if (!has(e.change.obj) || !has(e.change.attr)) add('3C-3', 'warn', 2, n + 'Column (2): describe the change as [object or situation] + [attribute changed]; write "?" if unknown (task step iv).', e.id);
      if (!has(e.agent.who) || !has(e.agent.action)) add('3C-4', 'warn', 2, n + 'Column (3): describe the agency of change as [agent] + [action]; write "?" if unknown (task step v).', e.id);
      else if (/^\s*\w+(ed|ing)\b/i.test(e.agent.action)) add('3C-4', 'tip', 2, n + 'Column (3): state the action in the present tense with a verb that takes an object (e.g. "closes [the valve]") (task step v).', e.id);
      if (!e.measures.length) add('3C-5', 'warn', 2, n + 'Column (4): name the barriers or work controls that could have prevented the change or limited its degree (task step vi).', e.id);

    c.measures.forEach(m => { if (!has(m.text)) add('3C-5', 'warn', 2, letter(c, m.id) + ' has no description.'); else if (!c.events.some(e => e.sig && e.measures.includes(m.id))) add('3C-5', 'tip', 2, letter(c, m.id) + ' is not linked to any significant event.'); });
    const rated = S.filter(e => e.rating);
    S.forEach((e, i) => { if (!e.rating) add('3C-6', 'warn', 3, '[' + (i + 1) + '] Column (5): give a significance rating, 3 High, 2 Medium or 1 Low (task step vii).', e.id); });
    if (rated.length && !rated.some(e => e.rating === 3)) add('3C-6', 'tip', 3, 'Start the rating with the most important event and rate it 3 (High); rate the others against it (task step vii).');
    if (S.some(e => e.rating && !e.forward)) add('3C-7', 'tip', 3, 'Rows left out of further analysis: ask others to review this decision (task step vii).');
    const F = forward(c), judge = (t, code, step, where) => { const w = JUDGE.exec(t || ''); if (w) add(code, 'tip', step, where + ': "' + w[0] + '" is a judgement. State the observable facts instead.'); };
    F.forEach(m => {
      const l = letter(c, m.id);
      if (!has(m.how)) add('3C-8', 'warn', 4, l + ' Column (6): say in what way this measure was ineffective, expected vs actual behaviour (task step viii).', m.id);
      else judge(m.how, '3C-8', 4, l + ' (6)');
      if (has(m.how) && !m.procs.length) add('3C-9', 'warn', 5, l + ' Column (7): name the processes that should have implemented or monitored this measure, or the decision to assume the risk (task step ix).', m.id);
      m.procs.forEach(p => {
        const w = l + ' (7) ' + (p.name || 'process');
        if (!has(p.name)) add('3C-9', 'warn', 5, l + ' Column (7): choose the process.', m.id);
        if (!has(p.text)) add('3C-9', 'warn', 5, w + ': line up the facts of how the process created or permitted the problem in (6), and the norm that applies (task step ix).', m.id);
        else judge(p.text, '3C-9', 5, w);
        if (p.name === ASSUMED_RISK && ASSUMED.some(t => !p.tests[t])) add('3C-9', 'warn', 5, l + ' Assumed risk: answer all five tests (right person, time, way, information, periodic review) (section 2.6.2).', m.id);
        if (!has(p.arr) || !has(p.why)) add('3C-10', 'warn', 6, w + ' Column (8): name the management arrangement and why it let the process fail (task step x).', m.id);
        else judge(p.why, '3C-10', 6, l + ' (8)');
      });
    });
    const E = enquiries(c);
    if (E.some(x => x.status === 'open')) add('3C-11', 'tip', 7, E.filter(x => x.status === 'open').length + ' further enquiries still open. Remove each "?" the facts allow, or record what happens to it (task step xi).');
    E.filter(x => x.status === 'answered').forEach(x => add('3C-11', 'tip', 7, x.where + ' is marked answered: replace the "?" in the worksheet with the fact.'));
    const r = c.review || {};
    if (F.length && (!has(r.by) || !has(r.date))) add('3C-12', 'warn', 7, 'Record the independent review of the analysis: reviewer and date (task step xi).');
    return L;
  }

  // Events from a Storyline Casebook case package, in time order across the timelines (task step i).
  // Imported unmarked: deciding which events are significant is task step (ii).
  function fromCasebook(o) {
    if (!o || o.format !== 'storyline-casebook-case' || !Array.isArray(o.events)) throw new Error('This is not a Casebook case file (.casebook-case.json).');
    const k = o.case || {}, mins = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
    const L = o.events.slice().sort((a, b) => (a.lane || 0) - (b.lane || 0) || (a.order || 0) - (b.order || 0));
    let last = {};   // an untimed event keeps the time of the one before it on its timeline
    L.forEach(e => { const m = mins(e.time); e._k = m == null ? (last[e.lane || 0] == null ? -1 : last[e.lane || 0]) : m; last[e.lane || 0] = e._k; });
    const events = L.map((e, i) => ({ e, i })).sort((a, b) => a.e._k - b.e._k || a.i - b.i).map(({ e }) => ({ time: String(e.time || ''), text: String(e.text || '') })).filter(e => has(e.text));
    return { meta: { title: k.caseTitle || '', date: k.dateOccurred || '', location: [k.facility, k.location].filter(has).join(', '), summary: k.refinedDescription || k.initialDescription || '' }, events };
  }

  function load(o) {
    if (!o || o.format !== FORMAT || !Array.isArray(o.events)) throw new Error('This is not a 3CA case file (.3ca-case.json).');
    const c = Object.assign(blank(), o);
    c.meta = Object.assign(blank().meta, o.meta || {});
    c.measures = (o.measures || []).map(m => Object.assign({ id: uid(), text: '', how: '' }, m,
      { procs: (m.procs || []).map(p => Object.assign({ id: uid(), name: '', text: '', arr: '', why: '' }, p, { tests: Object.assign({}, p.tests) })) }));
    c.enq = Object.assign({}, o.enq); c.review = Object.assign({ by: '', date: '', comments: '' }, o.review);
    const ids = new Set(c.measures.map(m => m.id));
    c.events = o.events.map(e => Object.assign({ id: uid(), text: '', time: '', sig: true, effect: '', rating: null, forward: true }, e,
      { change: Object.assign({ obj: '', attr: '' }, e.change), agent: Object.assign({ who: '', action: '' }, e.agent),
        measures: (e.measures || []).filter(x => ids.has(x)) }));
    return c;
  }

  const api = { FORMAT, SOURCE, COLS, PHRASES, CRITERIA, RATING, PROCESSES, ASSUMED, ARRANGEMENTS, WIDER, ASSUMED_RISK, STATUS, JUDGE,
    blank, event, ev, significant, remove, move, addMeasure, link, unlink, dropMeasure, addProc, dropProc, forward, fromCasebook, letter, changeText, agentText, described, enquiries, check, load };
  if (typeof module === 'object' && module.exports) module.exports = api; else root.CA3 = api;
})(this);

/* Training case 3C-EX-01: dam drowning (learner starter). Same fictional event as Casebook CB-EX-02 and Tripod TB-EX-09.

      summary: 'After heavy rain higher up in the catchment, the north return-water dam rose quickly and overflowed, and the pump installation at the dam was flooded. ' +

<script>/* 3CA Investigator UI. Steps follow the NRI 3CA task steps; column numbers are the worksheet's. */
(function () {
  'use strict';
  const M = window.CA3, KEY = 'iikit.3ca.case';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const STEPS = [
    { n: 1, t: 'Significant events', tip: 'Task steps (i)-(ii), column (0): list the events in order and mark the significant ones.' },
    { n: 2, t: 'Describe each event', tip: 'Task steps (iii)-(vi), columns (1)-(4), one event at a time.' },
    { n: 3, t: 'Prioritise', tip: 'Task step (vii), column (5): significance rating.' },
    { n: 4, t: 'Ineffective measures', tip: 'Task step (viii), column (6): in what way each barrier or control was ineffective.' },
    { n: 5, t: 'Processes', tip: 'Task step (ix), column (7): the processes that should have prevented the problem, or the decision to assume the risk.' },
    { n: 6, t: 'Management', tip: 'Task step (x), column (8): why each process was not effective.' },
    { n: 7, t: 'Review', tip: 'Task step (xi): further enquiries, independent review, worksheet and report.' }
  ];
  let c = restore() || M.blank(), step = 1, sel = null, armNew = 0, handoff = null;

  function save() { c.updated = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) { /* private window: Save to file still works */ } }
  function restore() { try { const s = localStorage.getItem(KEY); if (s) return M.load(JSON.parse(s)); } catch (e) { } return null; }
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
  const S = () => M.significant(c);
  const num = id => S().findIndex(e => e.id === id) + 1;
  const FWD = () => M.forward(c);
  const proc = id => c.measures.flatMap(m => m.procs).find(p => p.id === id);
  const fname = ext => (c.meta.title || '3CA case').replace(/[\\/:*?"<>|]+/g, '-') + ext;
  function download(name, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function selEvent() { const L = S(); if (!L.some(e => e.id === sel)) sel = L.length ? L[0].id : null; return sel && M.ev(c, sel); }

  /* ---------- render ---------- */
  function render() {
    $('#case-name').textContent = (c.meta.ref ? c.meta.ref + ' · ' : '') + (c.meta.title || 'Untitled case');
    const ho = handoff ? `<div class="card guide">START HERE asked to open <b>${esc(handoff.name)}</b>. <button class="btn pri sm" data-act="takeHandoff">Open ${esc(handoff.name)}</button> <button class="btn sm" data-act="dropHandoff">Not now</button></div>` : '';
    $('#main').innerHTML = '<div class="wrap">' + ho + [, step1, step2, step3, step4, step5, step6, step7][step]() + `<p class="src">${esc(M.SOURCE)}</p></div>`;
    $('#panel').innerHTML = panel();
    refresh();
  }
  // Updates only the parts that change while typing, so focus is never lost
  function refresh() {
    const issues = M.check(c), here = issues.filter(i => i.step === step);
    $('#tabs').innerHTML = STEPS.map(s => {
      const done = !issues.some(i => i.step === s.n && i.sev === 'warn') && S().length && (s.n <= 3 || FWD().length);
      return `<button class="tab${s.n === step ? ' on' : ''}${done ? ' done' : ''}" data-step="${s.n}" title="${esc(s.tip)}"><span class="n">${s.n}</span>${esc(s.t)}</button>`;
    }).join('');
    const box = $('#checks');
    if (box) box.innerHTML = here.length ? here.map(i => `<button class="issue ${i.sev}" data-go="${i.step}" data-at="${i.at || ''}" title="${i.code}: go to this item">${esc(i.msg)}</button>`).join('')
      : '<p class="small muted">No checks open for this step.</p>';
    const enq = M.enquiries(c), eb = $('#enq');
    if (eb) eb.innerHTML = enq.length ? '<ul class="small">' + enq.map(x => `<li><b>${esc(x.where)}</b> <span class="q">${esc(x.text)}</span></li>`).join('') + '</ul>' : '<p class="small muted">None yet. Write "?" in any column you cannot answer yet and it is listed here.</p>';
    const el = $('#elist');
    if (el) el.innerHTML = S().map((e, i) => `<button data-sel="${e.id}" class="${e.id === sel ? 'on' : ''}" title="Work on this event"><span class="st ${M.described(e) ? 'ok' : ''}">${M.described(e) ? '✓' : i + 1}</span><span>${esc(e.text || '(no description)')}</span></button>`).join('') || '<p class="small muted">No significant events yet (Step 1).</p>';
