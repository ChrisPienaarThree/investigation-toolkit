    if (pv && e) { pv.innerHTML = 'Change: <b>' + esc(M.changeText(e) || '…') + '</b>'; $('#pv-agent').innerHTML = 'Agency of change: <b>' + esc(M.agentText(e) || '…') + '</b>'; }
  }

  function panel() {
    const guide = {
      1: `<div class="card guide"><b>Column (0) Significant Events</b><p>An event is a moment of change. A <b>significant event</b> is one that decreases control over later events and/or increases the risk of later unwanted events.</p>
          <ol><li>Study all the information first.</li><li>List <b>all</b> the events in time order (a sequence method such as ECFA+ or STEP helps). Missing events make the analysis incomplete.</li><li>Tick the significant ones in one pass.</li><li>Stay at the operational level: management decisions are picked up later, in columns (7) and (8).</li></ol></div>`,
      2: `<div class="card guide"><b>One event at a time</b><ul><li><b>(1)</b> Why include it: the risk created or the control lost. Make the reason clear to an independent reader.</li>
          <li><b>(2)</b> The change that defines the event, not what it caused: "pen falls", not "pen hits floor".</li><li><b>(3)</b> Who or what makes the change happen, with a present-tense verb that takes an object: "Operator closes [valve]".</li>
          <li><b>(4)</b> Barriers protect from unwanted change; work controls achieve wanted change and protect as a by-product. Include measures a norm required and ones that could have helped. Which kind it is does not affect the analysis.</li></ul></div>`,
      3: `<div class="card guide"><b>Column (5) Significance Rating</b><p>Start with the most important event: rate it 3 (High). Rate the next one against it: equally important = same rating, otherwise one lower. Repeat for all events.</p>
          <p>Criteria for importance:</p><ul>${M.CRITERIA.map(x => '<li>' + esc(x) + '</li>').join('')}</ul><p>If you drop rows (e.g. all rated 1) from further analysis, ask others to review that decision.</p></div>`,
      4: `<div class="card guide"><b>Column (6) In what way was it ineffective?</b><ul><li>One barrier or control at a time, highest-rated rows first. The letters are the ones from column (4).</li>
          <li>Write what the measure should have done, and what it actually did in the event (or that it was not there).</li><li>Stick to facts you could observe. Words such as "inadequate", "poor" or "insufficient" are judgements: they blur the rest of the analysis.</li>
          <li>Behaviour not known yet? Write "?" and come back when you have more facts.</li></ul></div>`,
      5: `<div class="card guide"><b>Column (7) Processes</b><p>A measure is ineffective for one of two reasons:</p><ol><li>It was not put in place, not put in place properly, or not monitored. Find the processes that should have put it in place or picked up the problem.</li>
          <li>The problem was known and accepted beforehand. Choose <b>${esc(M.ASSUMED_RISK)}</b> and test that decision: ${M.ASSUMED.map(esc).join(', ')}.</li></ol>
          <p>For each process, line up the facts of how it created or allowed the problem in (6), name the norm (procedure, standard) behind each "should", and ask whether that norm is itself good enough. Use the organisation's own terms.</p></div>`,
      6: `<div class="card guide"><b>Column (8) Management arrangements</b><p>Take one process statement at a time. Which management arrangement created or allowed the problem, and how?</p><ul>${M.ARRANGEMENTS.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>
          <p>Do not stop at these: ${M.WIDER.map(x => esc(x.toLowerCase())).join(', ')} can explain the changes just as well. Write facts, not judgements.</p></div>`,
      7: `<div class="card guide"><b>Review</b><ul><li>Keep the analysis open until the investigation ends.</li><li>Take out every "?" the facts allow. For the rest, record what happens: separate research, or the uncertainty is accepted. The "?" list is a result of the analysis, not a failure.</li>
          <li>Check new facts for significant events you missed.</li><li>Ask someone who did not do the analysis to review it, and record that here.</li></ul></div>`
    }[step];
    return (step === 2 ? '<div class="elist-w"><div class="eyebrow">Significant events</div><div class="elist" id="elist"></div></div>' : '') + guide +
      `<p><button class="btn sm" data-manual="step${step}" title="Open the user manual at this step.">More in the user manual</button></p>` +
      '<div class="eyebrow">Checks</div><div id="checks"></div><div class="eyebrow">Further enquiries ("?")</div><div id="enq"></div>';
  }

  function step1() {
    const m = c.meta, f = (k, label, tip, type) => `<div><label class="f" for="m-${k}">${label}</label><input type="${type || 'text'}" id="m-${k}" data-meta="${k}" value="${esc(m[k])}" title="${esc(tip)}"></div>`;
    const rows = c.events.map((e, i) => `<tr class="${e.sig ? '' : 'nsig'}"><td class="n">${i + 1}</td>
      <td class="tm"><input type="text" data-e="time" data-id="${e.id}" value="${esc(e.time)}" placeholder="time" aria-label="Time of event ${i + 1}" title="Optional: time or date, to keep the order clear."></td>
      <td class="t"><input type="text" data-e="text" data-id="${e.id}" value="${esc(e.text)}" placeholder="What happened (one event: one moment of change)" aria-label="Event ${i + 1}"></td>
      <td class="s"><label class="chk" title="Significant: decreases control over later events and/or increases the risk of later unwanted events."><input type="checkbox" data-e="sig" data-id="${e.id}" ${e.sig ? 'checked' : ''}>Significant</label></td>
      <td class="mv"><button class="btn sm" data-act="up" data-id="${e.id}" title="Move up" aria-label="Move event ${i + 1} up">↑</button> <button class="btn sm" data-act="down" data-id="${e.id}" title="Move down" aria-label="Move event ${i + 1} down">↓</button> <button class="btn sm danger" data-act="del" data-id="${e.id}" title="Delete this event" aria-label="Delete event ${i + 1}">✕</button></td></tr>`).join('');
    return `<h2>Step 1 · Significant events</h2><p class="muted">Task steps (i) and (ii): study all the information, list the events, then mark the significant ones.</p>
      <div class="aibar">${c.events.length ? '' : `<button class="btn" data-act="training" title="Load the practice case: a contractor worker drowned at an overflowing dam (fictional mine). The events are listed; you mark the significant ones and add any that are missing.">Training case ${esc(window.CA3X.EXAMPLE.ref)}</button>`}
        <button class="btn" data-act="importCb" title="Add the events from a Storyline Casebook case file (.casebook-case.json), in time order. They come in unmarked: you decide which are significant.">Import events from Casebook</button>${AI.btn('Suggest events', 'The AI reads the case summary and the events so far, and suggests missing events and which ones look significant.')}</div>
      <div class="card"><div class="eyebrow">Case</div><div class="grid2">${f('title', 'Incident title', 'Short name for the incident.')}${f('ref', 'Reference', 'Your case or report number.')}${f('date', 'Date of incident', 'Date the incident happened.', 'date')}${f('location', 'Location', 'Site and area (use an anonymised name for training).')}</div>
      ${f('team', 'Investigation team', 'Names or roles of the people doing the analysis.')}<label class="f" for="m-summary">What happened (short)</label><textarea id="m-summary" data-meta="summary" title="A few lines on the incident.">${esc(m.summary)}</textarea></div>
      <div class="card"><div class="eyebrow">Events in time order</div><div class="tw"><table class="ev"><thead><tr><th>#</th><th>Time</th><th>Event</th><th>Column (0)</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">No events yet.</td></tr>'}</tbody></table></div>
      <p><button class="btn pri" data-act="addEvent" title="Add an event at the end of the list.">+ Add event</button> <span class="small muted">${S().length} of ${c.events.length} marked significant</span></p></div>
      <div class="nav"><span></span><button class="btn pri" data-step="2" title="Describe each significant event in columns (1) to (4).">Next: describe each event →</button></div>`;
  }

  function step2() {
    const e = selEvent(), L = S();
    if (!e) return '<h2>Step 2 · Describe each event</h2><p>No significant events yet. Go back to <button class="btn sm" data-step="1">Step 1</button> and mark them.</p>';
    const i = L.indexOf(e), linked = e.measures.map(id => c.measures.find(m => m.id === id)).filter(Boolean);
    const others = c.measures.filter(m => !e.measures.includes(m.id));
    return `<h2>Step 2 · Describe each event</h2>
      ${AI.bar('Draft columns (1) to (4)', 'The AI drafts columns (1) to (4) for this event from the case facts. Unknown facts come back as "?".')}
      <div class="nav" style="margin-top:0"><button class="btn sm" data-act="prev" ${i ? '' : 'disabled'} title="Previous significant event">← Previous</button>
        <select id="ev-pick" aria-label="Choose significant event" title="Choose the significant event to work on." style="max-width:420px">${L.map((x, k) => `<option value="${x.id}" ${x === e ? 'selected' : ''}>[${k + 1}] ${esc(x.text || '(no description)')}</option>`).join('')}</select>
        <button class="btn sm" data-act="next" ${i < L.length - 1 ? '' : 'disabled'} title="Next significant event">Next →</button></div>
      <div class="card"><div class="eyebrow">Column (0) · Significant event [${i + 1}]</div><h3 style="margin-top:2px">${esc(e.text || '(no description)')}</h3>
        <label class="f" for="f-effect"><span class="col">(1)</span>${esc(M.COLS[1])}</label>
        <textarea id="f-effect" data-e="effect" data-id="${e.id}" placeholder="The risk created or worsened, and/or the aspect of control that is lost" title="Task step (iii): say briefly why this event is in the analysis.">${esc(e.effect)}</textarea>
        <label class="f"><span class="col">(2)</span>${esc(M.COLS[2])}</label>
        <div class="pair"><input type="text" data-e="change.obj" data-id="${e.id}" value="${esc(e.change.obj)}" placeholder="object or situation" aria-label="Change: object or situation" title="Task step (iv): the object or situation that changes. Write ? if unknown.">
          <span class="plus">+</span><input type="text" data-e="change.attr" data-id="${e.id}" value="${esc(e.change.attr)}" placeholder="attribute changed" aria-label="Change: attribute changed" title="What about it changes (e.g. closed, running, falls). The change defines the event, not what it caused."></div>
        <div class="preview" id="pv-change"></div>
        <label class="f"><span class="col">(3)</span>${esc(M.COLS[3])}</label>
        <div class="pair"><input type="text" data-e="agent.who" data-id="${e.id}" value="${esc(e.agent.who)}" placeholder="agent (person or thing)" aria-label="Agent of change" title="Task step (v): the person or thing making the change happen. Write ? if unknown.">
          <span class="plus">+</span><input type="text" data-e="agent.action" data-id="${e.id}" value="${esc(e.agent.action)}" placeholder="action (present tense)" aria-label="Action" title="Present tense, a verb that takes an object: closes [the valve], signs [the permit]."></div>
        <div class="preview" id="pv-agent"></div>
        <label class="f"><span class="col">(4)</span>${esc(M.COLS[4])}</label>
        ${linked.map(m => `<div class="meas"><span class="lt" title="This letter stays the same on every row where the measure appears.">${M.letter(c, m.id)}</span>
          <input type="text" data-m="text" data-id="${m.id}" value="${esc(m.text)}" aria-label="Measure ${M.letter(c, m.id)}">
          <button class="btn sm danger" data-act="unlink" data-id="${m.id}" title="Remove this measure from this event (it stays on other events).">✕</button></div>`).join('') || '<p class="small muted">No barriers or controls yet for this event.</p>'}
        <div class="addrow"><input type="text" id="new-m" placeholder="New barrier or work control that operates directly on (2) or (3)" aria-label="New barrier or control" title="Name one measure. Give it a letter by adding it."><button class="btn pri" data-act="addMeasure" title="Add this measure with the next letter.">Add</button></div>
        ${others.length ? `<div class="addrow"><select id="old-m" aria-label="Measure from another event" title="The same measure on another row keeps the same letter.">${others.map(m => `<option value="${m.id}">${M.letter(c, m.id)} ${esc(m.text)}</option>`).join('')}</select><button class="btn" data-act="linkMeasure" title="Use a measure already listed for another event (same letter).">Reuse</button></div>` : ''}
        <details><summary class="small" title="A first-principles prompt: apply each phrase to the nouns and verbs in columns (2) and (3).">Ideas: the 10 phrases (apply them to columns 2 and 3)</summary>
          <div class="chips">${M.PHRASES.map(p => `<button class="chip" data-phrase="${esc(p)}" title="Start a new measure with this phrase.">${esc(p)}</button>`).join('')}</div></details>
      </div>
      <div class="nav"><button class="btn" data-step="1">← Step 1</button>${i < L.length - 1 ? '<button class="btn pri" data-act="next" title="Next significant event">Next event →</button>' : '<button class="btn pri" data-step="3" title="Rate the significance of each event.">Next: prioritise →</button>'}</div>`;
  }

  function step3() {
    const L = S();
    const rows = L.map((e, i) => `<tr><td>[${i + 1}] ${esc(e.text)}</td><td>${esc(e.effect) || '<span class="muted">-</span>'}</td>
      <td>${e.measures.map(id => { const m = c.measures.find(x => x.id === id); return m ? M.letter(c, id) + ' ' + esc(m.text) : ''; }).join('<br>') || '<span class="muted">-</span>'}</td>
      <td><span class="rate">${[3, 2, 1].map(r => `<button class="rb r${r} ${e.rating === r ? 'on' : ''}" data-rate="${r}" data-id="${e.id}" aria-pressed="${e.rating === r}" title="${r} = ${M.RATING[r]}">${r} ${M.RATING[r]}</button>`).join('')}</span>
      <label class="chk small" title="Take this row forward into columns (6) to (8). Leaving rows out needs a review by others."><input type="checkbox" data-e="forward" data-id="${e.id}" ${e.forward ? 'checked' : ''}>Analyse further</label></td></tr>`).join('');
    return `<h2>Step 3 · Prioritise</h2><p class="muted">Task step (vii): rate the significance of each event, then decide which rows to take forward. For a very serious incident, take all of them forward.</p>${AI.bar('Suggest ratings', 'The AI suggests a rating for each event, with a reason. You decide.')}
      <div class="card tw"><table class="st"><thead><tr><th><span class="col">(0)</span>${esc(M.COLS[0])}</th><th><span class="col">(1)</span>Effect on risk or control</th><th><span class="col">(4)</span>Barriers and controls</th><th><span class="col">(5)</span>${esc(M.COLS[5])}</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">No significant events yet.</td></tr>'}</tbody></table></div>
      ${nav(2, 4, 'Next: ineffective measures →')}`;
  }

  /* Steps 4-6 work one barrier or control at a time (task steps viii-x), on the measures of rows taken forward */
  const nav = (b, n, t) => `<div class="nav"><button class="btn" data-step="${b}">← Step ${b}</button>${n ? `<button class="btn pri" data-step="${n}">${t}</button>` : '<span></span>'}</div>`;
  const opt = (o, v) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`;
  const evRef = m => S().filter(e => e.measures.includes(m.id)).map(e => '[' + num(e.id) + ']').join(' ');
  const mCard = (m, body) => `<div class="card" id="card-${m.id}"><div class="eyebrow">Column (4) · rows ${evRef(m)}</div><h3 style="margin-top:2px"><span class="lt">${M.letter(c, m.id)}</span> ${esc(m.text || '(no description)')}</h3>${body}</div>`;
  const none = () => '<p>No barriers or controls are taken forward yet. Rate the rows and tick "Analyse further" in <button class="btn sm" data-step="3">Step 3</button>.</p>';

  function step4() {
    const F = FWD();
    return `<h2>Step 4 · Ineffective measures</h2><p class="muted">Task step (viii), column (6): in what way was each barrier or control ineffective? Highest-rated rows first.</p>${AI.bar('Draft column (6)', 'The AI drafts, for each measure, what it should have done and what it did in the event.')}` +
      (F.length ? F.map(m => mCard(m, `<div class="small muted">${S().filter(e => e.measures.includes(m.id)).map(e => `[${num(e.id)}] ${esc(M.changeText(e) || e.text)}${M.agentText(e) ? ' · ' + esc(M.agentText(e)) : ''}`).join('<br>')}</div>
        <label class="f" for="h-${m.id}"><span class="col">(6)</span>${esc(M.COLS[6])}</label>
        <textarea id="h-${m.id}" data-m="how" data-id="${m.id}" placeholder="Expected: what the measure should have done. In the event: what it actually did, or that it was not there." title="Task step (viii): the expected performance and the actual behaviour, as facts. Write ? if unknown.">${esc(m.how)}</textarea>`)).join('') : none()) +
      nav(3, 5, 'Next: processes →');
  }

  const procOpts = v => '<option value="">Choose the process…</option><optgroup label="Generic processes (section 2.6.1)">' + M.PROCESSES.map(o => opt(o, v)).join('') +
    '</optgroup><optgroup label="Risk accepted beforehand (section 2.6.2)">' + opt(M.ASSUMED_RISK, v) + '</optgroup>' + (v && !M.PROCESSES.includes(v) && v !== M.ASSUMED_RISK ? opt(v, v) : '');
  function step5() {
    const F = FWD();
    return `<h2>Step 5 · Processes</h2><p class="muted">Task step (ix), column (7): what should have, but did not, prevent the problem stated in (6)?</p>${AI.bar('Suggest processes', 'The AI suggests processes from the manual\'s list for each measure, with the facts to check.')}` +
      (F.length ? F.map(m => mCard(m, `<p class="small"><span class="col">(6)</span>${m.how ? esc(m.how) : '<span class="muted">Not written yet (Step 4).</span>'}</p>` +
        m.procs.map(p => `<div class="proc"><div class="addrow"><select data-p="name" data-id="${p.id}" aria-label="Process for ${M.letter(c, m.id)}" title="A process from the manual's generic list, or the decision that accepted the risk.">${procOpts(p.name)}</select>
            <button class="btn sm danger" data-act="dropProc" data-id="${p.id}" title="Remove this process" aria-label="Remove process">✕</button></div>
          <textarea data-p="text" data-id="${p.id}" aria-label="Column (7) for ${M.letter(c, m.id)}" placeholder="${p.name === M.ASSUMED_RISK ? 'Who decided to accept the risk, when, how, and on what information' : 'Facts: how this process created or allowed the problem in (6); the norm that says what should happen; is that norm good enough?'}" title="Line up the facts, not judgements. Write ? if unknown.">${esc(p.text)}</textarea>
          ${p.name === M.ASSUMED_RISK ? `<div class="tests">${M.ASSUMED.map(t => `<label class="small" title="Test of the decision to assume the risk (section 2.6.2).">${esc(t[0].toUpperCase() + t.slice(1))}?<select data-t="${esc(t)}" data-id="${p.id}">${[['', '-'], ['yes', 'Yes'], ['no', 'No'], ['?', '?']].map(([v, x]) => `<option value="${v}" ${(p.tests[t] || '') === v ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`).join('')}</div>` : ''}</div>`).join('') +
        `<button class="btn" data-act="addProc" data-id="${m.id}" title="Add a process, or the decision to assume the risk, for this measure.">+ Add process</button>`)).join('') : none()) +
      nav(4, 6, 'Next: management arrangements →');
  }

  const arrOpts = v => '<option value="">Choose the arrangement…</option><optgroup label="Management arrangements (section 2.7)">' + M.ARRANGEMENTS.map(o => opt(o, v)).join('') +
    '</optgroup><optgroup label="Also consider">' + M.WIDER.map(o => opt(o, v)).join('') + '</optgroup>';
  function step6() {
    const F = FWD().filter(m => m.procs.length);
    return `<h2>Step 6 · Management arrangements</h2><p class="muted">Task step (x), column (8): why is the process in (7) not effective? One process at a time.</p>${AI.bar('Draft column (8)', 'The AI suggests the management arrangement and why, for each process without one.')}` +
      (F.length ? F.map(m => mCard(m, m.procs.map(p => `<div class="proc"><p class="small"><span class="col">(7)</span><b>${esc(p.name || 'Process not chosen')}</b>: ${esc(p.text) || '<span class="muted">not written yet (Step 5)</span>'}</p>
          <label class="f"><span class="col">(8)</span>Management arrangement</label><select data-p="arr" data-id="${p.id}" aria-label="Management arrangement for ${esc(p.name)}" title="The management activity that created or allowed the process problem.">${arrOpts(p.arr)}</select>
          <textarea data-p="why" data-id="${p.id}" aria-label="Column (8) for ${esc(p.name)}" placeholder="Facts: how this arrangement created or allowed the problem with the process" title="Factual, not judgemental. Write ? if unknown.">${esc(p.why)}</textarea></div>`).join(''))).join('')
        : '<p>No processes yet. Add them in <button class="btn sm" data-step="5">Step 5</button>.</p>') +
      nav(5, 7, 'Next: review →');
  }

  function step7() {
    const E = M.enquiries(c), r = c.review;
    return `<h2>Step 7 · Review</h2><p class="muted">Task step (xi): keep the analysis live until the investigation ends.</p>${AI.bar('Check the analysis', 'The AI checks the worksheet against the 3CA method and lists points to look at. It is not the independent review.')}
      <div class="card"><div class="eyebrow">Further enquiries ("?")</div>${E.length ? `<div class="tw"><table class="st"><thead><tr><th>Where</th><th>Entry</th><th>Status</th><th>Note or action</th></tr></thead><tbody>${E.map(x => `<tr><td>${esc(x.where)}</td><td class="q">${esc(x.text)}</td>
        <td><select data-q="status" data-k="${esc(x.key)}" aria-label="Status of ${esc(x.where)}" title="What happens to this question by the end of the investigation.">${Object.entries(M.STATUS).map(([k, v]) => `<option value="${k}" ${x.status === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></td>
        <td><input type="text" data-q="note" data-k="${esc(x.key)}" value="${esc(x.note)}" aria-label="Note for ${esc(x.where)}" title="Who follows it up, or the answer found."></td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted">No "?" entries in the worksheet.</p>'}</div>
      <div class="card"><div class="eyebrow">Independent review</div><div class="grid2"><div><label class="f" for="r-by">Reviewer</label><input type="text" id="r-by" data-r="by" value="${esc(r.by)}" title="Name or role of someone who did not do the analysis."></div>
        <div><label class="f" for="r-date">Date</label><input type="date" id="r-date" data-r="date" value="${esc(r.date)}" title="Date of the review."></div></div>
        <label class="f" for="r-com">Comments</label><textarea id="r-com" data-r="comments" title="What the reviewer checked, and what changed as a result.">${esc(r.comments)}</textarea></div>
      <div class="card"><div class="eyebrow">Worksheet and report</div><p><button class="btn pri" data-act="print" title="Print the worksheet, enquiries and review on A4 landscape, or save as PDF.">Print / PDF</button> <button class="btn" data-act="word" title="Download the report as a Word document (.doc).">Word</button></p>
        <div class="tw paper" id="rep-view"></div></div>` + nav(6, 0);
  }

  /* Report: the worksheet (Appendix 1 layout), enquiries and review. Columns (6)-(8) appear on the first row that uses a measure. */
  const REP_CSS = '.rep{font:10pt/1.35 Arial,sans-serif;color:#000;background:#fff}.rep h1{font-size:15pt;margin:0 0 6pt}.rep h2{font-size:12pt;margin:10pt 0 4pt}' +
    '.rep table{border-collapse:collapse;width:100%;margin:4pt 0}.rep th,.rep td{border:1px solid #777;padding:3pt 4pt;vertical-align:top;text-align:left;font-size:8.5pt;white-space:pre-wrap}' +
    '.rep th{background:#e8edf3}.rep .meta th{width:1%;white-space:nowrap}.rep tr{page-break-inside:avoid}.rep .q{color:#1d5fc4}.rep .src{font-size:7.5pt;color:#444}';
  const cell = t => String(t || '').trim() ? (/\?/.test(t) ? `<span class="q">${esc(t)}</span>` : esc(t)) : '';
  function report() {
    const m = c.meta, shown = new Set(), E = M.enquiries(c), r = c.review, byId = id => c.measures.find(x => x.id === id);
    const rows = S().map((e, i) => {
      const ms = e.measures.map(byId).filter(Boolean), first = e.forward ? ms.filter(x => !shown.has(x.id)) : [], lt = x => M.letter(c, x.id) + ' ';
      first.forEach(x => shown.add(x.id));
      const c7 = first.flatMap(x => x.procs.filter(p => p.name || p.text).map(p => lt(x) + '<b>' + esc(p.name) + '</b>: ' + cell(p.text) +
        (p.name === M.ASSUMED_RISK ? ' (' + M.ASSUMED.map(t => esc(t) + ': ' + esc(p.tests[t] || '-')).join('; ') + ')' : '')));
      const c8 = first.flatMap(x => x.procs.filter(p => p.arr || p.why).map(p => lt(x) + '<b>' + esc(p.arr) + '</b>: ' + cell(p.why)));
      return `<tr><td>[${i + 1}] ${cell(e.text)}</td><td>${cell(e.effect)}</td><td>${cell(M.changeText(e))}</td><td>${cell(M.agentText(e))}</td><td>${ms.map(x => lt(x) + cell(x.text)).join('<br>')}</td>
        <td>${e.rating ? e.rating + ' ' + M.RATING[e.rating] : ''}</td><td>${e.forward ? first.map(x => lt(x) + cell(x.how)).join('<br>') : '<i>Not taken forward</i>'}</td><td>${c7.join('<br>')}</td><td>${c8.join('<br>')}</td></tr>`;
    }).join('');
    return `<div class="rep"><h1>3CA worksheet: ${esc(m.title || 'Untitled case')}</h1>
      <table class="meta"><tr><th>Reference</th><td>${esc(m.ref)}</td><th>Date of incident</th><td>${esc(m.date)}</td><th>Location</th><td>${esc(m.location)}</td></tr>
      <tr><th>Investigation team</th><td colspan="5">${esc(m.team)}</td></tr><tr><th>What happened</th><td colspan="5">${esc(m.summary)}</td></tr></table>
      <table><thead><tr>${M.COLS.map((h, k) => `<th>(${k}) ${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows || '<tr><td colspan="9">No significant events.</td></tr>'}</tbody></table>
      <h2>Further enquiries</h2>${E.length ? `<table><thead><tr><th>Where</th><th>Entry</th><th>Status</th><th>Note or action</th></tr></thead><tbody>${E.map(x => `<tr><td>${esc(x.where)}</td><td class="q">${esc(x.text)}</td><td>${esc(M.STATUS[x.status])}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>` : '<p>None.</p>'}
      <h2>Independent review</h2><table><tr><th>Reviewer</th><td>${esc(r.by)}</td><th>Date</th><td>${esc(r.date)}</td></tr><tr><th>Comments</th><td colspan="3">${esc(r.comments)}</td></tr></table>
      <p class="src">Blue text marks a question ("?") still open in the analysis. ${esc(M.SOURCE)}</p></div>`;
  }

  /* ---------- AI assist (own AI key, KitAI) ----------
     KitAI shows every request before it is sent. Every suggestion is ticked in a dialog before it is used; nothing is applied silently. */
  const AI = (() => {
    let busy = false;
    const on = () => !!window.KitAI;
    const str = (v, n) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n || 400);
    const btn = (label, tip) => on() ? `<button class="btn" data-act="ai" ${busy ? 'disabled' : ''} title="${esc(tip)} Uses your own AI key; you see the request first.">&#10022; ${esc(label)}</button>` : '';
    const bar = (label, tip) => on() ? `<div class="aibar">${btn(label, tip)}</div>` : '';
    const RULES = ['Use the 3CA terms exactly as given here. Use only the facts given: do not invent names, times, numbers or findings. Where a fact is not known, write "?" in the text so it goes on the list of further enquiries.',
      'Write facts, not judgements: no words such as "inadequate", "poor", "insufficient" or "lack of".',
      'Plain English, short sentences, for a reader with Grade 12 who may work in a second language. Metric units.', 'Answer with one JSON object only, no other text.'];
    const ROLE = 'You are an experienced incident investigator who uses 3CA, Control Change Cause Analysis (NRI-3 Investigator\'s Manual, 2nd edition).';
    function sheet() {
      const m = c.meta, L = [`CASE: ${str(m.title, 200)}`, m.date ? 'Date: ' + m.date : '', m.location ? 'Location: ' + str(m.location, 200) : '', m.summary ? 'What happened: ' + str(m.summary, 4000) : '', '', 'EVENTS IN TIME ORDER (S = marked significant)'];
      c.events.forEach((e, i) => L.push(`${i + 1}. ${e.sig ? '[S' + num(e.id) + '] ' : ''}${e.time ? e.time + ' ' : ''}${str(e.text, 300)}`));
      S().forEach(e => {
        L.push('', `SIGNIFICANT EVENT [${num(e.id)}] ${str(e.text, 300)}`, `(1) ${str(e.effect)}`, `(2) ${str(M.changeText(e))}`, `(3) ${str(M.agentText(e))}`,
          `(4) ${e.measures.map(id => M.letter(c, id) + ' ' + str((c.measures.find(x => x.id === id) || {}).text, 200)).join('; ')}`, `(5) ${e.rating || ''}${e.forward ? '' : ' (not taken forward)'}`);
      });
      c.measures.forEach(x => {
        if (!x.how && !x.procs.length) return;
        L.push('', `MEASURE ${M.letter(c, x.id)} ${str(x.text, 200)}`, `(6) ${str(x.how)}`);
        x.procs.forEach(p => L.push(`(7) ${p.name}: ${str(p.text)}${p.name === M.ASSUMED_RISK ? ' | tests: ' + M.ASSUMED.map(t => t + '=' + (p.tests[t] || '-')).join(', ') : ''}`, `(8) ${p.arr}: ${str(p.why)}`));
      });
      return L.filter(x => x !== '').join('\n').replace(/\n(?=SIGNIFICANT|MEASURE)/g, '\n\n');
    }
    async function ask(task, shape) {
      const t = (await KitAI.sample([ROLE, '', sheet(), '', 'TASK', ...task, '', ...RULES, 'JSON shape: ' + shape].join('\n'))).text;
      const f = String(t).match(/```(?:json)?\s*([\s\S]*?)```/), x = f ? f[1] : String(t), a = x.indexOf('{'), b = x.lastIndexOf('}');
      if (a < 0 || b <= a) throw new Error('no JSON in the answer');
      return JSON.parse(x.slice(a, b + 1));
    }
    const arr = v => Array.isArray(v) ? v : [];
    function dialog(title, items, onOk) {
      if (!items.length) { toast('The AI had nothing to add here.'); return; }
      const el = document.createElement('div'); el.className = 'rai-bg'; el.id = 'rai-modal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
      el.innerHTML = `<div class="rai"><h3>${esc(title)}</h3><p class="small muted">Suggested by the AI from what is in this case. Untick anything that does not fit; check every "?" and every fact against your evidence.</p>
        <div>${items.map((h, i) => `<label class="rai-item"><input type="checkbox" data-i="${i}" checked><span>${h}</span></label>`).join('')}</div>
        <div class="nav"><button class="btn" data-rx>Discard</button><button class="btn pri" data-rok>Use ticked items</button></div></div>`;
      el.querySelector('[data-rx]').onclick = () => el.remove();
      el.querySelector('[data-rok]').onclick = () => {
        const pick = new Set(Array.from(el.querySelectorAll('input[data-i]:checked')).map(x => +x.dataset.i));
        if (!pick.size) { toast('Tick at least one item, or press Discard.'); return; }
        onOk(pick); el.remove(); save(); render(); toast(pick.size + ' suggestion(s) used.');
      };
      document.body.appendChild(el);
    }
    const was = (old, nw) => old && old !== nw ? `<br><span class="small muted">Replaces: ${esc(old)}</span>` : '';
    const T = {
      1: async () => {
        const a = await ask(['Step 1, task steps (i) and (ii). A significant event is a change that decreases control over later events and/or increases the risk of later unwanted events. Stay at the operational level.',
          'add: events that the summary shows but the list does not have yet (one moment of change each), with time if known and whether it is significant.', 'significant: numbers of listed events that should be marked significant but are not.'],
          '{"add":[{"time":"","text":"","significant":true}],"significant":[2]}');
        const add = arr(a.add).map(x => ({ time: str(x && x.time, 40), text: str(x && x.text, 300), sig: !!(x && x.significant) })).filter(x => x.text).slice(0, 20);
        const mark = arr(a.significant).map(n => c.events[+n - 1]).filter(e => e && !e.sig);
        dialog('Suggested events', [...add.map(x => `Add: ${x.time ? esc(x.time) + ' ' : ''}<b>${esc(x.text)}</b>${x.sig ? ' (significant)' : ''}`), ...mark.map(e => `Mark significant: <b>${esc(e.text)}</b>`)], pick => {
          add.forEach((x, i) => { if (pick.has(i)) Object.assign(M.event(c, x.text, x.sig), { time: x.time }); });
          mark.forEach((e, i) => { if (pick.has(add.length + i)) e.sig = true; });
        });
      },
      2: async () => {
        const e = selEvent(); if (!e) return;
        const a = await ask([`Step 2, task steps (iii) to (vi), for significant event [${num(e.id)}] "${str(e.text, 300)}" only.`,
          'effect: column (1), in what way the event is significant: the risk created or the control lost.', 'change: column (2), [object or situation] + [attribute changed]. The change that defines the event, not what it caused.',
          'agent: column (3), [agent] + [action], the action in the present tense with a verb that takes an object, e.g. "closes [the valve]".',
          'measures: column (4), work controls or protective barriers that could have been effective on (2) or (3), one short line each. Reuse the exact wording of a measure already listed for another event when it is the same measure.'],
          '{"effect":"","change":{"obj":"","attr":""},"agent":{"who":"","action":""},"measures":[""]}');
        const ch = a.change || {}, ag = a.agent || {}, ef = str(a.effect), ob = str(ch.obj, 150), at = str(ch.attr, 150), wh = str(ag.who, 150), ac = str(ag.action, 150);
        const have = e.measures.map(id => (c.measures.find(x => x.id === id) || {}).text);
        const ms = arr(a.measures).map(x => str(x, 200)).filter(x => x && !have.includes(x)).slice(0, 10);
        const it = [], fn = [];
        if (ef) { it.push(`<b>(1)</b> ${esc(ef)}${was(e.effect, ef)}`); fn.push(() => { e.effect = ef; }); }
        if (ob || at) { it.push(`<b>(2)</b> ${esc(ob)} + ${esc(at)}${was(M.changeText(e), ob + ' ' + at)}`); fn.push(() => { e.change = { obj: ob, attr: at }; }); }
        if (wh || ac) { it.push(`<b>(3)</b> ${esc(wh)} + ${esc(ac)}${was(M.agentText(e), wh + ' ' + ac)}`); fn.push(() => { e.agent = { who: wh, action: ac }; }); }
        ms.forEach(t => { const old = c.measures.find(x => x.text === t); it.push(`<b>(4)</b> ${old ? M.letter(c, old.id) + ' (already listed) ' : 'new: '}${esc(t)}`); fn.push(() => M.link(c, e.id, (old || M.addMeasure(c, t)).id)); });
        dialog('Draft for event [' + num(e.id) + ']', it, pick => fn.forEach((f, i) => { if (pick.has(i)) f(); }));
      },
      3: async () => {
        const a = await ask(['Step 3, task step (vii), column (5). Start with the most important significant event and rate it 3 (High); rate each other event against it: equally important gets the same rating, otherwise one lower. 3 High, 2 Medium, 1 Low.',
          'Criteria: ' + M.CRITERIA.join('; ') + '.', 'ratings: one entry per significant event by its number in square brackets, with a short reason.'], '{"ratings":[{"event":1,"rating":3,"why":""}]}');
        const rs = arr(a.ratings).map(r => ({ e: S()[+(r && r.event) - 1], r: +(r && r.rating), why: str(r && r.why, 300) })).filter(r => r.e && M.RATING[r.r]);
        dialog('Suggested ratings', rs.map(r => `[${num(r.e.id)}] ${esc(r.e.text)}: <b>${r.r} ${M.RATING[r.r]}</b>${r.why ? '<br><span class="small">' + esc(r.why) + '</span>' : ''}${r.e.rating && r.e.rating !== r.r ? `<br><span class="small muted">Replaces: ${r.e.rating}</span>` : ''}`),
          pick => rs.forEach((r, i) => { if (pick.has(i)) r.e.rating = r.r; }));
      },
      4: async () => {
        const F = FWD(); if (!F.length) { toast('Take rows forward in Step 3 first.'); return; }
        const a = await ask(['Step 4, task step (viii), column (6): in what way was each measure at (4) ineffective? Phrase each statement to show the performance expected of the barrier or control in an ideal situation, and the behaviour evident in the actual event.',
          'Measures to cover: ' + F.map(x => M.letter(c, x.id) + ' ' + str(x.text, 200)).join('; ') + '.'], '{"how":[{"measure":"(a)","text":"Expected: ... In the event: ..."}]}');
        const hs = arr(a.how).map(h => ({ m: F.find(x => M.letter(c, x.id) === String(h && h.measure).trim()), t: str(h && h.text, 600) })).filter(h => h.m && h.t);
        dialog('Draft column (6)', hs.map(h => `<b>${M.letter(c, h.m.id)}</b> ${esc(h.m.text)}<br>${esc(h.t)}${was(h.m.how, h.t)}`), pick => hs.forEach((h, i) => { if (pick.has(i)) h.m.how = h.t; }));
      },
      5: async () => {
        const F = FWD().filter(x => x.how); if (!F.length) { toast('Write column (6) in Step 4 first.'); return; }
        const names = [...M.PROCESSES, M.ASSUMED_RISK];
        const a = await ask(['Step 5, task step (ix), column (7): what should have, but did not, prevent the problem stated in (6)? For each measure, name the implementation and monitoring processes that should have made it effective, and line up the facts of how each process created or permitted the problem, the norm that applies, and whether that norm is itself adequate.',
          'If the ineffectiveness was accepted before the incident, use the process name "' + M.ASSUMED_RISK + '" and say who decided, when, how and on what information (use "?" where not known).',
          'Process names, use exactly one of: ' + names.join('; ') + '.', 'Do not repeat processes already in the worksheet. Measures to cover: ' + F.map(x => M.letter(c, x.id)).join(' ') + '.'],
          '{"processes":[{"measure":"(a)","process":"Inspection","text":""}]}');
        const ps = arr(a.processes).map(p => ({ m: F.find(x => M.letter(c, x.id) === String(p && p.measure).trim()), n: names.find(n => n.toLowerCase() === str(p && p.process, 200).toLowerCase()), t: str(p && p.text, 600) }))
          .filter(p => p.m && p.n && p.t && !p.m.procs.some(q => q.name === p.n)).slice(0, 30);
        dialog('Suggested processes', ps.map(p => `<b>${M.letter(c, p.m.id)} ${esc(p.n)}</b><br>${esc(p.t)}`), pick => ps.forEach((p, i) => { if (pick.has(i)) M.addProc(c, p.m.id, p.n).text = p.t; }));
      },
      6: async () => {
        const P = FWD().flatMap(x => x.procs.filter(p => p.name && p.text && !(p.arr && p.why)).map(p => ({ m: x, p })));
        if (!P.length) { toast('Every process already has column (8), or none is written yet (Step 5).'); return; }
        const opts = [...M.ARRANGEMENTS, ...M.WIDER];
        const a = await ask(['Step 6, task step (x), column (8): why is the process in (7) not effective? For each process below, identify the management arrangement that created or permitted the problem and characterise its imperfection in factual, not judgemental, language.',
          'Arrangement, use exactly one of: ' + opts.join('; ') + '.', 'Processes to cover: ' + P.map((x, i) => `P${i + 1} = ${M.letter(c, x.m.id)} ${x.p.name}: ${str(x.p.text, 300)}`).join(' | ')],
          '{"arrangements":[{"process":"P1","arrangement":"Formulating policy","why":""}]}');
        const as = arr(a.arrangements).map(r => ({ x: P[+String(r && r.process).replace(/\D/g, '') - 1], n: opts.find(o => o.toLowerCase() === str(r && r.arrangement, 200).toLowerCase()), t: str(r && r.why, 600) })).filter(r => r.x && r.n && r.t);
        dialog('Draft column (8)', as.map(r => `<b>${M.letter(c, r.x.m.id)} ${esc(r.x.p.name)}</b> → <b>${esc(r.n)}</b><br>${esc(r.t)}`), pick => as.forEach((r, i) => { if (pick.has(i)) Object.assign(r.x.p, { arr: r.n, why: r.t }); }));
      },
      7: async () => {
        const a = await ask(['Step 7, task step (xi): check this 3CA worksheet against the method. Look for: missing significant events; changes that describe a consequence instead of the change; actions not in the present tense; measures linked to the wrong event; judgemental or vague statements in (6) to (8); processes that do not explain the problem in (6); "?" items that the facts given already answer.',
          'points: up to 10 short, specific points, each naming the row or measure it is about.'], '{"points":[""]}');
        const pts = arr(a.points).map(x => str(x, 400)).filter(Boolean).slice(0, 10);
        dialog('Points to check', pts.map(esc), pick => { const t = pts.filter((x, i) => pick.has(i)).map(x => '- ' + x).join('\n'); c.review.comments = (c.review.comments ? c.review.comments + '\n' : '') + 'AI check (not the independent review):\n' + t; });
      }
    };
    async function go(n) {
      if (!on() || busy) return; busy = true; render(); toast('Asking the AI… this can take a minute.');
      try { await T[n](); } catch (e) { if (!(e && e.code === 'cancelled')) toast((e && e.userMessage) || 'The answer could not be read (' + ((e && e.message) || 'error') + '). Try again.'); }
      busy = false; render();
    }
    return { btn, bar, go };
  })();

  /* ---------- events ---------- */
  function setPath(o, path, v) { const k = path.split('.'); const last = k.pop(); k.reduce((a, x) => a[x], o)[last] = v; }
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.dataset.meta) { c.meta[t.dataset.meta] = t.value; $('#case-name').textContent = (c.meta.ref ? c.meta.ref + ' · ' : '') + (c.meta.title || 'Untitled case'); }
    else if (t.dataset.e && t.type !== 'checkbox') { const e = M.ev(c, t.dataset.id); if (e) setPath(e, t.dataset.e, t.value); }
    else if (t.dataset.m) { const m = c.measures.find(x => x.id === t.dataset.id); if (m) m[t.dataset.m] = t.value; }
    else if (t.dataset.p) { const p = proc(t.dataset.id); if (p) p[t.dataset.p] = t.value; if (t.dataset.p === 'name') { save(); render(); return; } }
    else if (t.dataset.t) { const p = proc(t.dataset.id); if (p) p.tests[t.dataset.t] = t.value; }
    else if (t.dataset.q) { const k = t.dataset.k; c.enq[k] = Object.assign({ status: 'open', note: '' }, c.enq[k], { [t.dataset.q]: t.value }); }
    else if (t.dataset.r) c.review[t.dataset.r] = t.value;
    else return;
    save(); refresh();
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'ev-pick') { sel = t.value; render(); return; }
    if (t.id === 'f-open') { openFile(t.files[0]); t.value = ''; return; }
    if (t.id === 'f-cb') { importCb(t.files[0]); t.value = ''; return; }
    if (t.dataset.e && t.type === 'checkbox') { const e = M.ev(c, t.dataset.id); if (e) e[t.dataset.e] = t.checked; save(); render(); }
  });
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.step) { step = +b.dataset.step; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.sel) { sel = b.dataset.sel; render(); return; }
    if (b.dataset.rate) { const e = M.ev(c, b.dataset.id); const r = +b.dataset.rate; e.rating = e.rating === r ? null : r; save(); render(); return; }
    if (b.dataset.phrase) { const i = $('#new-m'); i.value = b.dataset.phrase.replace(/…$|\.$/, '').trim() + ' '; i.focus(); return; }
    if (b.dataset.go) {
      step = +b.dataset.go; if (b.dataset.at && M.ev(c, b.dataset.at)) sel = b.dataset.at; render();
      const card = b.dataset.at && document.getElementById('card-' + b.dataset.at); if (card) card.scrollIntoView(); return;
    }
    const act = b.dataset.act; if (!act) return;
    const id = b.dataset.id, L = S(), i = L.findIndex(e => e.id === sel);
    ({
      addEvent() { M.event(c, '', true); save(); render(); const ins = document.querySelectorAll('td.t input'); ins[ins.length - 1].focus(); },
      up() { M.move(c, id, -1); save(); render(); }, down() { M.move(c, id, 1); save(); render(); },
      del() { M.remove(c, id); save(); render(); },
      prev() { if (i > 0) { sel = L[i - 1].id; render(); } }, next() { if (i < L.length - 1) { sel = L[i + 1].id; render(); window.scrollTo(0, 0); } },
      addMeasure() { const t = $('#new-m').value.trim(); if (!t) { $('#new-m').focus(); toast('Type the barrier or control first.'); return; } const m = M.addMeasure(c, t); M.link(c, sel, m.id); save(); render(); $('#new-m').focus(); },
      linkMeasure() { M.link(c, sel, $('#old-m').value); save(); render(); },
      unlink() { M.unlink(c, sel, id); if (!c.events.some(e => e.measures.includes(id))) M.dropMeasure(c, id); save(); render(); },
      new() {
        if (Date.now() - armNew > 3000) { armNew = Date.now(); b.textContent = 'Click again for a new case'; setTimeout(() => { b.textContent = 'New'; }, 3000); return; }
        armNew = 0; c = M.blank(); step = 1; sel = null; save(); render(); toast('New case started.');
      },
      open() { $('#f-open').click(); },
      importCb() { $('#f-cb').click(); },
      training() { c = window.CA3X.starter(M); step = 1; sel = null; save(); render(); toast('Training case loaded. Mark the significant events, and add any that are missing.'); },
      ai() { AI.go(step); },
      async takeHandoff() {   // file handle passed by START HERE (Chrome/Edge); reading it may need permission again
        const h = handoff; handoff = null; render(); if (!h) return;
        if (await KIT.permission(h.handle, true) !== 'granted') { toast('Permission was not given.'); return; }
        try { openFile(await h.handle.getFile()); } catch (e) { toast('Could not read ' + h.name + '.'); }
      },
      dropHandoff() { handoff = null; render(); },
      aiSettings() { if (window.KitAI) KitAI.settings(); },
      addProc() { M.addProc(c, id); save(); render(); const s = document.querySelectorAll('#card-' + id + ' [data-p=name]'); s[s.length - 1].focus(); },
      dropProc() { M.dropProc(c, id); save(); render(); },
      save() { download(fname('.3ca-case.json'), new Blob([JSON.stringify(c, null, 1)], { type: 'application/json' })); },
      print() { $('#print').innerHTML = report(); window.print(); },
      word() {
        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(c.meta.title || '3CA case')}</title>
          <style>@page WordSection1{size:841.9pt 595.3pt;mso-page-orientation:landscape;margin:36pt}div.WordSection1{page:WordSection1}${REP_CSS}</style></head><body><div class="WordSection1">${report()}</div></body></html>`;
        download(fname('.doc'), new Blob(['\ufeff', html], { type: 'application/msword' }));
      }
    })[act]();
  });
  function importCb(f) {
    if (!f) return;
    f.text().then(t => {
      const r = M.fromCasebook(JSON.parse(t)), empty = !c.events.length;
      Object.keys(r.meta).forEach(k => { if (!String(c.meta[k] || '').trim()) c.meta[k] = r.meta[k]; });
      r.events.forEach(x => { M.event(c, x.text, false).time = x.time; });
      step = 1; save(); render(); toast(r.events.length + ' events imported' + (empty ? '' : ' at the end of the list') + '. Mark the significant ones.');
    }).catch(err => toast(err instanceof SyntaxError ? 'That file is not a Casebook case file.' : err.message));
  }
  function openFile(f) {
    if (!f) return;
    f.text().then(t => { c = M.load(JSON.parse(t)); step = 1; sel = null; save(); render(); toast('Opened ' + f.name); })
      .catch(err => toast(err instanceof SyntaxError ? 'That file is not a 3CA case file.' : err.message));
  }
  document.head.insertAdjacentHTML('beforeend', '<style>' + REP_CSS + '</style>');
  if (window.KitAI) $('[data-act=aiSettings]').hidden = false;
  if (location.hash === '#handoff' && window.KIT) KIT.KitHandoff.take('3ca').then(v => { if (v && v.handle) { handoff = v; render(); } }).catch(() => {});
  render();
  window.__3ca = { get case() { return c; } };   // for tests
})();
</script>
