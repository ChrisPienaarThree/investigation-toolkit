<script>/* 5 Why and Ishikawa session tool UI: set-up, problem, Ishikawa diagram, test and select, 5 Why, actions and record. */
(function () {
  'use strict';
  const M = window.RCAS, F = window.Fishbone, REP = window.Report, X = window.RCAX, KEY = 'iikit.rca.session', PKEY = 'iikit.rca.projector';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const STEPS = [
    { n: 1, t: 'Set-up', tip: 'Session details, who is in the room, and the ground rules.' },
    { n: 2, t: 'Problem', tip: 'Agree one clear problem statement and the facts already known.' },
    { n: 3, t: 'Ishikawa', tip: 'Brainstorm possible causes on the fishbone diagram, one category at a time.' },
    { n: 4, t: 'Test and select', tip: 'Test each cause against evidence, then choose the causes to drill with 5 Why.' },
    { n: 5, t: '5 Why', tip: 'Ask why, again and again, for each selected cause until you reach a root cause.' },
    { n: 6, t: 'Actions and record', tip: 'An action for every root cause, the enquiries still open, sign-off and the session record.' }
  ];
  let s = restore() || M.blank(), step = 1, sel = null, arm = {}, handoff = null;

  function save() { s.updated = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* private window: Save to file still works */ } }
  function restore() { try { const v = localStorage.getItem(KEY); if (v) return M.load(JSON.parse(v)); } catch (e) { } return null; }
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
  const fname = ext => (s.meta.title || 'RCA session').replace(/[\\/:*?"<>|]+/g, '-') + ext;
  function download(name, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  // Two clicks within 3 s for actions that lose work
  function armed(key, b, label) {
    if (Date.now() - (arm[key] || 0) > 3000) { arm[key] = Date.now(); const old = b.textContent; b.textContent = label; setTimeout(() => { b.textContent = old; }, 3000); return false; }
    arm[key] = 0; return true;
  }
  const title = () => (s.meta.ref ? s.meta.ref + ' · ' : '') + (s.meta.title || 'Untitled session');

  /* ---------- render ---------- */
  function render() {
    $('#case-name').textContent = title();
    const ho = handoff ? `<div class="card guide">START HERE asked to open <b>${esc(handoff.name)}</b>. <button class="btn pri sm" data-act="takeHandoff">Open ${esc(handoff.name)}</button> <button class="btn sm" data-act="dropHandoff">Not now</button></div>` : '';
    $('#main').innerHTML = '<div class="wrap">' + ho + [, step1, step2, step3, step4, step5, step6][step]() + `<p class="src">${esc(M.SOURCE)}</p></div>`;
    $('#panel').innerHTML = panel();
    refresh();
  }
  // Updates only the parts that change while typing, so focus is never lost
  function refresh() {
    const issues = M.check(s), here = issues.filter(i => i.step === step);
    $('#tabs').innerHTML = STEPS.map(x => {
      const done = !x.off && !issues.some(i => i.step === x.n && i.sev === 'warn');
      return `<button class="tab${x.n === step ? ' on' : ''}${done ? ' done' : ''}" data-step="${x.n}" ${x.off ? 'disabled' : ''} title="${esc(x.tip)}"><span class="n">${x.n}</span>${esc(x.t)}</button>`;
    }).join('');
    const box = $('#checks');
    if (box) box.innerHTML = here.length ? here.map(i => `<button class="issue ${i.sev}" data-go="${i.step}" data-at="${i.at || ''}" title="${i.code}: go to this item">${esc(i.msg)}</button>`).join('')
      : '<p class="small muted">No checks open for this step.</p>';
    const fb = $('#fb'); if (fb) { fb.innerHTML = F.render(M, s, { sel }); zoom(); }
    const tc = $('#tocheck'), L = M.toCheck(s);
    if (tc) tc.innerHTML = L.length ? '<ul class="small">' + L.map(x => `<li><b>${esc(x.text)}</b>: ${esc(x.check)}</li>`).join('') + '</ul>' : '<p class="small muted">Nothing yet. In Step 4, write what evidence would confirm or rule out each cause.</p>';
    const ct = $('#counts');
    if (ct) { const n = k => s.causes.filter(x => x.status === k).length; ct.innerHTML = Object.keys(M.STATUS).map(k => `<span>${esc(M.STATUS[k])}: <b>${n(k)}</b></span>`).join('') + `<span>Selected for 5 Why: <b>${M.drilled(s).length}</b></span><span>Dot-votes: <b>${M.votesTotal(s)}</b></span>`; }
    const st = $('#statement'); if (st) st.placeholder = M.compose(s.problem) || 'What happened, where, when, how big, and what should have happened';
  }

  function panel() {
    const guide = {
      1: `<div class="card guide"><b>Open the session</b><ol><li>Welcome everyone and say why you are here: to find causes and fix them, not to find someone to blame.</li>
          <li>Read the ground rules out loud and ask everyone to agree.</li><li>Check the right people are here: people who do the work, maintain it and supervise it. One or two people who do not know the job well can ask useful questions.</li>
          <li>Name a scribe who types into this tool. The facilitator runs the discussion.</li></ol></div>`,
      2: `<div class="card guide"><b>One clear problem</b><ul><li>Describe the <b>effect</b>: what went wrong, not why. "Pump P-101 tripped 4 times in March", not "Pump tripped because of poor maintenance".</li>
          <li>Be specific: where, when, how big or how often, and what should have happened.</li><li>One problem per session. If the group raises other problems, put them in the parking lot (Step 3).</li>
          <li>List the facts already known, and where each one comes from (log, report, photo, interview).</li></ul></div>`,
      3: `<div class="card guide"><b>Brainstorm causes</b><ol><li>Take one category at a time. Read the prompt questions.</li><li>Go round the room so everyone speaks. Write every idea down; do not argue about it yet.</li>
          <li>Ask "why could that happen?" to add sub-causes under a cause.</li><li>If an idea fits more than one category, put it where the group thinks it fits best.</li><li>Off-topic points go to the parking lot.</li></ol></div>`,
      4: `<div class="card guide"><b>Test, then select</b><ol><li>For each cause, ask: what evidence would confirm it or rule it out?</li><li>Mark the result: <b>likely</b>, <b>confirmed by evidence</b> or <b>ruled out</b>. Write the evidence or the reason. Keep ruled-out causes: the record shows they were checked.</li>
          <li>Causes you cannot check in the room go on the follow-up list.</li><li>Select the causes to drill with 5 Why: confirmed causes first, then likely ones.</li></ol></div>`,
      5: `<div class="card guide"><b>Ask why, then why again</b><ol><li>Read the question out. Write the group's answer in their words.</li>
          <li>Ask "why?" of that answer. Stop when the answer is something the site can fix that would stop the problem coming back. That is the root cause. Five is a guide, not a rule.</li>
          <li>If there is more than one answer, add a branch. Follow each one.</li><li>Do not stop at a person ("human error", "did not follow the procedure"). Ask why it made sense at the time, or why it was possible.</li>
          <li>Check each root cause backwards: read it with "therefore" up to the problem. If it does not make sense, a step is missing.</li></ol></div>`,
      6: `<div class="card guide"><b>Act, then record</b><ol><li>Give every root cause at least one action that removes it, with an owner and a due date.</li>
          <li>Add a short-term action where the risk needs controlling now.</li><li>Put everything still to find out on the enquiries register, with who will find out.</li>
          <li>Sign off, then print or download the record and send it to the team.</li></ol></div>`
    }[step];
    return guide + `<p><button class="btn sm" data-manual="step${step}" title="Open the user manual at this step.">More in the user manual</button></p>` + '<div class="eyebrow">Checks</div><div id="checks"></div><div class="eyebrow">To check after the session</div><div id="tocheck"></div>';
  }

  function step1() {
    const m = s.meta, f = (k, label, tip, type) => `<div><label class="f" for="m-${k}">${label}</label><input type="${type || 'text'}" id="m-${k}" data-meta="${k}" value="${esc(m[k])}" title="${esc(tip)}"></div>`;
    const ppl = s.people.map((p, i) => `<div class="row"><input type="text" data-person="name" data-id="${p.id}" value="${esc(p.name)}" placeholder="Name" aria-label="Attendee ${i + 1} name">
      <input type="text" data-person="role" data-id="${p.id}" value="${esc(p.role)}" placeholder="Role or department" aria-label="Attendee ${i + 1} role">
      <button class="btn sm danger" data-act="dropPerson" data-id="${p.id}" title="Remove this person" aria-label="Remove attendee ${i + 1}">✕</button></div>`).join('');
    const empty = !s.causes.length && !s.facts.length && !s.problem.statement && !s.problem.what;
    return `<h2>Step 1 · Set-up</h2><p class="muted">Who is here, what the session is about, and how the group will work.</p>
      ${empty ? `<div class="card guide"><b>Practice first?</b> The problem and the facts are filled in; you find the causes.<ul class="small" style="margin:6px 0 0;padding-left:18px">${X.CASES.map(c => `<li style="margin:4px 0"><button class="btn sm pri" data-act="training" data-case="${esc(c.ref)}" title="${esc(c.tip)}">Practice case ${esc(c.ref)}</button> ${esc(c.label)}</li>`).join('')}</ul></div>` : ''}
      <div class="card"><div class="eyebrow">Session</div><div class="grid2">${f('title', 'Session title', 'Short name for the problem or incident.')}${f('ref', 'Reference', 'Your incident, problem or work-order number.')}
        ${f('date', 'Session date', 'Date of this meeting.', 'date')}${f('location', 'Site and area', 'Where the problem is (use an anonymised name for training).')}
        ${f('facilitator', 'Facilitator', 'Runs the discussion and keeps the method on track.')}${f('scribe', 'Scribe', 'Types into this tool during the session.')}</div></div>
      <div class="card"><div class="eyebrow">Attendees</div>${ppl || '<p class="small muted">No one listed yet.</p>'}
        <div class="addrow"><span></span><button class="btn pri" data-act="addPerson" title="Add a person to the attendance list.">+ Add person</button></div></div>
      <div class="card"><div class="eyebrow">Ground rules</div><textarea id="m-rules" data-meta="rules" rows="6" title="Read these out at the start. Change them to suit the group.">${esc(m.rules)}</textarea></div>
      <div class="nav"><span></span><button class="btn pri" data-step="2" title="Agree the problem statement.">Next: problem →</button></div>`;
  }

  function step2() {
    const p = s.problem, f = (k, label, ph, tip) => `<div><label class="f" for="p-${k}">${label}</label><input type="text" id="p-${k}" data-pb="${k}" value="${esc(p[k])}" placeholder="${esc(ph)}" title="${esc(tip)}"></div>`;
    const facts = s.facts.map((x, i) => `<div class="row"><input type="text" data-fact="text" data-id="${x.id}" value="${esc(x.text)}" placeholder="Fact" aria-label="Fact ${i + 1}">
      <input type="text" data-fact="source" data-id="${x.id}" value="${esc(x.source)}" placeholder="Source (log, photo, report…)" aria-label="Source of fact ${i + 1}">
      <button class="btn sm danger" data-act="dropFact" data-id="${x.id}" title="Remove this fact" aria-label="Remove fact ${i + 1}">✕</button></div>`).join('');
    return `<h2>Step 2 · Problem statement</h2><p class="muted">Agree what the problem is before anyone looks for causes.</p>
      <div class="card"><div class="eyebrow">Describe the problem</div><div class="grid2">
        ${f('what', 'What went wrong?', 'e.g. Pump P-101 tripped on high vibration', 'The object and the defect. Say what happened, not why.')}${f('where', 'Where?', 'e.g. Crude unit, pump bay 2', 'Plant, area, equipment number.')}
        ${f('when', 'When?', 'e.g. 4 to 28 March, day and night shift', 'Date, time, shift, or the period it has been happening.')}${f('extent', 'How big or how often?', 'e.g. 4 trips, 19 h lost production', 'Count, size, cost or downtime.')}</div>
        ${f('expected', 'What should have happened?', 'e.g. Runs 12 months between overhauls', 'The standard, design limit or target.')}
        <label class="f" for="statement">Problem statement</label>
        <textarea id="statement" data-pb="statement" title="One or two sentences the whole group agrees on.">${esc(p.statement)}</textarea>
        <p><button class="btn sm" data-act="compose" title="Fill the statement from the fields above. You can then edit it.">Build from the fields above</button></p>
        <label class="f" for="p-effect">Effect (short label for the head of the fishbone)</label>
        <input type="text" id="p-effect" data-pb="effect" value="${esc(p.effect)}" placeholder="e.g. P-101 trips 4× in March" maxlength="120" title="A few words. If empty, the problem statement is used."></div>
      <div class="card"><div class="eyebrow">Facts already known</div>${facts || '<p class="small muted">No facts listed yet.</p>'}
        <div class="addrow"><button class="btn" data-act="importCb" title="Bring in the case details and the timeline from a Storyline Casebook case file (.casebook-case.json). Timeline events become facts. Nothing you typed is overwritten.">Import from Casebook</button><button class="btn pri" data-act="addFact" title="Add a fact and where it comes from.">+ Add fact</button></div></div>
      ${AI.bar('Check the problem statement', 'The AI checks the statement against the facts: is it an effect, not a cause; is anything missing? It suggests a better wording.')}
      <div class="nav"><button class="btn" data-step="1">← Step 1</button><button class="btn pri" data-step="3" title="Brainstorm causes on the fishbone diagram.">Next: Ishikawa →</button></div>`;
  }

  const legend = '<div class="legend"><span>Raised</span><span class="lk">? Likely</span><span class="ok">✓ Confirmed by evidence</span><span class="ro">✗ Ruled out</span><span><b>◆</b> Selected for 5 Why</span><span>Click a cause on the diagram to edit it.</span></div>';

  function step3() {
    const catOpts = id => s.cats.map(k => `<option value="${k.id}" ${k.id === id ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
    const bones = s.cats.map(k => {
      const L = M.onBone(s, k.id), pr = M.PROMPTS[k.name] || [];
      return `<div class="card bone" id="bone-${k.id}"><h3><input type="text" data-catname="${k.id}" value="${esc(k.name)}" aria-label="Category name" title="Rename this category.">
          <button class="btn sm danger" data-act="dropCat" data-id="${k.id}" title="Remove this category. Its causes move to the first category." aria-label="Remove category ${esc(k.name)}">✕</button></h3>
        ${L.map(x => `<div class="ci${x.parent ? ' sub' : ''}${x.id === sel ? ' sel' : ''}" id="ci-${x.id}"><input type="text" data-cause="text" data-id="${x.id}" value="${esc(x.text)}" aria-label="${x.parent ? 'Sub-cause' : 'Cause'}" title="${x.parent ? 'Sub-cause: why could the cause above happen?' : 'Possible cause'}">
          <span class="acts">${x.parent ? '' : `<button class="btn sm" data-act="addSub" data-id="${x.id}" title="Add a sub-cause: why could this happen?" aria-label="Add sub-cause">+ why</button>
            <select data-move="${x.id}" aria-label="Move to category" title="Move this cause (and its sub-causes) to another category." style="width:auto">${catOpts(k.id)}</select>`}
            <button class="btn sm danger" data-act="dropCause" data-id="${x.id}" title="Delete this ${x.parent ? 'sub-cause' : 'cause and its sub-causes'}" aria-label="Delete">✕</button></span></div>`).join('') || '<p class="small muted">No causes yet.</p>'}
        ${pr.length ? `<details><summary class="small" title="Questions to read out to the group for this category.">Prompt questions</summary><ul class="small">${pr.map(q => '<li>' + esc(q) + '</li>').join('')}</ul></details>` : ''}</div>`;
    }).join('');
    const park = s.parking.map((x, i) => `<div class="addrow"><input type="text" data-park="${x.id}" value="${esc(x.text)}" aria-label="Parking lot item ${i + 1}"><button class="btn sm danger" data-act="dropPark" data-id="${x.id}" title="Remove from the parking lot" aria-label="Remove parking lot item ${i + 1}">✕</button></div>`).join('');
    return `<h2>Step 3 · Ishikawa diagram</h2><p class="muted">Brainstorm possible causes of the effect, one category at a time. Test them in Step 4.</p>
      <div class="card"><div class="quick"><select id="q-cat" aria-label="Category for the new cause" title="Category for the new cause.">${catOpts(arm.qcat)}</select>
        <input type="text" id="q-text" placeholder="Type a possible cause and press Enter" aria-label="New cause" title="Type a cause and press Enter. The box stays ready for the next one.">
        <button class="btn pri" data-act="quickAdd" title="Add this cause to the chosen category.">Add</button></div>
        <div class="fbtools" role="group" aria-label="Diagram zoom"><button class="btn sm" data-zoom="out" title="Zoom out (or Ctrl/⌘ + mouse wheel)" aria-label="Zoom out">−</button><span class="zl" id="zl">Fit</span><button class="btn sm" data-zoom="in" title="Zoom in (or Ctrl/⌘ + mouse wheel)" aria-label="Zoom in">+</button><button class="btn sm" data-zoom="fit" title="Fit the whole diagram in the box">Fit</button><button class="btn sm" data-zoom="1" title="Actual size">100%</button><span class="small muted">Drag the diagram to move it.</span></div><div class="fbw" id="fb"></div>${legend}</div>
      ${AI.bar('Suggest causes', 'The AI suggests possible causes for each category from the facts. They come in as Raised: the group tests them in Step 4.')}
      <div class="bones">${bones}</div>
      <div class="card"><div class="grid2"><div><label class="f" for="set">Category set</label><select id="set" title="Switching renames the categories in order. No causes are lost.">${Object.keys(M.SETS).map(k => `<option value="${k}" ${s.set === k ? 'selected' : ''}>${esc(M.SETS[k].name)}</option>`).join('')}</select></div>
        <div><label class="f">&nbsp;</label><button class="btn" data-act="addCat" title="Add another category (bone).">+ Add category</button></div></div></div>
      <div class="card"><div class="eyebrow">Parking lot (off-topic points)</div>${park || '<p class="small muted">Empty.</p>'}
        <div class="addrow"><input type="text" id="new-park" placeholder="Off-topic point to deal with later" aria-label="New parking lot item"><button class="btn" data-act="addPark" title="Park this point.">Park it</button></div></div>
      <div class="nav"><button class="btn" data-step="2">← Step 2</button><button class="btn pri" data-step="4" title="Test each cause against evidence.">Next: test and select →</button></div>`;
  }

  function row4(x, vbox) {
    return `<tr class="${x.parent ? 'sub' : ''}${x.id === sel ? ' sel' : ''}" id="row-${x.id}">
        <td class="c">${x.parent ? '↳ ' : ''}${esc(x.text)}${arm.byVotes ? ` <span class="small muted">(${esc(M.catName(s, x.cat))})</span>` : ''}<div class="stat" role="group" aria-label="Status">${Object.keys(M.STATUS).map(st => `<button class="sb s-${st}${x.status === st ? ' on' : ''}" data-status="${st}" data-id="${x.id}" aria-pressed="${x.status === st}" title="${esc(M.STATUS[st])}">${esc(M.STATUS[st])}</button>`).join('')}</div>${vbox(x)}</td>
        <td><textarea data-cause="check" data-id="${x.id}" rows="2" placeholder="What would confirm or rule it out?" aria-label="How to check" title="The evidence needed. If it cannot be checked in the room, it goes on the follow-up list.">${esc(x.check)}</textarea></td>
        <td><textarea data-cause="evidence" data-id="${x.id}" rows="2" placeholder="Evidence found, or reason ruled out" aria-label="Evidence or reason" title="What was found, and where (photo, log, test, interview).">${esc(x.evidence)}</textarea></td>
        <td class="pick"><label class="chk" title="Drill this cause with 5 Why in Step 5."><input type="checkbox" data-drill="${x.id}" ${x.drill ? 'checked' : ''}>5 Why</label></td></tr>`;
  }

  function step4() {
    const vt = M.votesTotal(s), vbox = x => `<div class="votes" role="group" aria-label="Dot-votes"><button class="sb" data-vote="-1" data-id="${x.id}" title="Take one dot off" aria-label="Remove a vote">−</button><b class="vn" title="Dot-votes from the room">${x.votes || 0}</b><button class="sb" data-vote="1" data-id="${x.id}" title="Add one dot: one per vote from the room" aria-label="Add a vote">+</button></div>`;
    if (arm.byVotes) {
      const L = s.causes.filter(x => (x.text || '').trim()).slice().sort((a, b) => (b.votes || 0) - (a.votes || 0));
      arm.list = L;
    }
    const rows = arm.byVotes ? '<tr class="cat"><td colspan="4">All causes, most votes first</td></tr>' + arm.list.map(x => row4(x, vbox)).join('') : s.cats.map(k => {
      const L = M.onBone(s, k.id).filter(x => (x.text || '').trim());
      if (!L.length) return '';
      return `<tr class="cat"><td colspan="4">${esc(k.name)}</td></tr>` + L.map(x => row4(x, vbox)).join('');
    }).join('');
    return `<h2>Step 4 · Test and select</h2><p class="muted">Test each cause against evidence. Then select the causes to drill with 5 Why.</p>
      <div class="card"><div class="counts" id="counts"></div>
        <div class="nav" style="margin:6px 0"><label class="chk" title="List every cause with the most dot-votes first, instead of by category."><input type="checkbox" id="byvotes" ${arm.byVotes ? 'checked' : ''}>Most votes first</label>
          ${vt ? `<button class="btn sm" data-act="clearVotes" title="Set every vote back to zero (click twice).">Clear votes</button>` : '<span class="small muted">Dot-vote: each person gets about 3 dots to place on the causes they think matter most.</span>'}</div>
        ${AI.bar('Suggest how to check', 'For causes with no check yet, the AI suggests what evidence would confirm or rule each one out.')}<details><summary class="small">Show the diagram</summary><div class="fbtools" role="group" aria-label="Diagram zoom"><button class="btn sm" data-zoom="out" title="Zoom out (or Ctrl/⌘ + mouse wheel)" aria-label="Zoom out">−</button><span class="zl" id="zl">Fit</span><button class="btn sm" data-zoom="in" title="Zoom in (or Ctrl/⌘ + mouse wheel)" aria-label="Zoom in">+</button><button class="btn sm" data-zoom="fit" title="Fit the whole diagram in the box">Fit</button><button class="btn sm" data-zoom="1" title="Actual size">100%</button><span class="small muted">Drag the diagram to move it.</span></div><div class="fbw" id="fb"></div>${legend}</details></div>
      <div class="card tw"><table class="t"><thead><tr><th>Cause and status</th><th>How to check</th><th>Evidence or reason</th><th>Select</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No causes yet (Step 3).</td></tr>'}</tbody></table></div>
      <div class="nav"><button class="btn" data-step="3">← Step 3</button><button class="btn pri" data-step="5" title="Drill each selected cause with 5 Why.">Next: 5 Why →</button></div>`;
  }

  function step5() {
    const D = M.drilled(s);
    const link = (w, n) => {
      const kids = M.whyKids(s, w.id);
      return `<li class="why${w.root ? ' root' : ''}${w.id === sel ? ' sel' : ''}" id="w-${w.id}"><div class="wq">Why ${n}? <span class="muted">${esc(M.whyQuestion(s, w).replace(/^Why\? /, ''))}</span></div>
        <div class="wrow"><input type="text" data-why="text" data-id="${w.id}" value="${esc(w.text)}" placeholder="Because…" aria-label="Answer to why ${n}" title="The group's answer, in their words.">
          <label class="chk" title="This answer is a root cause: fixing it stops the problem coming back."><input type="checkbox" data-root="${w.id}" ${w.root ? 'checked' : ''}>Root cause</label></div>
        <input type="text" class="ev" data-why="evidence" data-id="${w.id}" value="${esc(w.evidence)}" placeholder="Evidence (how do we know?)" aria-label="Evidence for why ${n}" title="Log, photo, test, record or interview that supports this answer.">
        <div class="wacts"><button class="btn sm" data-act="askWhy" data-id="${w.id}" title="Ask why again about this answer.">+ Why?</button>
          <button class="btn sm" data-act="branch" data-id="${w.id}" title="Another answer to the same question: the chain branches.">+ Another answer</button>
          ${w.root ? `<button class="btn sm" data-act="therefore" data-id="${w.id}" title="Read the chain back up with 'therefore' to check the logic.">Therefore check</button>` : ''}
          <button class="btn sm danger" data-act="dropWhy" data-id="${w.id}" title="Delete this answer${kids.length ? ' and the whys below it' : ''}." aria-label="Delete why ${n}">✕</button></div>
        ${arm.tf === w.id ? `<div class="tf" role="note"><b>Read back:</b> ${esc(M.therefore(s, w.id))}. <span class="muted">Does each "therefore" follow? If not, a step is missing.</span></div>` : ''}
        ${kids.length ? `<ol class="chain">${kids.map(k => link(k, n + 1)).join('')}</ol>` : ''}</li>`;
    };
    const cards = D.map(c => {
      const first = M.firstWhys(s, c.id);
      return `<div class="card" id="chain-${c.id}"><div class="eyebrow">${esc(M.catName(s, c.cat))} · ${esc(M.STATUS[c.status])}</div><h3 class="ct">${esc(c.text || '(no text)')}</h3>
        ${first.length ? `<ol class="chain lvl1">${first.map(w => link(w, 1)).join('')}</ol>` : ''}
        <button class="btn${first.length ? ' sm' : ' pri'}" data-act="addWhy" data-id="${c.id}" title="${first.length ? 'Another answer to the first why.' : 'Start the chain: why did this happen?'}">${first.length ? '+ Another answer to why 1' : '+ Why did this happen?'}</button></div>`;
    }).join('');
    return `<h2>Step 5 · 5 Why</h2><p class="muted">For each selected cause, ask why until you reach a root cause the site can fix.</p>
      ${D.length ? AI.bar('Suggest next whys', 'For the last answer of each open chain, the AI suggests possible next answers. They are hypotheses: the group decides, and checks them against evidence.') : ''}
      ${cards || '<div class="card"><p class="muted">No causes selected. In Step 4, tick "5 Why" next to the causes to drill.</p></div>'}
      <div class="nav"><button class="btn" data-step="4">← Step 4</button><button class="btn pri" data-step="6" title="Actions for each root cause, then the record.">Next: actions and record →</button></div>`;
  }

  function step6() {
    const R = M.roots(s), so = s.signoff;
    const typeOpts = v => Object.keys(M.ACTION_TYPES).map(k => `<option value="${k}" ${v === k ? 'selected' : ''}>${esc(M.ACTION_TYPES[k])}</option>`).join('');
    const rootOpts = v => '<option value="">(not linked)</option>' + R.map(w => `<option value="${w.id}" ${v === w.id ? 'selected' : ''}>${esc(w.text.slice(0, 60))}</option>`).join('');
    const act = (a, i) => `<div class="act${a.id === sel ? ' sel' : ''}" id="a-${a.id}"><div class="arow"><span class="no">${i + 1}</span>
        <input type="text" data-a="text" data-id="${a.id}" value="${esc(a.text)}" placeholder="Action: what will be done" aria-label="Action ${i + 1}" title="A clear action: who does what to remove or control the root cause.">
        <button class="btn sm danger" data-act="dropAction" data-id="${a.id}" title="Delete this action" aria-label="Delete action ${i + 1}">✕</button></div>
      <div class="agrid"><select data-a="root" data-id="${a.id}" aria-label="Root cause for action ${i + 1}" title="The root cause this action removes.">${rootOpts(a.root)}</select>
        <select data-a="type" data-id="${a.id}" aria-label="Action type" title="Contain = control the risk now. Correct = fix this case. Prevent = remove the root cause so it does not come back.">${typeOpts(a.type)}</select>
        <input type="text" data-a="owner" data-id="${a.id}" value="${esc(a.owner)}" placeholder="Owner" aria-label="Owner of action ${i + 1}" title="One named person.">
        <input type="date" data-a="due" data-id="${a.id}" value="${esc(a.due)}" aria-label="Due date of action ${i + 1}" title="Due date.">
        <select data-a="status" data-id="${a.id}" aria-label="Status of action ${i + 1}" title="Open or done."><option value="open" ${a.status !== 'done' ? 'selected' : ''}>Open</option><option value="done" ${a.status === 'done' ? 'selected' : ''}>Done</option></select></div></div>`;
    const roots = R.map(w => { const L = s.actions.filter(a => a.root === w.id);
      return `<div class="card"><div class="eyebrow">Root cause</div><h3 class="ct">${esc(w.text)}</h3><p class="small muted">From: ${esc((M.byId(s, w.cause) || {}).text || '')}</p>
        ${L.map(a => act(a, s.actions.indexOf(a))).join('')}<button class="btn sm pri" data-act="addAction" data-id="${w.id}" title="Add an action for this root cause.">+ Action</button></div>`; }).join('');
    const loose = s.actions.filter(a => !R.some(w => w.id === a.root));
    const unl = M.unlisted(s).length;
    const enq = s.enquiries.map((e, i) => `<div class="act" id="q-${e.id}"><div class="arow"><span class="no">${i + 1}</span>
        <input type="text" data-q="text" data-id="${e.id}" value="${esc(e.text)}" placeholder="What do we still need to find out?" aria-label="Enquiry ${i + 1}">
        <button class="btn sm danger" data-act="dropEnq" data-id="${e.id}" title="Delete this enquiry" aria-label="Delete enquiry ${i + 1}">✕</button></div>
      <div class="agrid q"><input type="text" data-q="who" data-id="${e.id}" value="${esc(e.who)}" placeholder="Who will find out" aria-label="Who, enquiry ${i + 1}">
        <input type="date" data-q="due" data-id="${e.id}" value="${esc(e.due)}" aria-label="Due, enquiry ${i + 1}">
        <select data-q="status" data-id="${e.id}" aria-label="Status, enquiry ${i + 1}"><option value="open" ${e.status !== 'closed' ? 'selected' : ''}>Open</option><option value="closed" ${e.status === 'closed' ? 'selected' : ''}>Closed</option></select>
        <input type="text" data-q="answer" data-id="${e.id}" value="${esc(e.answer)}" placeholder="Answer found" aria-label="Answer, enquiry ${i + 1}"></div></div>`).join('');
    const sf = (k, label, type) => `<div><label class="f" for="so-${k}">${label}</label><input type="${type || 'text'}" id="so-${k}" data-so="${k}" value="${esc(so[k])}"></div>`;
    return `<h2>Step 6 · Actions and record</h2><p class="muted">An action for every root cause, what is still to find out, and the record of the session.</p>
      ${R.length ? AI.bar('Suggest actions', 'For root causes without an action, the AI suggests actions that remove the cause, highest control first. You add the owner and due date.') : ''}
      ${roots || '<div class="card"><p class="muted">No root cause marked yet. In Step 5, tick "Root cause" on the last answer of each chain.</p></div>'}
      ${loose.length ? `<div class="card"><div class="eyebrow">Actions not linked to a root cause</div>${loose.map(a => act(a, s.actions.indexOf(a))).join('')}</div>` : ''}
      <div class="card"><div class="eyebrow">Enquiries register</div>${enq || '<p class="small muted">No enquiries.</p>'}
        <div class="nav" style="margin-top:6px"><button class="btn sm" data-act="addEnq" title="Add something still to find out.">+ Enquiry</button>
        ${unl ? `<button class="btn sm pri" data-act="fromChecks" title="Copy the causes still to check (Step 4) onto the register.">Add ${unl} cause(s) still to check</button>` : ''}</div></div>
      <div class="card"><div class="eyebrow">Sign-off</div><div class="grid2">${sf('name', 'Name')}${sf('role', 'Role')}${sf('date', 'Date', 'date')}</div>
        <label class="f" for="so-note">Note</label><textarea id="so-note" data-so="note" rows="2">${esc(so.note)}</textarea></div>
      <div class="card"><div class="eyebrow">Record and exports</div><div class="exp">
        <button class="btn pri" data-act="print" title="Print the session record on A4, or save it as PDF.">Print record</button>
        <button class="btn" data-act="word" title="Download the record as a Word document (.doc).">Word record</button>
        <button class="btn" data-act="png" title="Download the fishbone diagram as a picture (PNG).">Diagram PNG</button>
        <button class="btn" data-act="svg" title="Download the fishbone diagram as a scalable drawing (SVG).">Diagram SVG</button>
        <button class="btn" data-act="csv" title="Download the actions as a spreadsheet (CSV) for your action tracker.">Actions CSV</button>
        <button class="btn" data-act="exportCb" title="Download a Storyline Casebook case file with the facts, root causes and actions, to continue the investigation in the Casebook.">Send to Casebook</button></div></div>
      <div class="nav"><button class="btn" data-step="5">← Step 5</button><span></span></div>`;
  }

  /* ---------- AI assist (own AI key, KitAI) ----------
     KitAI shows every request before it is sent. Every suggestion is ticked in a dialog before it is used; nothing is applied silently. */
  const AI = (() => {
    let busy = false;
    const on = () => !!window.KitAI;
    const str = (v, n) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n || 400);
    const bar = (label, tip) => on() ? `<div class="aibar"><button class="btn" data-act="ai" ${busy ? 'disabled' : ''} title="${esc(tip)} Uses your own AI key; you see the request first.">&#10022; ${esc(label)}</button></div>` : '';
    const ROLE = 'You are an experienced facilitator of root cause analysis meetings. The team uses the Ishikawa (cause-and-effect, fishbone) diagram and then 5 Why.';
    const RULES = ['Use only these method terms: effect, cause category, cause, sub-cause (Ishikawa); why, answer, root cause (5 Why). Do not use terms from other methods.',
      'Use only the facts given. Do not invent names, times, numbers or findings. Where something is not known, write "?".',
      'Never stop at a person: no "human error", "carelessness", "did not follow the procedure" or blame. Ask what made the action possible or sensible at the time.',
      'Plain English, short sentences, for a reader with Grade 12 who may work in a second language. Metric units.', 'Answer with one JSON object only, no other text.'];
    const C = () => s.causes.filter(x => (x.text || '').trim()), cn = x => 'C' + (C().indexOf(x) + 1);
    function sheet() {
      const p = s.problem, L = [`SESSION: ${str(s.meta.title, 200)}`, `Effect: ${str(M.effect(s), 300)}`, `Problem statement: ${str(p.statement, 1000) || '?'}`,
        `What: ${str(p.what) || '?'} | Where: ${str(p.where) || '?'} | When: ${str(p.when) || '?'} | How big or how often: ${str(p.extent) || '?'} | Expected: ${str(p.expected) || '?'}`, '', 'FACTS'];

      img.onload = () => { try { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const g = c.getContext('2d'); g.scale(2, 2); g.drawImage(img, 0, 0, w, h); res(c.toDataURL('image/png')); } catch (e) { res(null); } };
      img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
    });
  }
  // Projector mode: large text, side panel hidden; remembered on this device
  function setProj(on) { document.body.classList.toggle('proj', on); try { localStorage.setItem(PKEY, on ? '1' : ''); } catch (e) { } const b = $('[data-act=projector]'); if (b) b.setAttribute('aria-pressed', on); }
  function importCb(f) {
    if (!f) return;
    f.text().then(t => { const n = M.importCasebook(s, JSON.parse(t)); save(); render(); toast(n + ' fact(s) added from the Casebook. Nothing you typed was overwritten.'); })
      .catch(err => toast(err instanceof SyntaxError ? 'That file is not a Casebook case file.' : err.message));
  }
  function openFile(f) {
    if (!f) return;
    f.text().then(t => { s = M.load(JSON.parse(t)); step = 1; sel = null; save(); render(); toast('Opened ' + f.name); })
      .catch(err => toast(err instanceof SyntaxError ? 'That file is not an RCA session file.' : err.message));
  }
  document.head.insertAdjacentHTML('beforeend', '<style>' + F.CSS + '</style>');
  render();
  try { if (localStorage.getItem(PKEY)) setProj(true); } catch (e) { }
  if (window.KitAI) $('[data-act=aiSettings]').hidden = false;
  if (location.hash === '#handoff' && window.KIT) KIT.KitHandoff.take('5why').then(v => { if (v && v.handle) { handoff = v; render(); } }).catch(() => {});
  window.__rcas = { get session() { return s; } };   // for tests
})();
</script>
