<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5 Why and Ishikawa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: step tabs, a side panel (guidance, checks, follow-up list) and the main work area. Under 900 px it stacks in one column. */
:root {
  --bg:#eef1f4; --surface:#fff; --surface-2:#f5f7f9; --ink:#142132; --muted:#5a6779; --line:#d3dae2;
  --accent:#1d4ea3; --accent-ink:#fff; --accent-soft:#e3ebf8;
  --err:#b42318; --err-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff3dc; --tip:#276a8a; --tip-soft:#e4f1f7; --ok:#20734a; --ok-soft:#e3f4ea;
  --q:#1d5fc4; --brand:#0f2a4d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --r:6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0e141b; --surface:#161f2a; --surface-2:#1c2633; --ink:#e3e9f0; --muted:#96a3b4; --line:#2b3746;
  --accent:#82a8ff; --accent-ink:#0b1220; --accent-soft:#1d2c47;
  --err:#ff8a80; --err-soft:#3a1d1d; --warn:#f5b74e; --warn-soft:#362a14; --tip:#7cc4e4; --tip-soft:#15303c; --ok:#6fd39c; --ok-soft:#14301f;
  --q:#8ab4ff; --brand:#0a1d36; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0e141b; --surface:#161f2a; --surface-2:#1c2633; --ink:#e3e9f0; --muted:#96a3b4; --line:#2b3746;
  --accent:#82a8ff; --accent-ink:#0b1220; --accent-soft:#1d2c47;
  --err:#ff8a80; --err-soft:#3a1d1d; --warn:#f5b74e; --warn-soft:#362a14; --tip:#7cc4e4; --tip-soft:#15303c; --ok:#6fd39c; --ok-soft:#14301f;
  --q:#8ab4ff; --brand:#0a1d36; color-scheme:dark }
[hidden] { display:none !important; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--f-body); }
h1,h2,h3 { font-family:var(--f-display); font-weight:600; line-height:1.15; margin:0 0 6px; }
h2 { font-size:1.45rem; } h3 { font-size:1.1rem; margin-top:14px; }
p { margin:4px 0; } .muted { color:var(--muted); } .small { font-size:.86rem; }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:5px 11px; cursor:pointer; white-space:nowrap; }
.btn:hover { border-color:var(--accent); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.sm { padding:2px 8px; font-size:.85rem; }
.btn.danger { color:var(--err); }
input[type=text], input[type=date], select, textarea { width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:5px 8px; min-width:0; }
textarea { min-height:58px; resize:vertical; }
label.f { display:block; margin:10px 0 2px; font-weight:600; font-size:.9rem; }
label.chk { display:flex; gap:6px; align-items:center; margin:4px 0; cursor:pointer; }
#app { height:100%; display:flex; flex-direction:column; }
.top { background:var(--brand); color:#fff; display:flex; align-items:center; gap:10px; padding:8px 14px; flex-wrap:wrap; }
.top .co { font-family:var(--f-display); font-weight:700; letter-spacing:.14em; font-size:.82rem; color:#9fc0ff; text-transform:uppercase; }
.top .app { font-family:var(--f-display); font-weight:600; font-size:1.3rem; }
.top .case-name { flex:1 1 160px; min-width:0; color:#d6e2f5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top .btn { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); }
.tabs { display:flex; gap:2px; padding:6px 10px 0; background:var(--surface-2); border-bottom:1px solid var(--line); overflow-x:auto; }

.tab.on { background:var(--surface); border-color:var(--line); font-weight:600; }
.tab[disabled] { color:var(--muted); cursor:not-allowed; }
.tab .n { display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent); text-align:center; font-size:.8rem; line-height:20px; margin-right:5px; }
.tab.done .n { background:var(--ok); color:#fff; }
.work { flex:1; display:grid; grid-template-columns:300px minmax(0,1fr); min-height:0; overflow:hidden; }
.panel { background:var(--surface); overflow:auto; padding:12px 14px; min-width:0; border-right:1px solid var(--line); }
.main { overflow:auto; padding:14px 18px 40px; min-width:0; }
.wrap { max-width:1100px; }
.card { border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; margin:10px 0; background:var(--surface); }

.issue { display:block; width:100%; text-align:left; border:0; border-left:3px solid var(--tip); background:var(--tip-soft); padding:4px 8px; margin:3px 0; border-radius:4px; cursor:pointer; font-size:.86rem; }

.chip:hover { border-color:var(--accent); }

.fbw svg { display:block; margin:0 auto; } .fbw { cursor:grab; } .fbw.drag { cursor:grabbing; user-select:none; }
.fbtools { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:6px 0; } .fbtools .zl { min-width:74px; text-align:center; font-size:.85rem; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.82rem; color:var(--muted); margin:4px 0; }
.legend .ok { color:var(--ok); font-weight:600; } .legend .lk { color:var(--warn); } .legend .ro { text-decoration:line-through; }
.bones { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:10px; }
.bone h3 { margin:0 0 4px; color:var(--accent); display:flex; gap:6px; align-items:center; }

.bone h3 input:hover, .bone h3 input:focus { border-color:var(--line); }

.ci .acts { display:flex; gap:3px; } .ci .acts select { width:auto; max-width:120px; }
.ci.sel input { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.tw { overflow-x:auto; }
table.t { border-collapse:collapse; width:100%; font-size:.9rem; } table.t th, table.t td { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }

table.t tr.sub td.c { padding-left:26px; }
table.t tr.sel td { background:var(--accent-soft); }
.stat { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
table.t td.pick { white-space:nowrap; }
.sb { border:1px solid var(--line); background:var(--surface); border-radius:4px; padding:2px 7px; cursor:pointer; font-size:.82rem; }
.sb.on.s-raised { background:var(--muted); border-color:var(--muted); color:#fff; } .sb.on.s-likely { background:var(--warn); border-color:var(--warn); color:#fff; }

.counts { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.88rem; }
.nav { display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
.src { font-size:.78rem; color:var(--muted); margin-top:18px; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:7px 14px; border-radius:var(--r); z-index:60; font-size:.9rem; }
@media (max-width: 900px) {
  #app { height:auto; min-height:100%; } .work { grid-template-columns:minmax(0,1fr); overflow:visible; }
  .main { order:-1; padding:10px 12px 20px; }
  .panel { border-right:0; border-top:1px solid var(--line); }
  .top .co { display:none; }
  .quick { grid-template-columns:minmax(0,1fr) auto; } .quick select { grid-column:1 / -1; }
  .row { grid-template-columns:minmax(0,1fr) auto; } .row > :nth-child(2) { grid-column:1; grid-row:2; }
  .bones { grid-template-columns:minmax(0,1fr); }
  .ci { grid-template-columns:minmax(0,1fr); } .ci .acts { justify-content:flex-end; }
  table.t thead { display:none; } table.t, table.t tbody, table.t tr, table.t td { display:block; width:100%; }
  table.t td { border-bottom:0; padding:4px 6px; } table.t tr { border-bottom:1px solid var(--line); padding:4px 0; } table.t tr.sub td.c { padding-left:6px; }
  .fbw { max-height:60vh; }
  .agrid, .agrid.q { grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin-left:0; }
}
/* Step 5 chains and Step 6 actions */
ol.chain { list-style:none; margin:6px 0 0; padding-left:22px; border-left:2px solid var(--accent-soft); } ol.chain.lvl1 { padding-left:8px; border-left:0; }
li.why { margin:8px 0; } li.why .wq { font-weight:600; font-size:.92rem; } li.why.root > .wrow input[type=text] { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok-soft); font-weight:600; }
li.why.sel > .wrow input[type=text] { border-color:var(--accent); }
.wrow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; margin:3px 0; } .wrow .chk { white-space:nowrap; }
li.why input.ev { font-size:.86rem; margin:2px 0; } .wacts { display:flex; flex-wrap:wrap; gap:4px; margin:3px 0; }
.tf { background:var(--ok-soft); border-left:3px solid var(--ok); padding:5px 8px; margin:4px 0; font-size:.88rem; border-radius:4px; }
h3.ct { color:var(--ink); margin:2px 0 4px; }
.act { border-top:1px dashed var(--line); padding:6px 0; } .act.sel { background:var(--accent-soft); }
.arow { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px; align-items:center; } .arow .no { font-weight:600; color:var(--muted); min-width:18px; }
.agrid { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr); gap:6px; margin:4px 0 0 24px; }
.agrid.q { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,2fr); }
.exp { display:flex; flex-wrap:wrap; gap:6px; }
#print { display:none; }
.votes { display:inline-flex; align-items:center; gap:4px; margin-top:4px; } .votes .vn { min-width:22px; text-align:center; } .votes .sb { padding:0 8px; font-weight:600; }
.aibar { margin:8px 0; }
.rai-bg { position:fixed; inset:0; background:rgba(10,18,30,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:16px; }
.rai { background:var(--surface); color:var(--ink); border-radius:10px; padding:16px 18px; width:min(720px,100%); max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.rai-item { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); font-size:.9rem; cursor:pointer; } .rai-item input { margin-top:4px; }
/* Projector mode */
body.proj { font-size:18px; } body.proj .work { grid-template-columns:minmax(0,1fr); } body.proj .panel { display:none; } body.proj .wrap { max-width:none; }
body.proj .fb { font-size:15px; } body.proj [data-act=projector] { background:#fff; color:var(--brand); }
@media print { #app, .toast, .kit-tip { display:none !important; } body { background:#fff; } #print { display:block; } @page { size:A4; margin:14mm; } }

<body>
<div id="app">
  <header class="top">
    <span class="co">Istec Training</span><span class="app">5 Why and Ishikawa</span>
    <span class="case-name" id="case-name"></span>
    <button class="btn" data-act="new" title="Start a new, empty session. Save the current session first if you want to keep it.">New</button>
    <button class="btn" data-act="open" title="Open a session file you saved before (.rca-session.json).">Open</button>
    <button class="btn" data-manual="" title="Open the user manual for this tool.">User manual</button>
    <button class="btn" data-act="save" title="Download this session as a file (.rca-session.json) to keep or send.">Save</button>
    <button class="btn" data-act="aiSettings" hidden title="Choose your AI provider and enter your own API key. The key stays in this browser and is never saved in session files.">AI settings</button>
    <button class="btn" data-act="projector" aria-pressed="false" title="Projector mode: large text and no side panel, for the room to read. Click again to switch off.">Projector</button>
    <input type="file" id="f-open" accept=".json,application/json" hidden>
    <input type="file" id="f-cb" accept=".json,application/json" hidden>
  </header>

  <div class="work">
    <aside class="panel" id="panel"></aside>
    <section class="main" id="main"></section>
  </div>
</div>
<div id="print"></div>
<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';
      i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  async function permission(handle, ask) {
    if (!handle || !handle.queryPermission) return 'denied';
    try {
      let s = await handle.queryPermission({ mode: 'readwrite' });
      if (s !== 'granted' && ask) s = await handle.requestPermission({ mode: 'readwrite' });
      return s;
    } catch (e) { return 'denied'; }
  }
  /* opts: {tool, ext, label, mime} e.g. {tool:'tripod', ext:'.tripod.json', label:'Tripod Beta case'} */
  function FileLink(opts) {
    const types = [{ description: opts.label, accept: { [opts.mime || 'application/json']: [opts.ext.slice(opts.ext.lastIndexOf('.'))] } }];
    const key = id => 'handle:' + opts.tool + ':' + id;
    return {
      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {
        if (!hasFSA) { download(suggested, text, opts.mime || 'application/json'); return { handle: null, name: suggested, downloaded: true }; }
        let h;
        try { h = await window.showSaveFilePicker({ suggestedName: suggested, types, id: 'iikit-cases' }); }
        catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
        await this.write(h, text);
        await KitStore.set(key(id), h);
        return { handle: h, name: h.name };
      },
      async write(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); },
      /* Open a file; returns {handle|null, name, text} or null. */
      async open() {
        if (hasFSA) {
          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }
          catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
          const f = await hs[0].getFile();
          return { handle: hs[0], name: f.name, text: await f.text(), modified: f.lastModified };
        }
        const f = await pickWithInput(opts.ext + ',.json,application/json');
        return f ? { handle: null, name: f.name, text: await f.text(), modified: f.lastModified } : null;
      },
      async link(id, h) { if (h) await KitStore.set(key(id), h); },
      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },
      permission,
      download: (name, text) => download(name, text, opts.mime || 'application/json')
    };
  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));
        localStorage.setItem(RK, JSON.stringify(L.slice(-500)));
      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };
  /* action summary helper: items [{status, due}] with open statuses */
  function actionStats(items, isOpen, dueOf) {
    const today = new Date().toISOString().slice(0, 10);
    let open = 0, overdue = 0; const dues = [];
    (items || []).forEach(a => { if (isOpen(a)) { open++; const d = dueOf(a); if (d) dues.push(String(d).slice(0, 10)); if (d && d < today) overdue++; } });
    return { total: (items || []).length, open, overdue, dues };
  }

  /* ---------- dashboard -> tool hand-off ---------- */
  const KitHandoff = {
    async put(tool, handle, name) { return KitStore.set('handoff:' + tool, { handle, name, at: Date.now() }); },
    async take(tool) { const v = await KitStore.get('handoff:' + tool); await KitStore.del('handoff:' + tool); return v && Date.now() - v.at < 10 * 60000 ? v : null; }
  };

  return { VERSION, hasFSA, hasDirPicker, KitStore, FileLink, KitRegistry, KitHandoff, actionStats, download, pickWithInput, permission };
})();

window.TOOL_MANUAL = {"title":"5 Why and Ishikawa · User manual","html":"\n<h1 id=\"start\">5 Why and Ishikawa: user manual</h1>\n<p>Version 1.5.2 (25 Nov 2026). This manual explains how to run a root cause analysis meeting with the tool, step by step, and how to produce the record. Most pictures use a short fictional example made for this manual: <b>MAN-5W-01, pump P-101 trips on high vibration</b>. The Step 1 picture shows the button for the practice case <b>5W-EX-01</b> that is built into the tool.</p>\n<div class=\"tip\">The tool combines two well-known methods. The <b>Ishikawa diagram</b> (also called a cause-and-effect or fishbone diagram, after Kaoru Ishikawa) collects the possible causes of a problem by category. <b>5 Why</b> (from the Toyota Production System, Taiichi Ohno) asks \"why?\" again and again until it reaches a root cause. The guidance in the tool and in this manual is our own summary. The category sets (6M, 4M, 8P, 4S) are common practice and vary between sources.</div>\n\n<h2 id=\"about\">1. What the tool is for</h2>\n<p>Use it to guide and record a root cause analysis <b>meeting</b>. One person, the <b>scribe</b>, types into the tool on a laptop. The laptop is connected to a projector or a large screen. The <b>facilitator</b> runs the discussion. The tool:</p>\n<ul>\n  <li>shows the facilitator what to do at each step (the guidance in the side panel);</li>\n  <li>builds the fishbone diagram live, while the group talks;</li>\n  <li>keeps track of which causes are confirmed, likely or ruled out, and why;</li>\n  <li>warns when a 5 Why chain stops at a person (\"human error\") or too early;</li>\n  <li>makes the record of the meeting: problem, diagram, causes, 5 Why chains, actions, enquiries and sign-off.</li>\n</ul>\n<p>It works offline from one file, on a laptop, tablet or phone. Nothing is sent anywhere, unless you use the optional AI assist with your own AI key (section 11).</p>\n\n<h2 id=\"quick-start\">2. Quick start</h2>\n<ol>\n  <li><b>Step 1 Set-up:</b> session title, facilitator, scribe, the people in the room and the ground rules.</li>\n  <li><b>Step 2 Problem:</b> agree one problem statement (the effect, not the cause) and list the facts already known.</li>\n  <li><b>Step 3 Ishikawa:</b> brainstorm possible causes, one category at a time. Type a cause and press <span class=\"ui\">Enter</span>.</li>\n  <li><b>Step 4 Test and select:</b> test each cause against evidence: <b>likely</b>, <b>confirmed by evidence</b> or <b>ruled out</b>. Dot-vote if you like. Tick the causes to drill with 5 Why.</li>\n  <li><b>Step 5 5 Why:</b> for each ticked cause, ask why until you reach a root cause. Tick <span class=\"ui\">Root cause</span>.</li>\n  <li><b>Step 6 Actions and record:</b> an action for every root cause, with an owner and a due date. Then print or download the record.</li>\n  <li>Click <span class=\"ui\">Save</span> to download the session as a <code>.rca-session.json</code> file. The browser also keeps the latest session.</li>\n</ol>\n\n<h2 id=\"screen\" class=\"page\">3. The screen</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgM  fishbone.</li>\n  <li>List the facts the team already knows, each with its source (log, photo, report, interview).</li>\n</ol>\n<div class=\"warn\">State the <b>effect</b>, not the cause. \"Pump P-101 tripped 4 times in March\" is a problem statement. \"Pump tripped because of poor maintenance\" is not: the tool warns about words such as \"because\", \"due to\", \"human error\" or \"failed to\".</div>\n<p><span class=\"ui\">Import from Casebook</span> brings in the case details and the timeline from a Storyline Casebook case file (section 12).</p>\n\n<h2 id=\"step3\" class=\"page\">6. Step 3: Ishikawa diagram</h2>\n<ol>\n  <li>Choose the category in the drop-down, type a possible cause and press <span class=\"ui\">Enter</span>. The box stays ready for the next cause, in the same category.</li>\n  <li>Take one category at a time. Open <span class=\"ui\">Prompt questions</span> under a category and read them out.</li>\n  <li><span class=\"ui\">+ why</span> next to a cause adds a <b>sub-cause</b>: why could this cause happen?</li>\n  <li>Move a cause to another category with its drop-down. Delete with <span class=\"ui\">✕</span> (a cause with sub-causes asks you to click twice).</li>\n  <li>Click a cause on the diagram to jump to it.</li>\n  <li>Off-topic points go in the <b>parking lot</b> at the bottom.</li>\n</ol>\n<p>The default categories are <b>6M</b>: People, Machine, Method, Material, Measurement and Environment. Change the set (4M, 8P, 4S or your own) in <b>Category set</b>. You can rename, add and remove categories; no cause is ever lost.</p>\n\n<h2 id=\"step4\" class=\"page\">7. Step 4: Test and select</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWA des or reports. SVG stays sharp at any size.</td></tr>\n  <tr><td><span class=\"ui\">Actions CSV</span></td><td>The actions as a spreadsheet file for your action tracker (opens in Excel).</td></tr>\n  <tr><td><span class=\"ui\">Send to Casebook</span></td><td>A Storyline Casebook case file with the facts, root causes and actions (section 12).</td></tr>\n</table>\n\n<h2 id=\"ai\" class=\"page\">11. AI assist (optional, your own key)</h2>\n<p>With an AI key from Anthropic, OpenAI or Google, a <span class=\"ui\">✦</span> button appears in Steps 2 to 6:</p>\n<table>\n  <tr><th>Step</th><th>The AI…</th></tr>\n  <tr><td>2</td><td>checks the problem statement and suggests a better wording and an effect label</td></tr>\n  <tr><td>3</td><td>suggests possible causes per category from the facts (they come in as Raised)</td></tr>\n  <tr><td>4</td><td>suggests what evidence would confirm or rule out each open cause</td></tr>\n  <tr><td>5</td><td>suggests possible next answers to \"why?\" (marked as hypotheses to check)</td></tr>\n  <tr><td>6</td><td>suggests actions for root causes that have none</td></tr>\n</table>\n<ul>\n  <li>Click <span class=\"ui\">AI settings</span> to choose the provider and enter your key. The key stays in this browser. It is never saved in a session file or the record.</li>\n  <li>Before anything is sent, you see the full request. Replace names or delete anything you do not want to send.</li>\n  <li>Every suggestion comes in a list with tick boxes. Untick what does not fit; nothing is applied without you.</li>\n</ul>\n<div class=\"warn\">The AI only knows what is in the session. It can be wrong. The group decides, and every cause, answer and action must be checked against the evidence.</div>\n\n<h2 id=\"casebook\">12. Working with the Storyline Casebook</h2>\n<ul>\n  <li><b>In:</b> Step 2, <span class=\"ui\">Import from Casebook</span>, choose a <code>.casebook-case.json</code> file (exported from the Casebook). The case title, site and date fill only the empty fields; each timeline event becomes a fact with the source \"Casebook timeline\". Importing twice does not add the same fact twice.</li>\n  <li><b>Out:</b> Step 6, <span class=\"ui\">Send to Casebook</span>, downloads a <code>.casebook-case.json</code> file with the facts, the confirmed causes (as contributing factors), the root causes and the actions. Import it in the Casebook to continue the investigation there.</li>\n</ul>\n\n<h2 id=\"saving\">13. Saving your work</h2>\n<ul>\n  <li>The browser keeps the latest session on this computer, so a refresh does not lose it. Do not rely on that alone.</li>\n  <li><span class=\"ui\">Save</span> downloads the session as <code>&lt;title&gt;.rca-session.json</code>. On the USB kit, move it into <b>My cases</b> at the end of each session.</li>\n  <li><span class=\"ui\">Open</span> opens a saved session file. <span class=\"ui\">New</span> starts an empty session (click twice): save first.</li>\n</ul>\n\n<h2 id=\"tips\">14. Tips for facilitators</h2>\n<ul>\n  <li>One problem per session. Other problems go to the parking lot.</li>\n  <li>Go round the room in Step 3 so everyone speaks. Write every idea down before anyone argues about it.</li>\n  <li>Use the projector mode so the group sees its own words on the screen.</li>\n  <li>A root cause is something the site can act on. \"Gravity\", \"the weather\" or \"the person\" are not root causes.</li>\n  <li>Close the meeting by reading out the root causes and actions, with owners and dates.</li>\n</ul>\n\n<h2 id=\"trouble\">15. Troubleshooting</h2>\n<table>\n  <tr><th>Problem</th><th>What to do</th></tr>\n  <tr><td>My session is gone after a restart</td><td>The browser was in private mode or its data was cleared. Open your last saved <code>.rca-session.json</code> file.</td></tr>\n  <tr><td>\"This is not an RCA session file\"</td><td>The file is from another tool. Session files end in <code>.rca-session.json</code>.</td></tr>\n  <tr><td>The diagram is too wide for the screen</td><td>It scrolls inside its box. Use Projector mode, or Diagram SVG for a large print.</td></tr>\n  <tr><td>The AI button does nothing useful</td><td>Check AI settings and your key. \"Nothing to add\" means the AI had no suggestions for the current content.</td></tr>\n</table>\n<p class=\"muted\">Practice case 5W-EX-01: facts from the CSB Final Investigation Report, Chevron Richmond Refinery Pipe Rupture and Fire, Report No. 2012-03-I-CA (January 2015), and the CSB Interim Report (April 2013), www.csb.gov. Figures converted to metric.</p>\n"};

<script>/* RCA session model: Ishikawa (cause-and-effect) diagram feeding 5 Why chains.
   Pure functions on a plain session object; no DOM. Ishikawa terms: effect, cause categories, causes, sub-causes.
   5 Why terms: why, answer, root cause. No terms from other methods (ICAM, TapRooT, Tripod, 3CA). */
(function (root) {
  'use strict';
  const FORMAT = 'rca-session';
  const SOURCE = 'Cause-and-effect (fishbone) diagram after K. Ishikawa; 5 Why after the Toyota Production System (T. Ohno). Category sets are common practice and vary between sources.';

  // Category sets. "People" replaces Man/Manpower (owner decision D3). shortcut: lists not yet checked against a source; verify before stage 4 publish.
  const SETS = {
    '6M': { name: '6M (production, plant, maintenance)', cats: ['People', 'Machine', 'Method', 'Material', 'Measurement', 'Environment'] },
    '4M': { name: '4M (short sessions)', cats: ['People', 'Machine', 'Method', 'Material'] },
    '8P': { name: '8P (service work)', cats: ['Product', 'Price', 'Place', 'Promotion', 'People', 'Process', 'Physical evidence', 'Productivity and quality'] },
    '4S': { name: '4S (service work)', cats: ['Surroundings', 'Suppliers', 'Systems', 'Skills'] },
    custom: { name: 'Custom (name your own)', cats: ['Category 1', 'Category 2', 'Category 3', 'Category 4'] }
  };
  // Prompt questions the facilitator can read out per category (own words)
  const PROMPTS = {
    People: ['Did the people doing the job know how to do it?', 'Were they fit, rested and enough of them?', 'Was the job handed over or communicated clearly?'],
    Machine: ['Did the equipment work as designed?', 'When was it last inspected, tested or maintained?', 'Was it the right equipment for the job?'],
    Method: ['Was there a procedure or standard? Was it right for this job?', 'Was the work done the way it is written?', 'Did anything change recently?'],
    Material: ['Was the material, part or chemical to specification?', 'Was it stored and handled correctly?', 'Did the supplier or batch change?'],
    Measurement: ['Were readings, gauges or tests accurate and calibrated?', 'Was the right thing measured, often enough?', 'Did anyone act on the readings?'],
    Environment: ['Did weather, heat, dust, noise or light play a part?', 'Was the area clean, clear and safe to work in?', 'Did time pressure or workload play a part?']
  };
  const STATUS = { raised: 'Raised', likely: 'Likely', confirmed: 'Confirmed by evidence', ruled: 'Ruled out' };
  const RULES = ['Look at the problem, not at blaming people.', 'One person talks at a time.', 'Every idea goes on the diagram first. We test ideas later.',
    'Say how you know: facts beat opinions.', 'Off-topic points go to the parking lot.'].join('\n');
  // Words that put a cause or blame in a problem statement
  const CAUSE_WORDS = /\b(because|due to|caused by|as a result of|failed to|didn'?t follow|did not follow|human error|careless(ness)?|negligen(t|ce)|lazy|fault of)\b/i;

  const uid = p => (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const has = s => !!String(s || '').trim();

  function blank(title) {
    return { format: FORMAT, version: 1, id: uid('s'), created: new Date().toISOString(),
      meta: { title: title || '', ref: '', date: '', location: '', facilitator: '', scribe: '', rules: RULES },
      people: [], problem: { what: '', where: '', when: '', extent: '', expected: '', statement: '', effect: '' },
      facts: [], set: '6M', cats: SETS['6M'].cats.map(n => ({ id: uid('k'), name: n })), causes: [], parking: [],
      whys: [], actions: [], enquiries: [], signoff: { name: '', role: '', date: '', note: '' } };
  }
  const person = (s, name, role) => { const p = { id: uid('p'), name: name || '', role: role || '' }; s.people.push(p); return p; };
  const fact = (s, text, source) => { const f = { id: uid('f'), text: text || '', source: source || '' }; s.facts.push(f); return f; };
  const park = (s, text) => { const x = { id: uid('l'), text: text || '' }; s.parking.push(x); return x; };
  const drop = (list, id) => list.filter(x => x.id !== id);

  /* ---------- Ishikawa ---------- */
  function addCat(s, name) { const k = { id: uid('k'), name: name || 'New category' }; s.cats.push(k); s.set = 'custom'; return k; }
  // Removing a category moves its causes to the first remaining one, so no idea is lost
  function dropCat(s, id) {
    if (s.cats.length < 2) return false;
    s.cats = drop(s.cats, id);
    s.causes.forEach(x => { if (x.cat === id) x.cat = s.cats[0].id; });
    return true;
  }
  // Switching sets renames the categories in order; causes on categories beyond the new list move to the last one
  function useSet(s, key) {
    const names = (SETS[key] || SETS['6M']).cats;
    const keep = s.cats.slice(0, names.length);
    const gone = new Set(s.cats.slice(names.length).map(k => k.id));
    names.forEach((n, i) => { if (keep[i]) keep[i].name = n; else keep.push({ id: uid('k'), name: n }); });
    s.cats = keep; s.set = SETS[key] ? key : '6M';
    const last = keep[keep.length - 1].id;
    s.causes.forEach(x => { if (gone.has(x.cat)) x.cat = last; });
  }
  function cause(s, cat, text, parent) {
    const p = parent && s.causes.find(x => x.id === parent);
    const x = { id: uid('c'), cat: p ? p.cat : cat, parent: p ? p.id : null, text: text || '', status: 'raised', check: '', evidence: '', drill: false, votes: 0 };
    s.causes.push(x); return x;
  }
  const byId = (s, id) => s.causes.find(x => x.id === id);
  const kids = (s, id) => s.causes.filter(x => x.parent === id);
  // Causes on one bone: top-level first, each followed by its sub-causes
  function onBone(s, cat) {
    const out = [];
    s.causes.filter(x => x.cat === cat && !x.parent).forEach(x => { out.push(x); kids(s, x.id).forEach(k => out.push(k)); });
    return out;
  }
  function dropCause(s, id) {
    const gone = new Set([id, ...kids(s, id).map(k => k.id)]); s.causes = s.causes.filter(x => !gone.has(x.id));
    (s.whys || []).filter(w => gone.has(w.cause) && !w.parent).forEach(w => dropWhy(s, w.id));
  }
  function moveCause(s, id, cat) { const x = byId(s, id); if (!x || x.parent) return; x.cat = cat; kids(s, id).forEach(k => { k.cat = cat; }); }
  const drilled = s => s.causes.filter(x => x.drill);
  const catName = (s, id) => (s.cats.find(k => k.id === id) || {}).name || '?';
  const effect = s => s.problem.effect || s.problem.statement || 'Effect (problem) not stated yet';
  // Statement built from the problem fields, for the scribe to edit
  function compose(p) {
    const parts = [p.what, p.where && 'at ' + p.where, p.when && 'on ' + p.when, p.extent && '(' + p.extent + ')'].filter(has).join(' ');
    return parts + (has(p.expected) ? '. Expected: ' + p.expected : '') + (parts ? '.' : '');
  }
  // Dot-voting: each dot is one vote from the room; never below zero
  function vote(s, id, d) { const x = byId(s, id); if (x) x.votes = Math.max(0, (x.votes || 0) + d); return x ? x.votes : 0; }
  const votesTotal = s => s.causes.reduce((n, x) => n + (x.votes || 0), 0);
  // Causes still waiting for evidence: the follow-up list from Step 4
  const toCheck = s => s.causes.filter(x => (x.status === 'raised' || x.status === 'likely') && has(x.check));

  /* ---------- 5 Why ----------
     One chain per selected cause. Each link answers "why?" for the link above it (or for the cause itself).
     A link can have more than one answer: the chain branches. The last link of a branch is marked as a root cause. */
  // Answers that stop at a person, not at the reason behind it: ask why again

    '.rep .ev{color:#333;font-size:8.5pt}.rep .rc{font-weight:bold}.rep .st-ruled{text-decoration:line-through;color:#555}.rep .muted{color:#555}';

  function html(M, s, diagram) {
    const m = s.meta, p = s.problem;
    const row = (k, v) => `<tr><th>${k}</th><td>${br(v)}</td></tr>`;
    const people = s.people.filter(x => has(x.name) || has(x.role));
    const causes = s.cats.map(k => M.onBone(s, k.id).filter(x => has(x.text)).map(x =>
      `<tr><td>${esc(k.name)}</td><td class="${x.status === 'ruled' ? 'st-ruled' : ''}">${x.parent ? '↳ ' : ''}${esc(x.text)}</td><td>${esc(M.STATUS[x.status])}${x.votes ? '<br>' + x.votes + ' vote(s)' : ''}${x.drill ? '<br><b>5 Why</b>' : ''}</td><td>${br(x.evidence || (has(x.check) ? 'To check: ' + x.check : ''))}</td></tr>`).join('')).join('');
    const chain = (w, n) => `<li><span class="muted">Why ${n}?</span> <span class="${w.root ? 'rc' : ''}">${esc(w.text || '(no answer)')}${w.root ? ' ◆ ROOT CAUSE' : ''}</span>` +
      (has(w.evidence) ? `<div class="ev">Evidence: ${esc(w.evidence)}</div>` : '') +
      (M.whyKids(s, w.id).length ? `<ul class="chain">${M.whyKids(s, w.id).map(k => chain(k, n + 1)).join('')}</ul>` : '') + '</li>';
    const chains = M.drilled(s).map(c => `<p><b>${esc(c.text)}</b> <span class="muted">(${esc(M.catName(s, c.cat))}, ${esc(M.STATUS[c.status])})</span></p>` +
      (M.firstWhys(s, c.id).length ? `<ul class="chain">${M.firstWhys(s, c.id).map(w => chain(w, 1)).join('')}</ul>` : '<p class="muted">No 5 Why chain yet.</p>')).join('');
    const R = M.roots(s);
    const acts = s.actions.map((a, i) => { const w = M.whyById(s, a.root);
      return `<tr><td>${i + 1}</td><td>${esc(w ? w.text : '(not linked)')}</td><td>${esc(a.text)}</td><td>${esc((M.ACTION_TYPES[a.type] || '').split(' (')[0])}</td><td>${esc(a.owner)}</td><td>${esc(a.due)}</td><td>${a.status === 'done' ? 'Done' : 'Open'}</td></tr>`; }).join('');
    const enq = s.enquiries.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.text)}</td><td>${esc(e.who)}</td><td>${esc(e.due)}</td><td>${e.status === 'closed' ? 'Closed' : 'Open'}</td><td>${br(e.answer)}</td></tr>`).join('');
    const so = s.signoff;
    return `<div class="rep"><h1>RCA session record: ${esc(m.title || 'Untitled session')}</h1>
      <table class="meta">${row('Reference', m.ref)}${row('Session date', m.date)}${row('Site and area', m.location)}${row('Facilitator', m.facilitator)}${row('Scribe', m.scribe)}
      ${row('Attendees', people.map(x => x.name + (x.role ? ' (' + x.role + ')' : '')).join('; '))}</table>
      <h2>1. Problem statement</h2><table class="meta">${row('Problem statement', p.statement)}${row('What', p.what)}${row('Where', p.where)}${row('When', p.when)}${row('How big or how often', p.extent)}${row('What should have happened', p.expected)}</table>
      ${s.facts.some(f => has(f.text)) ? `<table><thead><tr><th>Fact already known</th><th>Source</th></tr></thead><tbody>${s.facts.filter(f => has(f.text)).map(f => `<tr><td>${esc(f.text)}</td><td>${esc(f.source)}</td></tr>`).join('')}</tbody></table>` : ''}
      <h2>2. Ishikawa diagram</h2><div class="fbx">${diagram || ''}</div>
      <table><thead><tr><th>Category</th><th>Cause</th><th>Status</th><th>Evidence or reason</th></tr></thead><tbody>${causes || '<tr><td colspan="4">No causes recorded.</td></tr>'}</tbody></table>
      <h2>3. 5 Why</h2>${chains || '<p class="muted">No causes selected for 5 Why.</p>'}
      <h2>4. Root causes and actions</h2>${R.length ? '<ul>' + R.map(w => `<li><b>${esc(w.text)}</b><div class="ev">Check: ${esc(M.therefore(s, w.id))}</div></li>`).join('') + '</ul>' : '<p class="muted">No root cause marked.</p>'}
      <table><thead><tr><th>No</th><th>Root cause</th><th>Action</th><th>Type</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${acts || '<tr><td colspan="7">No actions.</td></tr>'}</tbody></table>
      <h2>5. Enquiries (to find out after the session)</h2><table><thead><tr><th>No</th><th>Question</th><th>Who</th><th>Due</th><th>Status</th><th>Answer</th></tr></thead><tbody>${enq || '<tr><td colspan="6">None.</td></tr>'}</tbody></table>
      ${s.parking.some(x => has(x.text)) ? `<h2>Parking lot</h2><ul>${s.parking.filter(x => has(x.text)).map(x => '<li>' + esc(x.text) + '</li>').join('')}</ul>` : ''}
      <h2>6. Sign-off</h2><table class="meta">${row('Name', so.name)}${row('Role', so.role)}${row('Date', so.date)}${row('Note', so.note)}</table>
      <p class="src">${esc(M.SOURCE)} Generated by the 5 Why and Ishikawa tool.</p></div>`;
  }
  const api = { html, CSS };
  if (typeof module === 'object' && module.exports) module.exports = api; else root.Report = api;
})(this);

/* Practice cases. 5W-EX-01: crude unit pipe rupture and fire, Chevron Richmond Refinery, 6 August 2012 (named openly, owner decision D5).
   Every fact is taken from the CSB report and cited: U.S. Chemical Safety and Hazard Investigation Board, Final Investigation Report,

(function (root) {
  'use strict';
  const SRC = 'CSB 2015', SRC13 = 'CSB 2013';
  const EXAMPLE = {
    ref: '5W-EX-01',
    meta: { title: 'Crude unit pipe rupture and fire', ref: '5W-EX-01', location: 'Chevron Richmond Refinery, #4 Crude Unit, California, USA (CSB public report)' },
    problem: {
      what: 'The 8-inch 4-sidecut line (light gas oil) ruptured; the release formed a vapour cloud that ignited',

      when: '6 August 2012, leak found about 15:50, ignition about 18:30',
      extent: '19 employees engulfed in the vapour cloud, 6 minor injuries; about 15 000 people from the community sought medical treatment',
      expected: 'The line stays intact until it is inspected or replaced; a leak is made safe without exposing people',
      effect: '4-sidecut line ruptured and burned'
    },
    facts: [
      ['About 15:50 an outside operator found drips of diesel-like liquid from an insulated pipe about 4 m above ground: the 4-sidecut line. It could not be isolated from the process.', SRC + ', section 3.1'],
      ['The leak was about 40 drips per minute. The supervisor and shift team leader judged it not significant enough to require a shutdown, but serious, and called the refinery fire department.', SRC + ', section 3.1'],
      ['Firefighters arrived about 16:07, set up incident command and taped off a hot zone of about 6 m by 6 m around the leak.', SRC + ', section 3.1'],
      ['About 40 people gathered at the leak over the next hours. A leak repair contractor was called to assess clamping the line.', SRC + ', section 3.2'],
      ['Inspectors told the group the 4-sidecut walls were thinning from sulfidation corrosion, but data from two months before showed enough wall thickness to last to the 2016 turnaround. The group thought a local cause, such as wear at a pipe support, was likely.', SRC + ', section 3.2'],
      ['The group decided to remove the insulation to find the leak ("daylighting"). A scaffold was built and two firefighters removed sheathing; soaked insulation caught fire and was put out. Hose streams then knocked off insulation and the leak worsened to a spray.', SRC + ', section 3.2'],
      ['Some firefighters believed the line ran at about 54 °C. The actual temperature was close to 340 °C, near the autoignition temperature of the light gas oil.', SRC + ', finding 19 and section 2.4'],
      ['Some people were uneasy and some suggested a shutdown, but left the decision to the managers present. No one used Stop Work Authority. Chevron had no leak response protocol.', SRC + ', findings 20 and 21'],
      ['Managers then decided to shut the unit down. A vapour cloud engulfed 19 people in the hot and cold zones; it ignited about two minutes later. 18 escaped just before ignition; a firefighter in the fire engine made his way out through the flames in full protective gear.', SRC + ', sections 1.1 and 3.3'],
      ['The ruptured part was a 1.3 m (52-inch) component of the 8-inch line, ASTM A53B carbon steel installed in 1976, original wall about 8.2 mm. Near the rupture it had lost on average 90 % of its wall.', SRC13 + ', paragraphs 4 and 5; ' + SRC + ', finding 5'],
      ['The ruptured component contained 0.01 % silicon. Six of 12 samples from the line had less than 0.10 %. Low-silicon carbon steel can corrode up to 16 times faster by sulfidation. A53B has no minimum silicon content.', SRC + ', findings 3 to 5'],
      ['Thickness readings on the line were taken at monitoring points on higher-silicon fittings. In 2011, 12 points were added, but none on the component that failed.', SRC + ', finding 10 and footnote 25'],
      ['In 2011 much of the 12-inch part of the same 4-sidecut line was replaced because it was too thin. The 8-inch part was judged fit to run.', SRC + ', finding 16'],
      ['A 2009 internal Chevron report recommended inspecting every component of high-temperature carbon steel piping like this line (100 % component inspection). It was not done on the 4-sidecut before 2012.', SRC + ', finding 9'],
      ['Requests to replace the 8-inch line in the 2007 and 2011 turnarounds were turned down under the turnaround scope criteria (the "Framing Document").', SRC + ', finding 10']
    ]
  };
  EXAMPLE.label = 'Chevron Richmond refinery fire, 2012, from the public CSB report.';
  EXAMPLE.tip = 'Practice case 5W-EX-01: a crude unit pipe rupture and fire at the Chevron Richmond Refinery (2012). The problem and the facts from the CSB report are filled in; you find the causes.';

  /* Practice case 5W-EX-02: contractor worker drowned at an overflowing return-water dam (fictional mine).

     methods can be compared on one case. The facilitator answer is built by facilitator/make_dam_answer.js (private). */
  const CS = 'Case summary', TL = 'Timeline';
  const DAM = {
    ref: '5W-EX-02',
    label: 'Worker drowned at an overflowing dam (fictional mine), the course training case.',
    tip: 'Practice case 5W-EX-02: a contractor worker drowned at an overflowing return-water dam. A fictional case, the same event as the Casebook, Tripod and 3CA training cases.',
    meta: { title: 'Contractor worker drowned at an overflowing return-water dam', ref: '5W-EX-02', location: 'Ridgeview Vanadium Mine (fictional), north return-water dam and pump installation' },
    problem: {
      what: 'A contractor worker drowned during an attempt to recover flooded pumps by boat',
      where: 'North return-water dam and pump installation, Ridgeview Vanadium Mine (fictional)',
      when: '14 February 2026, about 15:20 to 15:40',
      extent: '1 fatality (Worker A); Worker B reached the bank',
      expected: 'No one is put at risk on the water to save equipment; work on water is planned, with life jackets and rescue at hand',
      effect: 'Contractor worker drowned at the dam'
    },
    facts: [
      ['On 13 and 14 February heavy rain fell in the upper catchment of the north return-water dam.', TL],
      ['About 14:30 the inflow raised the dam level quickly and the dam overflowed at the spillway. The pump installation at the dam was flooded.', TL],
      ['About 14:50 the control room operator saw the pump installation flooding and called the engineering manager. The control room noticed only when the pumps were flooding.', TL + ' and ' + CS],
      ['The engineering manager asked the owner of a civils contractor on site to help recover the pumps.', CS],
      ['The owner brought three workers with no experience of work on water.', CS],
      ['About 15:20 two of the workers went out on the dam in an old boat that had stood unused behind the pump station for years. The third worker held a line from the bank.', TL + ' and ' + CS],
      ['About 15:30 the current and wind carried the boat towards the spillway, and the line was pulled from the shore attendant\'s hands.', TL],
      ['About 15:35, afraid of going over the wall, both workers left the boat to swim to the bank.', TL + ' and ' + CS],
      ['Worker B reached the bank. Worker A, who could not swim, went under and drowned (about 15:40).', TL + ' and ' + CS],
      ['There was no risk assessment or job plan for the work.', CS],
      ['There were no life jackets and no rescue equipment at the dam.', CS],
      ['The workers had no training for work on water.', CS],
      ['About 17:30 police divers recovered the body of Worker A.', TL]

  };
  const CASES = [EXAMPLE, DAM];
  function starter(M, ref) {
    const X = CASES.find(c => c.ref === ref) || EXAMPLE;
    const s = M.blank(X.meta.title);
    Object.assign(s.meta, X.meta, { date: '', facilitator: '', scribe: '' });
    Object.assign(s.problem, X.problem);
    X.facts.forEach(([t, src]) => M.fact(s, t, src));

  }
  const SOURCE = 'Facts from the U.S. Chemical Safety Board (CSB) Final Investigation Report, Chevron Richmond Refinery Pipe Rupture and Fire, Report No. 2012-03-I-CA (January 2015), and the CSB Interim Report (April 2013). Figures converted to metric.';
