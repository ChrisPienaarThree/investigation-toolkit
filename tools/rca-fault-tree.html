<!doctype html>
<html lang="en">
<head>

<title>RCA Fault Tree</title>
<style>
/* Layout: investigation workbench. Brand bar with File menu, tabs, tree canvas with an inspector rail.
   Status colours (confirmed green, likely amber, unverified grey, ruled out red) are fixed method colours. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #142132; --muted: #5a6779; --line: #d3dae2;
  --accent: #1d4ea3; --accent-ink: #ffffff; --accent-soft: #e3ebf8;

  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;
  --canvas: #111922; --grid: #222e3c; --brand: #0a1d36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;

.guide { max-width: 860px; } .guide h2 { margin-top: 18px; } .guide p, .guide li { line-height: 1.6; } .guide ul { padding-left: 20px; }

<body>
<div id="app"><div class="page"><p class="muted">Loading RCA Fault Tree…</p></div></div>
<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
    async del(k) { try { const d = await db(); await new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} },
    async keys(prefix) { try { const d = await db(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res((q.result || []).filter(k => typeof k === 'string' && (!prefix || k.startsWith(prefix)))); q.onerror = () => res([]); }); } catch (e) { return []; } }
  };

  /* ---------- files ---------- */
  function download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function pickWithInput(accept) {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.style.display = 'none';
      i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); };
      document.body.appendChild(i); i.click();
    });
  }
  async function permission(handle, ask) {
    if (!handle || !handle.queryPermission) return 'denied';
    try {
      let s = await handle.queryPermission({ mode: 'readwrite' });
      if (s !== 'granted' && ask) s = await handle.requestPermission({ mode: 'readwrite' });
      return s;
    } catch (e) { return 'denied'; }
  }
  /* opts: {tool, ext, label, mime} e.g. {tool:'tripod', ext:'.tripod.json', label:'Tripod Beta case'} */
  function FileLink(opts) {
    const types = [{ description: opts.label, accept: { [opts.mime || 'application/json']: [opts.ext.slice(opts.ext.lastIndexOf('.'))] } }];
    const key = id => 'handle:' + opts.tool + ':' + id;
    return {
      supported: hasFSA,
      /* Ask where to save; returns {handle, name} or null when cancelled. */
      async saveAs(id, suggested, text) {
        if (!hasFSA) { download(suggested, text, opts.mime || 'application/json'); return { handle: null, name: suggested, downloaded: true }; }
        let h;
        try { h = await window.showSaveFilePicker({ suggestedName: suggested, types, id: 'iikit-cases' }); }
        catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
        await this.write(h, text);
        await KitStore.set(key(id), h);
        return { handle: h, name: h.name };
      },
      async write(h, text) { const w = await h.createWritable(); await w.write(text); await w.close(); },
      /* Open a file; returns {handle|null, name, text} or null. */
      async open() {
        if (hasFSA) {
          let hs;
          try { hs = await window.showOpenFilePicker({ types, multiple: false, id: 'iikit-cases' }); }
          catch (e) { if (e && e.name === 'AbortError') return null; throw e; }
          const f = await hs[0].getFile();
          return { handle: hs[0], name: f.name, text: await f.text(), modified: f.lastModified };
        }
        const f = await pickWithInput(opts.ext + ',.json,application/json');
        return f ? { handle: null, name: f.name, text: await f.text(), modified: f.lastModified } : null;
      },
      async link(id, h) { if (h) await KitStore.set(key(id), h); },
      async unlink(id) { await KitStore.del(key(id)); },
      async handleFor(id) { return await KitStore.get(key(id)); },
      permission,
      download: (name, text) => download(name, text, opts.mime || 'application/json')
    };
  }

  /* ---------- registry of investigations on this computer ---------- */
  const RK = 'iikit.registry';
  const KitRegistry = {
    list() { try { return JSON.parse(localStorage.getItem(RK) || '[]'); } catch (e) { return []; } },
    upsert(entry) {
      try {
        const L = this.list().filter(x => !(x.tool === entry.tool && x.id === entry.id));
        L.push(Object.assign({ seenAt: new Date().toISOString() }, entry));
        localStorage.setItem(RK, JSON.stringify(L.slice(-500)));
      } catch (e) {}
    },
    remove(tool, id) { try { localStorage.setItem(RK, JSON.stringify(this.list().filter(x => !(x.tool === tool && x.id === id)))); } catch (e) {} }
  };
  /* action summary helper: items [{status, due}] with open statuses */
  function actionStats(items, isOpen, dueOf) {
    const today = new Date().toISOString().slice(0, 10);
    let open = 0, overdue = 0; const dues = [];
    (items || []).forEach(a => { if (isOpen(a)) { open++; const d = dueOf(a); if (d) dues.push(String(d).slice(0, 10)); if (d && d < today) overdue++; } });
    return { total: (items || []).length, open, overdue, dues };
  }

  /* ---------- dashboard -> tool hand-off ---------- */
  const KitHandoff = {
    async put(tool, handle, name) { return KitStore.set('handoff:' + tool, { handle, name, at: Date.now() }); },
    async take(tool) { const v = await KitStore.get('handoff:' + tool); await KitStore.del('handoff:' + tool); return v && Date.now() - v.at < 10 * 60000 ? v : null; }
  };

  return { VERSION, hasFSA, hasDirPicker, KitStore, FileLink, KitRegistry, KitHandoff, actionStats, download, pickWithInput, permission };
})();
if (typeof module !== 'undefined') module.exports = KIT;

/* KitTips: hover tips with a 0.4 s delay for every element that has a title (or data-tip).
   The title moves to data-tip on first hover, so the browser's own slow tip does not also appear;
   icon-only controls keep an aria-label. On touch screens a long press (0.5 s) shows the tip. */
(function () {
  'use strict';
  const DELAY = 400, PRESS = 500;
  let tip = null, timer = 0, cur = null;
  function box() {
    if (tip) return tip;
    const s = document.createElement('style');
    s.textContent = '.kit-tip{position:fixed;z-index:2147483000;max-width:320px;padding:6px 9px;border-radius:6px;background:#1f252c;color:#fff;font:12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .12s}.kit-tip.on{opacity:1}@media print{.kit-tip{display:none}}';
    document.head.appendChild(s);
    tip = document.createElement('div'); tip.className = 'kit-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
    return tip;
  }
  function target(el) {
    const t = el && el.closest && el.closest('[title],[data-tip]');
    if (!t || t.closest('svg') && t.tagName.toLowerCase() === 'title') return null;
    if (t.hasAttribute('title')) {
      const v = t.getAttribute('title');
      if (v) { t.setAttribute('data-tip', v); if (!t.getAttribute('aria-label') && !t.textContent.trim()) t.setAttribute('aria-label', v); }
      t.removeAttribute('title');
    }
    return t.getAttribute('data-tip') ? t : null;
  }
  function show(t) {
    const b = box(); b.textContent = t.getAttribute('data-tip');
    const r = t.getBoundingClientRect(); b.style.left = '0px'; b.style.top = '0px'; b.classList.add('on');
    const w = b.offsetWidth, h = b.offsetHeight, vw = innerWidth;
    let y = r.bottom + 6; if (y + h > innerHeight - 4) y = Math.max(4, r.top - h - 6);
    b.style.left = Math.max(4, Math.min(vw - w - 4, r.left + r.width / 2 - w / 2)) + 'px'; b.style.top = y + 'px';
  }
  function hide() { clearTimeout(timer); cur = null; if (tip) tip.classList.remove('on'); }
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const t = target(e.target); if (t === cur) return;
    hide(); if (!t) return; cur = t; timer = setTimeout(() => { if (cur === t && t.isConnected) show(t); }, DELAY);
  }, true);
  document.addEventListener('pointerout', e => { if (cur && !cur.contains(e.relatedTarget)) hide(); }, true);
  document.addEventListener('pointerdown', e => {
    hide();
    if (e.pointerType !== 'touch') return;
    const t = target(e.target); if (!t) return;
    cur = t; timer = setTimeout(() => { if (cur === t) { show(t); setTimeout(hide, 2500); } }, PRESS);
  }, true);
  ['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, e => { if (e.pointerType === 'touch' && !(tip && tip.classList.contains('on'))) hide(); }, true));
  addEventListener('scroll', hide, true); addEventListener('keydown', hide, true);
  window.KitTips = { DELAY };
})();

/* KitAI: "bring your own AI key" for the offline toolkit and the public site.
   KitAI.sample(prompt, {signal}) -> Promise<{text}>, the same shape as the claude.ai `sample` capability,
   so the apps call it the same way. Every request is shown to the user first (edit, replace names, cancel).
   The key lives only in this browser: sessionStorage by default, localStorage when "Remember on this device"
   is ticked. It is never put into case files, workspace files, exports or reports.
   Errors carry .code (cancelled, no_key, auth_failed, rate_limited, refused, prompt_too_large, network, bad_answer)
   and .userMessage (plain words for the app to show). */
(function () {
  'use strict';
  const STORE = 'iikit.ai';
  const PROVIDERS = {
    anthropic: { name: 'Anthropic Claude', model: 'claude-opus-5-5', keyHint: 'Starts with sk-ant-. Create one at console.anthropic.com > API keys.' },
    openai: { name: 'OpenAI', model: 'gpt-5', keyHint: 'Starts with sk-. Create one at platform.openai.com > API keys.' },
    gemini: { name: 'Google Gemini', model: 'gemini-2.5-flash', keyHint: 'Create one at aistudio.google.com > Get API key.' }
  };
  const err = (code, userMessage) => Object.assign(new Error(userMessage), { code, userMessage });

  function read() {
    for (const s of ['localStorage', 'sessionStorage']) {
      try { const v = JSON.parse(window[s].getItem(STORE) || 'null'); if (v && v.key && PROVIDERS[v.provider]) return Object.assign(v, { remember: s === 'localStorage' }); } catch (e) {}
    }
    return null;
  }
  function write(cfg) {
    forget();
    try { window[cfg.remember ? 'localStorage' : 'sessionStorage'].setItem(STORE, JSON.stringify({ provider: cfg.provider, model: cfg.model, key: cfg.key })); } catch (e) {}
  }
  function forget() { for (const s of ['localStorage', 'sessionStorage']) { try { window[s].removeItem(STORE); } catch (e) {} } }

  /* ---------- provider calls ---------- */
  async function call(cfg, prompt, signal) {
    const p = cfg.provider, model = cfg.model || PROVIDERS[p].model;
    let url, init;
    if (p === 'anthropic') {
      url = 'https://api.anthropic.com/v1/messages';
      init = { headers: { 'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true', 'anthropic-beta': 'server-side-fallback-2026-07-01' },
        body: { model, max_tokens: 16000, output_config: { effort: 'medium' }, fallbacks: 'default', messages: [{ role: 'user', content: prompt }] } };
    } else if (p === 'openai') {
      url = 'https://api.openai.com/v1/chat/completions';
      init = { headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key }, body: { model, messages: [{ role: 'user', content: prompt }] } };
    } else {
      url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
      init = { headers: { 'content-type': 'application/json', 'x-goog-api-key': cfg.key }, body: { contents: [{ role: 'user', parts: [{ text: prompt }] }] } };
    }
    let r;
    try { r = await fetch(url, { method: 'POST', headers: init.headers, body: JSON.stringify(init.body), signal }); }
    catch (e) {
      if (e && e.name === 'AbortError') throw err('cancelled', 'Stopped. Nothing was changed.');
      throw err('network', p === 'openai'
        ? 'Could not connect to OpenAI. Check the internet connection. OpenAI also gives this error when the key is wrong, so check the key in AI settings.'
        : 'Could not connect to ' + PROVIDERS[p].name + '. Check the internet connection, or whether your network blocks AI services.');
    }
    let j = null; try { j = await r.json(); } catch (e) {}
    // accounts without the server-side fallback beta: retry once without it
    if (p === 'anthropic' && r.status === 400 && init.body.fallbacks && /fallback|beta/i.test(JSON.stringify(j || ''))) {
      const b = Object.assign({}, init.body); delete b.fallbacks; const h = Object.assign({}, init.headers); delete h['anthropic-beta'];
      try { r = await fetch(url, { method: 'POST', headers: h, body: JSON.stringify(b), signal }); j = null; try { j = await r.json(); } catch (e) {} }
      catch (e) { if (e && e.name === 'AbortError') throw err('cancelled', 'Stopped. Nothing was changed.'); throw err('network', 'Could not connect to Anthropic Claude. Check the internet connection.'); }
    }
    if (!r.ok) {
      const msg = (j && (j.error && (j.error.message || j.error.status) || j.message)) || '';
      if (r.status === 401 || r.status === 403 || /api key|api_key|permission/i.test(msg)) throw err('auth_failed', PROVIDERS[p].name + ' did not accept the key. Open AI settings and check the key. (' + r.status + ')');
      if (r.status === 429) throw err('rate_limited', PROVIDERS[p].name + ' is busy or your usage limit is reached. Try again later.');
      if (r.status === 413 || /too long|too large|context length|maximum context|token/i.test(msg)) throw err('prompt_too_large', 'The request is too long for this model. Shorten the text and try again.');
      if (r.status === 404 || /model/i.test(msg)) throw err('bad_model', 'The model "' + model + '" was not found. Open AI settings and check the model name.');
      throw err('provider_error', PROVIDERS[p].name + ' returned an error (' + r.status + '). ' + msg.slice(0, 200));
    }
    let text = '';
    if (p === 'anthropic') {
      if (j.stop_reason === 'refusal') throw err('refused', 'The AI declined this request. Rephrase it and try again.');
      text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    } else if (p === 'openai') {
      const c = j.choices && j.choices[0];
      if (c && c.message && c.message.refusal) throw err('refused', 'The AI declined this request. Rephrase it and try again.');
      text = (c && c.message && c.message.content) || '';
    } else {
      const c = j.candidates && j.candidates[0];
      if (!c && j.promptFeedback && j.promptFeedback.blockReason) throw err('refused', 'The AI declined this request (' + j.promptFeedback.blockReason + '). Rephrase it and try again.');
      text = ((c && c.content && c.content.parts) || []).map(x => x.text || '').join('');
    }
    if (!text.trim()) throw err('empty_completion', 'The AI returned nothing. Try again.');
    return text;
  }

  /* ---------- dialogs ---------- */
  const CSS = `.kai-dlg{border:1px solid #c9ccd1;border-radius:10px;padding:0;max-width:min(680px,calc(100vw - 32px));width:100%;color:#1d2228;background:#fff;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.kai-dlg::backdrop{background:rgba(20,24,30,.45)}.kai-in{padding:18px 20px}.kai-dlg h3{margin:0 0 6px;font-size:17px}.kai-dlg p{margin:0 0 10px}
.kai-dlg label{display:block;font-weight:600;margin:10px 0 4px}.kai-dlg input[type=text],.kai-dlg input[type=password],.kai-dlg select,.kai-dlg textarea{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #b9bec5;border-radius:6px;font:inherit;background:#fff;color:inherit}
.kai-dlg textarea{min-height:220px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}.kai-hint{font-size:12px;color:#5b636d;margin:3px 0 0}.kai-warn{background:#fff5e0;border:1px solid #e8c77a;border-radius:6px;padding:8px 10px;font-size:13px;margin:10px 0}
.kai-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.kai-row .sp{flex:1}.kai-btn{border:1px solid #b9bec5;background:#f4f5f7;border-radius:6px;padding:7px 13px;font:inherit;cursor:pointer;color:inherit}
.kai-btn.pri{background:#1f5f8b;border-color:#1f5f8b;color:#fff}.kai-btn:disabled{opacity:.5;cursor:default}.kai-chk{display:flex!important;gap:7px;align-items:flex-start;font-weight:400!important}.kai-msg{font-size:13px;margin-top:8px;min-height:1em}
.kai-msg.bad{color:#a32a1c}.kai-msg.ok{color:#1d6b38}`;
  function dialog(html) {
    if (!document.getElementById('kai-css')) { const s = document.createElement('style'); s.id = 'kai-css'; s.textContent = CSS; document.head.appendChild(s); }
    const d = document.createElement('dialog'); d.className = 'kai-dlg'; d.innerHTML = '<div class="kai-in">' + html + '</div>';
    document.body.appendChild(d); d.addEventListener('close', () => d.remove()); d.showModal(); return d;
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PRIVACY = 'What you send goes to the AI company you choose, not to Istec. Check your company rules first: some clients do not allow incident details to leave the company. Replace people\'s names with roles before you send.';

  /* Settings. Resolves true when a key is saved, false when closed. */
  function settings(reason) {
    return new Promise(resolve => {
      const cur = read() || { provider: 'anthropic', model: '', key: '', remember: false };
      const d = dialog(`<h3>AI settings</h3>${reason ? `<p>${esc(reason)}</p>` : ''}
        <p>Use your own AI account to draft plans and suggestions in these tools. Everything the AI writes is a draft: you check it before it is added to the case.</p>
        <div class="kai-warn">${esc(PRIVACY)}</div>
        <label for="kai-p">AI provider</label><select id="kai-p">${Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}"${k === cur.provider ? ' selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
        <label for="kai-m">Model</label><input id="kai-m" type="text" autocomplete="off" spellcheck="false"><p class="kai-hint" id="kai-mh"></p>
        <label for="kai-k">API key</label><input id="kai-k" type="password" autocomplete="off" spellcheck="false" value="${esc(cur.key)}"><p class="kai-hint" id="kai-kh"></p>
        <label class="kai-chk"><input id="kai-r" type="checkbox"${cur.remember ? ' checked' : ''}> <span>Remember on this device. Leave this off on shared or training-room computers: the key is then forgotten when you close the tab.</span></label>
        <div class="kai-msg" id="kai-msg"></div>
        <div class="kai-row"><button class="kai-btn" id="kai-t" type="button">Test connection</button><button class="kai-btn" id="kai-f" type="button">Forget key</button><span class="sp"></span><button class="kai-btn" id="kai-c" type="button">Close</button><button class="kai-btn pri" id="kai-s" type="button">Save</button></div>`);
      const $ = id => d.querySelector('#' + id), msg = (t, cls) => { const m = $('kai-msg'); m.textContent = t; m.className = 'kai-msg ' + (cls || ''); };
      const sync = () => { const v = PROVIDERS[$('kai-p').value]; $('kai-m').placeholder = v.model; $('kai-mh').textContent = 'Leave blank to use ' + v.model + ', or type another model name from your provider.'; $('kai-kh').textContent = v.keyHint; };
      $('kai-m').value = cur.model || ''; sync(); $('kai-p').onchange = sync;
      const form = () => ({ provider: $('kai-p').value, model: $('kai-m').value.trim(), key: $('kai-k').value.trim(), remember: $('kai-r').checked });
      let saved = false;
      $('kai-t').onclick = async () => {
        const f = form(); if (!f.key) { msg('Enter the API key first.', 'bad'); return; }
        $('kai-t').disabled = true; msg('Testing…');
        try { await call(f, 'Reply with the single word OK.'); msg('Connected. ' + PROVIDERS[f.provider].name + ' answered.', 'ok'); }
        catch (e) { msg(e.userMessage || e.message, 'bad'); }
        $('kai-t').disabled = false;
      };
      $('kai-f').onclick = () => { forget(); $('kai-k').value = ''; msg('The key has been removed from this browser.', 'ok'); };
      $('kai-s').onclick = () => { const f = form(); if (!f.key) { msg('Enter the API key, or press Close.', 'bad'); return; } write(f); saved = true; d.close(); };
      $('kai-c').onclick = () => d.close();
      d.addEventListener('close', () => resolve(saved));
    });
  }

  /* Preview of exactly what will be sent. Resolves the (possibly edited) text, or null when cancelled. */
  function preview(prompt, cfg) {
    return new Promise(resolve => {
      const d = dialog(`<h3>Check what will be sent</h3>
        <p>This text goes to <b>${esc(PROVIDERS[cfg.provider].name)}</b> (${esc(cfg.model || PROVIDERS[cfg.provider].model)}). You can edit it here.</p>
        <div class="kai-warn">${esc(PRIVACY)}</div>
        <label for="kai-names">Names to replace with roles (separate with commas)</label>
        <div class="kai-row" style="margin-top:0"><input id="kai-names" type="text" placeholder="e.g. John Mokoena, Sara Ali" style="flex:1"><button class="kai-btn" id="kai-rep" type="button">Replace</button></div>
        <p class="kai-hint">Each name becomes Person A, Person B and so on. Only this request changes, not the case.</p>
        <label for="kai-txt">Text to send</label><textarea id="kai-txt"></textarea>
        <div class="kai-msg" id="kai-msg"></div>
        <div class="kai-row"><button class="kai-btn" id="kai-set" type="button">AI settings</button><span class="sp"></span><button class="kai-btn" id="kai-c" type="button">Cancel</button><button class="kai-btn pri" id="kai-go" type="button">Send</button></div>`);
      const $ = id => d.querySelector('#' + id), ta = $('kai-txt'); ta.value = prompt;
      let out = null;
      $('kai-rep').onclick = () => {
        const names = $('kai-names').value.split(',').map(s => s.trim()).filter(s => s.length > 1);
        let n = 0; names.forEach((nm, i) => { const re = new RegExp(nm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); ta.value = ta.value.replace(re, () => { n++; return 'Person ' + String.fromCharCode(65 + (i % 26)); }); });
        const m = $('kai-msg'); m.className = 'kai-msg ok'; m.textContent = names.length ? n + ' replacement(s) made.' : '';
      };
      $('kai-set').onclick = () => { out = '__settings'; d.close(); };
      $('kai-c').onclick = () => d.close();
      $('kai-go').onclick = () => { out = ta.value; d.close(); };
      d.addEventListener('close', () => resolve(out));
    });
  }

  async function sample(prompt, opts) {
    opts = opts || {};
    let cfg = read();
    for (;;) {
      if (!cfg) { if (!(await settings('Set up your AI account first. If you do not have one, close this and use Copy prompt instead.'))) throw err('cancelled', 'Stopped. Nothing was changed.'); cfg = read(); continue; }
      const text = await preview(String(prompt), cfg);
      if (text === '__settings') { await settings(); cfg = read(); continue; }
      if (text == null) throw err('cancelled', 'Stopped. Nothing was changed.');
      const out = await call(cfg, text, opts.signal);
      if (typeof opts.onText === 'function') try { opts.onText({ text: out }); } catch (e) {}
      return { text: out };
    }
  }

  window.KitAI = { sample, settings, hasKey: () => !!read(), providers: PROVIDERS, _call: call };
})();

/* KitManual: shows this tool's user manual (window.TOOL_MANUAL = {title, html}) in a full-screen panel.
   Any element with data-manual="<section id>" opens the manual at that section ("" = the start).
   The manual source and PDF are built by Source/_manuals/build_manuals.js. */
(function () {
  'use strict';
  const CSS = `#km{position:fixed;inset:0;z-index:2147482000;background:rgba(15,20,28,.5);display:flex;justify-content:center;padding:16px}
#km .km-box{background:#fff;color:#16202b;width:min(980px,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#km .km-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #d9dee5;background:#f4f6f9}
#km .km-head b{flex:1;font-size:16px}#km .km-head select{max-width:46%;padding:5px 6px;border:1px solid #b9c1cc;border-radius:6px;font:inherit;font-size:13px;background:#fff;color:inherit}
#km .km-x{border:1px solid #b9c1cc;background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;color:inherit}
#km .km-body{position:relative;overflow-y:auto;padding:18px 26px 40px}#km h1{font-size:24px;margin:0 0 8px}#km h2{font-size:19px;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid #0f2a4d;color:#0f2a4d}
#km h3{font-size:16px;margin:18px 0 6px}#km p,#km li{max-width:72ch}#km figure{margin:12px 0}#km img{max-width:100%;border:1px solid #d9dee5;border-radius:6px}#km figcaption{font-size:13px;color:#5a6472}
#km .tip,#km .warn,#km .ex{border-radius:7px;padding:9px 12px;margin:10px 0;max-width:76ch}#km .tip{background:#e7f2f7}#km .warn{background:#fff3dc}#km .ex{background:#eef5ec}
#km table{border-collapse:collapse;margin:8px 0;font-size:14px}#km td,#km th{border:1px solid #d9dee5;padding:5px 8px;text-align:left;vertical-align:top}#km th{background:#f4f6f9}
#km kbd,#km .ui{font-weight:600}#km .no-app{display:none}
@media (max-width:640px){#km{padding:0}#km .km-box{border-radius:0}#km .km-body{padding:14px 16px 40px}#km .km-head select{display:none}}`;
  // the same look for the overlay (#km) and for a manual shown inside a page (.km-inline, the RCA User guide tab)
  function css() { if (document.getElementById('km-css')) return; const s = document.createElement('style'); s.id = 'km-css';
    s.textContent = CSS + '\n' + CSS.replace(/#km /g, '.km-inline '); document.head.appendChild(s); }
  function open(id) {
    const M = window.TOOL_MANUAL; if (!M) return;
    close(); css();
    const el = document.createElement('div'); el.id = 'km'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', M.title);
    el.innerHTML = `<div class="km-box"><div class="km-head"><b>${M.title}</b><select aria-label="Go to section"><option value="">Contents</option></select><button class="km-x" type="button">Close</button></div><div class="km-body">${M.html}</div></div>`;
    document.body.appendChild(el);
    const body = el.querySelector('.km-body'), sel = el.querySelector('select');
    body.querySelectorAll('h2[id]').forEach(h => { const o = document.createElement('option'); o.value = h.id; o.textContent = h.textContent; sel.appendChild(o); });
    sel.onchange = () => { go(sel.value); sel.value = ''; };
    const go = t => { const h = t && body.querySelector('#' + CSS_ESC(t)); body.scrollTop = h ? h.offsetTop - 8 : 0; };
    el.querySelector('.km-x').onclick = close;
    el.addEventListener('mousedown', e => { if (e.target === el) close(); });
    body.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (a) { e.preventDefault(); go(a.getAttribute('href').slice(1)); } });
    requestAnimationFrame(() => go(id));
    el.querySelector('.km-x').focus();
  }
  const CSS_ESC = s => (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^\w-]/g, '\\$&');
  function close() { const el = document.getElementById('km'); if (el) el.remove(); }
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-manual]'); if (b) { e.preventDefault(); open(b.getAttribute('data-manual')); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('km')) close(); });
  window.KitManual = { open, close, css, has: () => !!window.TOOL_MANUAL };

window.TOOL_MANUAL = {"title":"RCA Fault Tree · User manual","html":"\n<h1 id=\"start\">RCA Fault Tree: user manual</h1>\n<p>Version 1.2 (18 Nov 2026). This manual explains how to build a root cause fault tree, test it against the evidence and report the result. The pictures use the worked example that opens with the tool: <b>RCA-EX-01, diesel overfill of tank T-101 during a night transfer</b> (a fictional case).</p>\n\n<h2 id=\"about\">1. What the tool is for</h2>\n<p>A root cause fault tree starts at the top with the incident that happened: the <b>top event</b>. Below it you set out every way it could have happened. Each box is a <b>hypothesis</b>: a possible cause. You then test each hypothesis against the evidence. You keep the branches that the evidence supports and rule out the rest. What is left explains the incident.</p>\n<p>Probabilities are optional. When you enter them, the tool ranks the hypotheses that are still open, so you know which to test first.</p>\n<div class=\"warn\">This is an investigation tool, not a design tool. It does not tell you whether a design is safe enough. For design studies (PFDavg, SIL, test intervals) use the Fault Tree and PFD Calculator in the Process Safety Analysis Toolkit.</div>\n\n<h2 id=\"quick-start\">2. Quick start</h2>\n<ol>\n  <li><span class=\"ui\">File ▾</span> › <span class=\"ui\">New fault tree</span>. Describe the incident on the <span class=\"ui\">Incident</span> tab.</li>\n  <li>On the <span class=\"ui\">Fault tree</span> tab, select the top event and add its causes: <span class=\"ui\">+ Gate</span> for a cause you will break down further, <span class=\"ui\">+ Basic event</span> for a cause you will not.</li>\n  <li>Choose the gate logic: <b>OR</b> if any one input is enough, <b>AND</b> if all inputs were needed together.</li>\n  <li>For each box, set the <b>hypothesis status</b> and record the evidence. Plan a test for those still open.</li>\n  <li>If you want, give events a probability from the data library or as your own value.</li>\n  <li>Classify the confirmed causes (root cause, causal factor, contributing factor), add actions and produce the report.</li>\n  <li><span class=\"ui\">File ▾</span> › <span class=\"ui\">Save as…</span> links a file in <span class=\"ui\">My cases</span> on the stick. After that, every change is written to it.</li>\n</ol>\n\n<h2 id=\"screen\" class=\"page\">3. The screen</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMACgoKCgoKEQoKERkREREZIRkZGRkhKiEhISEhKjMqKioqKiozMzMzMzMzMz09PT09PUdHR0dHUFBQUFBQUFBQUP/bAEMBDA0NFBMUIxMTI1M5LjlTU1NTU1NT l>\n  <li><b>Top bar:</b> the case name, the save status, <span class=\"ui\">AI settings</span> and the <span class=\"ui\">File ▾</span> menu.</li>\n  <li><b>Tabs:</b> Fault tree, Hypotheses &amp; evidence, Results, Data library, Actions, Incident, Report and User guide. A number on a tab shows open problems.</li>\n  <li><b>Top card:</b> how likely the top event was <b>before evidence</b> and <b>given evidence</b>. The three buttons choose which value the boxes show.</li>\n  <li><b>Canvas:</b> drag the background to move; scroll or use <span class=\"ui\">−</span> <span class=\"ui\">+</span> to zoom; <span class=\"ui\">Fit</span> shows the whole tree. Click a box to select it.</li>\n  <li><b>Inspector (right):</b> everything about the selected box: code, gate, description, status, evidence, test, cause class, probability, and its inputs.</li>\n</ul>\n\n<h2 id=\"symbols\">4. Symbols</h2>\n<table>\n  <tr><th>Symbol</th><th>Name</th><th>Meaning</th></tr>\n  <tr><td>Box</td><td>Event description</td><td>Every element has a box. The coloured stripe on the left is the hypothesis status.</td></tr>\n  <tr><td>Curved shield</td><td>OR gate</td><td>The output happens if any one input happens.</td></tr>\n  <tr><td>Flat-bottomed dome</td><td>AND gate</td><td>The output happens only if all inputs happen together.</td></tr>\n  <tr><td>Hexagon</td><td>INHIBIT gate</td><td>The output happens if the input happens while an enabling condition is present. Show the condition as a condition (house) event.</td></tr>\n  <tr><td>Shield with k/n</td><td>VOTE gate</td><td>The output happens if at least k of the n inputs happen.</td></tr>\n  <tr><td>Circle</td><td>Basic event</td><td>A cause you do not break down further.</td></tr>\n  <tr><td>Diamond</td><td>Undeveloped event</td><td>A cause not developed, for lack of information or because it is outside the scope.</td></tr>\n  <tr><td>House</td><td>Condition / house event</td><td>A condition that was or was not present, for example a single operator on shift. Usually 1 (present) or 0 (absent).</td></tr>\n  <tr><td>Triangle</td><td>Collapsed branch</td><td>Select the gate and click <span class=\"ui\">Expand branch</span>.</td></tr>\n</table>\n\n<h2 id=\"build\" class=\"page\">5. Building the tree</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAABl6ADAAQAAAABAAADNAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgDNAGXAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMACgoKCgoKEQoKERkREREZIRkZGRkhKiEhISEhKjMqKioqKiozMzMzMzMzMz09PT09PUdHR0dHUFBQUFBQUFBQUP/bAEMBDA0NFBMUIxMTI1M5LjlTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU//dAAQAGv/aAAwDAQACEQMRAD8A9diij8tSVBOB2qTyov7g/KiL/VJ9BUlAEflRf3B+VHlRf3B+VSUUAR+VF/ kbd>+<kbd>Z</kbd>).</li>\n</ol>\n<div class=\"ex\"><b>Worked example.</b> The top event in RCA-EX-01 is an <b>AND</b> gate: the overfill needed a transfer under way (E-01), the transfer not being stopped before the tank was full (G-02) <i>and</i> the independent overfill protection not stopping it (G-03). G-02 is broken down further, for example into \"operator unaware the tank was nearly full\" (G-04) and \"transfer larger than the free volume in the tank\" (E-03), which the evidence ruled out.</div>\n<div class=\"tip\">Each element appears once in the tree. If the same cause acts in two places, model it with a shared condition event.</div>\n\n<h2 id=\"hypotheses\">6. Testing hypotheses against the evidence</h2>\n<p>Every box is a hypothesis until the evidence decides it:</p>\n<table>\n  <tr><th>Status</th><th>Meaning</th></tr>\n  <tr><td>Confirmed</td><td>The evidence shows it happened.</td></tr>\n  <tr><td>Likely</td><td>The evidence points to it, but is not conclusive yet.</td></tr>\n  <tr><td>Unverified</td><td>Still to be tested.</td></tr>\n  <tr><td>Ruled out</td><td>The evidence shows it did not happen. The branch is drawn dashed and struck through, and drops out of the causal combinations.</td></tr>\n</table>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwA  LOPA, IEC 61511 SIL bands)</td></tr>\n  <tr><td>Human error probability</td><td>THERP and HEART generic task values</td></tr>\n  <tr><td>Equipment failure on demand</td><td>Pumps, valves, switches, transmitters, lifting gear and so on</td></tr>\n  <tr><td>Initiating event frequency</td><td>Typical frequencies per year (CCPS LOPA)</td></tr>\n  <tr><td>Manual value</td><td>Your own probability or frequency</td></tr>\n  <tr><td>Site data</td><td>Your own items, added on the Data library tab (for example from maintenance history)</td></tr>\n</table>\n<ol>\n  <li>Select an event, choose the <b>Source</b> and the <b>Library item</b>. The value fills in.</li>\n  <li>You can change the value for this event (for example, a switch whose proof test was 18 months overdue). The panel then shows the value as edited. Write why in the <b>Value note</b>. <span class=\"ui\">Use library value</span> puts it back.</li>\n  <li>On the Data library tab you can override an item for the whole case, and add site items with <span class=\"ui\">Add site item</span>.</li>\n</ol>\n<p><b>Units:</b> probability (0 to 1) or frequency (per year). An OR gate must combine inputs with the same unit. An AND gate may have at most one frequency input; the result is then a frequency.</p>\n<h3>How the numbers are calculated</h3>\n<ul>\n  <li>OR: 1 − Π(1 − p) for probabilities; the sum of the frequencies for frequencies.</li>\n  <li>AND / INHIBIT: the product of the probabilities, or one frequency × the probabilities.</li>\n  <li>VOTE k of n: the probability that at least k of the n inputs happen.</li>\n  <li><b>Before evidence:</b> every hypothesis at its library value. <b>Given evidence:</b> ruled-out causes count as 0 and confirmed causes as 1.</li>\n</ul>\n<div class=\"tip\">Library values are generic screening values: use them to rank hypotheses, not as design data. Replace them with site data where you have it.</div>\n\n<h2 id=\"causes\">9. Classifying causes and adding actions</h2>\n<ol>\n  <li>Select a confirmed box and choose its <b>Class</b>: root cause, causal factor or contributing factor. Answer <b>Why did it occur?</b> with the underlying reason.</li>\n  <li>On the <span class=\"ui\">Actions</span> tab, add at least one action for every root cause. The tab lists <b>Root causes without an action</b>.</li>\n  <li>Give each action an owner and a due date. Favour actions that change the system (design, engineering, procedures) over reminders.</li>\n</ol>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMACgoKCgoKEQoKERkREREZIRkZGRkhKiEhISEhKjMqKioqKiozMzMzMzMzMz0 WKrx/f8AwqxUsYUUUUAFFFFABRRRQBU1CB7mwuLaLG+WJ0XPTLAgZriv+EX1KKF4oZQ5kt4490jsShQgsgP9x8fUV6BRQB55L4Z1NrYKFiK7pSLcu3lx7wApVsclSCeg68YrZ0nRLrT7i8eQqxuI4wJgfnLKm05GPXnrXVUUAefr4c1RdM+x+XAGLJv+dj5m0HLncCAxzn7p/lS2/h/W4ViiZo2H+il2LtkG3bkDjncPpXf0UXFY84HhbV1huoUdAsjo4BbJfaxJDNt6EHuD+VWI/DWqRXVhOjqfs4UNvbdgBiSANvocAgj34rv6KdwsAooopDCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigApr/cb6GnU1/uN9DQBWoooqhBRRRQAUUUUAf/2Q==\" alt=\"\"><figcaption>The Report tab.</figcaption></figure>\n<p>The report brings together the incident, the tree, the evidence, the results, the causes and the actions. Export it as <span class=\"ui\">Word report (.docx)</span>, <span class=\"ui\">Report as web page (.html)</span> or <span class=\"ui\">Print or save report as PDF</span>. The tree can be exported as a picture (.svg or .png), the hypotheses as a table (.csv), and the case as a <span class=\"ui\">Storyline Casebook package (.json)</span>.</p>\n\n<h2 id=\"saving\">11. Saving your work</h2>\n<p>The tool keeps your work in the browser of the computer you are using. That copy does not travel with the USB stick.</p>\n<ol>\n  <li><span class=\"ui\">File ▾</span> › <span class=\"ui\">Save as…</span> (Chrome or Edge) links a file in <span class=\"ui\">My cases</span>. Every later change is written to it, and the top bar shows <span class=\"ui\">Saved to …</span>.</li>\n  <li>On another computer, open the tool from the stick and use <span class=\"ui\">File ▾</span> › <span class=\"ui\">Open file…</span>. If the top bar shows <span class=\"ui\">Reconnect file</span>, click it.</li>\n  <li>Firefox, Safari, phones and tablets cannot link files. Use <span class=\"ui\">Download backup copy</span> and open it again later.</li>\n</ol>\n\n<h2 id=\"ai\" class=\"page\">12. Using AI to help you</h2>\n<table>\n  <tr><th>Button</th><th>Where</th><th>What it does</th></tr>\n  <tr><td>Suggest causes with AI</td><td>Inspector, when a gate is selected</td><td>Suggests possible direct causes of that event, each with a test. You tick the ones to add. They are added as <b>unverified</b>.</td></tr>\n  <tr><td>Suggest tests with AI</td><td>Hypotheses &amp; evidence tab</td><td>Suggests how to test each unverified or likely hypothesis: what would confirm it and what would rule it out. You tick the tests to use.</td></tr>\n</table>\n<p>The AI never sets probabilities: those come from the data library or your site data. <span class=\"ui\">Undo</span> removes anything you added.</p>\n<h3>Setting up your own AI key</h3>\n<ol>\n  <li>Get an API key from Anthropic (Claude), OpenAI or Google (Gemini). The provider bills the owner of the key.</li>\n  <li>Click <span class=\"ui\">AI settings</span>, choose the provider, paste the key and click <span class=\"ui\">Test connection</span>.</li>\n  <li>Leave <b>Remember on this device</b> off on shared computers, then click <span class=\"ui\">Save</span>.</li>\n</ol>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACpQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCpQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBA SfGs4sftn2ZeM/LuPY464qKPx1PIrH7Ko2pv8AvH29q41v+QIf+Bf+hGqlv9yT/rj/AFFFgO9k8dzR2qXX2VTu7bz/ADxVqPxjO8cMn2dR5p/vHj9K83uf+QVF9T/OtSD/AI9rT6iiwHev4pnSNpPJU7RnGTWZa+Op7mXyjaqvU53E9Me3vWRN/wAe8n+6f5VzOl/8fR+j/wDstFgO5i8ezySmL7Ko+YLnee5x6Vc/4TOfyDN9nX7wXG4/4V5na/8AH2f+ui/+hCtj/lyP/XQf0osB3f8Awlk/n+T5C9Ac5PcmqNx4kvLqZrVVWNduSRyawP8Al+/4AP5mmx/8f7/7v+FOwjGGpSWJa2K+ZtPDE4PPNO/t1v8AniPzNZd9/wAfb/WqlAXP/9k=\" alt=\"\"><figcaption>AI settings. The key stays in this browser only.</figcaption></figure>\n<p>Before each request you see the full text that will be sent. Replace people's names with roles using <b>Names to replace</b>, then click <span class=\"ui\">Send</span> or <span class=\"ui\">Cancel</span>.</p>\n<div class=\"warn\"><b>Company rules come first.</b> Incident details are confidential. Check that you may send them to an outside AI service before you use AI on a real case.</div>\n\n<h2 id=\"mistakes\">13. Common mistakes</h2>\n<ul>\n  <li><b>Top event too vague.</b> \"Spill\" is not enough. Say what, where and when.</li>\n  <li><b>Wrong gate.</b> Test each input on its own: if it alone could cause the event, the gate is OR.</li>\n  <li><b>Stopping too early.</b> A box such as \"operator error\" needs its own causes: why did the error happen?</li>\n  <li><b>Ruling out without evidence.</b> Only evidence rules out a cause, never a low probability.</li>\n  <li><b>Forgetting the condition.</b> Use a condition (house) event for things that were simply present, such as a single operator on shift.</li>\n</ul>\n\n<h2 id=\"limits\">14. Limitations</h2>\n<ul>\n  <li>Library values are generic, order-of-magnitude screening values.</li>\n  <li>Elements cannot be shared between branches: each appears once. Model a shared cause with a common condition event.</li>\n  <li>Probability ranks hypotheses. It never confirms a cause.</li>\n</ul>\n\n<h2 id=\"trouble\">15. Troubleshooting</h2>\n<table>\n  <tr><th>Problem</th><th>Fix</th></tr>\n  <tr><td>The percentages show \"needs values\"</td><td>An open branch has an event without a value. Give it one, or ignore the numbers: the qualitative analysis still works.</td></tr>\n  <tr><td>An OR gate shows a unit error</td><td>Its inputs mix probabilities and frequencies. Make them the same unit.</td></tr>\n  <tr><td>My tree is gone on another computer</td><td><span class=\"ui\">File ▾</span> › <span class=\"ui\">Open file…</span> and choose the file in <span class=\"ui\">My cases</span>.</td></tr>\n  <tr><td>I want to start again from the example</td><td><span class=\"ui\">File ▾</span> › <span class=\"ui\">Load the worked example</span>.</td></tr>\n</table>\n"};

<script>/* RCA Fault Tree — generic reliability data library.
   Typical screening values from published generic sources. They are starting points for ranking RCA hypotheses,
   NOT design data: every value can be edited per event, overridden for the case on the Data library tab, or
   replaced with site data. Sources (short names used in `ref`):
     CCPS-LOPA   CCPS, Layer of Protection Analysis: Simplified Process Risk Assessment (2001) and
                 Guidelines for Initiating Events and Independent Protection Layers in LOPA (2015)
     IEC61511    IEC 61511-1 SIL bands (PFDavg upper bound of the band used)
     THERP       Swain & Guttmann, NUREG/CR-1278 Handbook of Human Reliability Analysis (1983)
     HEART       Williams, HEART generic task types (nominal human unreliability, 5th–95th bounds)
     GENERIC     Typical generic per-demand failure probabilities quoted in CCPS CPQRA / process-industry
                 reliability handbooks (order-of-magnitude screening values)
   unit 'p' = probability per demand / per occasion; 'f' = frequency per year. */
var RCALIB = (function () {
  const L = [];
  const add = (src, id, name, value, unit, range, ref, note) => L.push({ src, id, name, value, unit, range: range || '', ref, note: note || '' });

  /* ---- Independent protection layers / safeguards: PFD ---- */
  const I = (id, n, v, r, ref, note) => add('ipl', id, n, v, 'p', r, ref || 'CCPS-LOPA', note);
  I('ipl-bpcs', 'BPCS control loop acting as a safeguard (not the initiator)', 0.1, '0.1 (max credit)', 'CCPS-LOPA / IEC61511', 'Max credit for BPCS per IEC 61511');
  I('ipl-op10', 'Operator response to alarm, ≥10 min available, trained, procedure', 0.1, '0.1–1', 'CCPS-LOPA', 'Only if alarm independent of the initiator');
  I('ipl-op-short', 'Operator response to alarm, <10 min or complex diagnosis', 1, '1 (no credit)', 'CCPS-LOPA');
  I('ipl-sil1', 'Safety instrumented function, SIL 1', 0.1, '0.1–0.01', 'IEC61511');
  I('ipl-sil2', 'Safety instrumented function, SIL 2', 0.01, '0.01–0.001', 'IEC61511');
  I('ipl-sil3', 'Safety instrumented function, SIL 3', 0.001, '0.001–0.0001', 'IEC61511');
  I('ipl-prv', 'Pressure relief valve (clean service)', 0.01, '0.1–0.00001', 'CCPS-LOPA', 'Fouling, plugging or polymerising service: use 0.1');
  I('ipl-rd', 'Rupture disc', 0.01, '0.1–0.00001', 'CCPS-LOPA');
  I('ipl-bund', 'Dike / bund (secondary containment)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-drain', 'Underground drainage / spill collection system', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-vent', 'Open vent (no valve)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-fireproof', 'Fireproofing / passive fire protection', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-blast', 'Blast wall / bunker', 0.001, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-arrester', 'Flame or detonation arrester', 0.01, '0.1–0.001', 'CCPS-LOPA');
  I('ipl-check', 'Check valve, single (reverse flow)', 0.1, '1–0.1', 'CCPS-LOPA', 'Many companies give no IPL credit (PFD 1)');
  I('ipl-vacbrk', 'Vacuum breaker', 0.01, '0.1–0.01', 'CCPS-LOPA');
  I('ipl-ro', 'Restriction orifice (limits flow)', 0.01, '0.01–0.001', 'CCPS-LOPA');
  I('ipl-deluge', 'Automatic deluge / sprinkler system', 0.1, '0.1–0.01', 'CCPS-LOPA');
  I('ipl-gasdet', 'Gas detection with automatic action', 0.1, '1–0.1', 'CCPS-LOPA');
  I('ipl-interlock', 'Hard-wired mechanical / electrical interlock', 0.01, '0.1–0.001', 'CCPS-LOPA');

  /* ---- Human error probabilities ---- */
  const H = (id, n, v, r, ref, note) => add('hep', id, n, v, 'p', r, ref, note);
  H('hep-heartA', 'HEART A: totally unfamiliar task, performed at speed, no idea of consequences', 0.55, '0.35–0.97', 'HEART');
  H('hep-heartB', 'HEART B: shift or restore system to a new state at one attempt, no supervision or procedure', 0.26, '0.14–0.42', 'HEART');
  H('hep-heartC', 'HEART C: complex task needing high understanding and skill', 0.16, '0.12–0.28', 'HEART');
  H('hep-heartD', 'HEART D: fairly simple task performed rapidly or given scant attention', 0.09, '0.06–0.13', 'HEART');
  H('hep-heartE', 'HEART E: routine, highly practised, rapid task, low skill', 0.02, '0.007–0.045', 'HEART');
  H('hep-heartF', 'HEART F: restore or shift system following procedure, with some checking', 0.003, '0.0008–0.007', 'HEART');
  H('hep-heartG', 'HEART G: completely familiar, well-designed, highly practised routine task', 0.0004, '0.00008–0.009', 'HEART');
  H('hep-heartH', 'HEART H: respond correctly to command when an automated supervisory system is in place', 0.00002, '0.000006–0.0009', 'HEART');
  H('hep-omit-check', 'Omit a step from a written procedure that has check-off', 0.001, '0.0005–0.005', 'THERP');
  H('hep-omit-nocheck', 'Omit a step from a written procedure, no check-off', 0.003, '0.001–0.01', 'THERP');
  H('hep-omit-long', 'Omit a step from a long list (>10 items), no check-off', 0.01, '0.003–0.03', 'THERP');
  H('hep-wrong-ctrl', 'Select wrong control from a group of similar-looking controls', 0.003, '0.001–0.01', 'THERP');
  H('hep-wrong-ctrl-clear', 'Select wrong control, controls well delineated / labelled', 0.001, '0.0005–0.005', 'THERP');
  H('hep-read-meter', 'Misread an analogue meter / gauge', 0.003, '0.001–0.01', 'THERP');
  H('hep-checker', 'Second-person check fails to detect the error', 0.1, '0.05–0.5', 'THERP');
  H('hep-alarm-single', 'Fail to respond to a single clear alarm, low workload', 0.001, '0.0001–0.01', 'THERP');
  H('hep-alarm-flood', 'Fail to respond to an alarm, high workload / many alarms', 0.1, '0.05–0.5', 'THERP');
  H('hep-isolation', 'Isolation error: wrong valve or breaker isolated', 0.003, '0.001–0.01', 'THERP');
  H('hep-verbal', 'Error in recalling or passing on a verbal instruction (several items)', 0.003, '0.001–0.01', 'THERP');
  H('hep-restore', 'Fail to restore equipment (bypass, valve, guard) after maintenance', 0.003, '0.001–0.01', 'HEART F / THERP');

  /* ---- Equipment failure on demand ---- */
  const E = (id, n, v, r, note) => add('equip', id, n, v, 'p', r, 'GENERIC', note);
  E('eq-pump-start', 'Pump fails to start on demand', 0.003, '0.001–0.01');
  E('eq-firepump', 'Diesel fire pump fails to start', 0.01, '0.003–0.03');
  E('eq-edg', 'Emergency generator fails to start', 0.03, '0.01–0.1');
  E('eq-mov', 'Motor-operated valve fails to open / close on demand', 0.003, '0.001–0.01');
  E('eq-aov', 'Air-operated valve fails to operate on demand', 0.002, '0.001–0.01');
  E('eq-sov', 'Solenoid valve fails to operate on demand', 0.001, '0.0005–0.005');
  E('eq-manual-valve', 'Manual valve fails to operate (stuck)', 0.001, '0.0001–0.005');
  E('eq-checkv', 'Check valve fails to close (reverse flow)', 0.001, '0.0001–0.01');
  E('eq-prv', 'Relief valve fails to open at set pressure', 0.003, '0.001–0.01');
  E('eq-lswitch', 'Level / pressure switch fails on demand (annual test)', 0.01, '0.003–0.05', 'Longer test intervals scale the value up');
  E('eq-ltx', 'Transmitter fails, reading frozen or wrong (annual test)', 0.01, '0.003–0.05');
  E('eq-gasdet', 'Gas detector fails to detect (annual test)', 0.05, '0.01–0.1');
  E('eq-alarm', 'Alarm horn / beacon fails on demand', 0.01, '0.001–0.03');
  E('eq-relay', 'Relay fails to operate', 0.0001, '0.00003–0.001');
  E('eq-breaker', 'Circuit breaker fails to open on demand', 0.003, '0.001–0.01');
  E('eq-ups', 'UPS / battery fails to supply on demand', 0.01, '0.003–0.03');
  E('eq-hose', 'Flexible transfer hose ruptures (per transfer)', 0.0001, '0.00001–0.001');
  E('eq-sling', 'Lifting sling / wire rope fails under rated load (per lift, inspected)', 0.00001, '0.000001–0.0001');
  E('eq-hoistbrake', 'Hoist brake fails to hold on demand', 0.0001, '0.00003–0.001');
  E('eq-harness', 'Fall-arrest harness / lanyard fails on arrest', 0.0001, '0.00001–0.001');
  E('eq-guard-interlock', 'Machine guard interlock fails to stop machine on opening', 0.001, '0.0001–0.01');

  /* ---- Initiating event frequencies (/yr) ---- */
  const F = (id, n, v, r, note) => add('freq', id, n, v, 'f', r, 'CCPS-LOPA', note);
  F('ie-bpcs', 'BPCS instrument loop failure', 0.1, '1–0.1');
  F('ie-regulator', 'Pressure regulator failure', 0.1, '1–0.1');
  F('ie-pumpseal', 'Pump seal failure (leak)', 0.1, '1–0.01');
  F('ie-hose', 'Loading / unloading hose failure', 0.1, '1–0.01');
  F('ie-gasket', 'Gasket / packing blow-out', 0.01, '0.1–0.001');
  F('ie-pipe-leak', 'Piping leak (10 % section), 100 m', 0.001, '0.001–0.0001');
  F('ie-pipe-rupture', 'Piping full-bore rupture, 100 m', 0.00001, '0.00001–0.000001');
  F('ie-atmtank', 'Atmospheric tank catastrophic failure', 0.001, '0.001–0.0001');
  F('ie-vessel', 'Pressure vessel residual failure', 0.000001, '0.00001–0.0000001');
  F('ie-cw', 'Loss of cooling water', 0.1, '1–0.1');
  F('ie-power', 'Loss of power supply', 0.1, '1–0.1');
  F('ie-spurious-prv', 'Relief valve opens spuriously', 0.01, '0.1–0.001');
  F('ie-thirdparty', 'Third-party impact (vehicle, excavation)', 0.01, '0.1–0.001');
  F('ie-lightning', 'Lightning strike', 0.001, '0.001–0.0001');
  F('ie-extfire', 'Large external fire', 0.01, '0.1–0.001');
  F('ie-turbine', 'Turbine / diesel overspeed with casing breach', 0.0001, '0.001–0.00001');

  const SOURCES = [
    { k: 'none', name: 'Not quantified', unit: '' },
    { k: 'manual', name: 'Manual value', unit: '' },
    { k: 'ipl', name: 'Safeguard / IPL PFD', unit: 'p' },
    { k: 'hep', name: 'Human error probability', unit: 'p' },
    { k: 'equip', name: 'Equipment failure on demand', unit: 'p' },
    { k: 'freq', name: 'Initiating event frequency', unit: 'f' },
    { k: 'site', name: 'Site data (custom library item)', unit: '' }
  ];
  const REFS = {
    'CCPS-LOPA': 'CCPS, Layer of Protection Analysis (2001); Guidelines for Initiating Events and IPLs in LOPA (2015)',
    IEC61511: 'IEC 61511-1, safety instrumented systems for the process industry sector (SIL bands)',
    THERP: 'Swain & Guttmann, NUREG/CR-1278 Handbook of Human Reliability Analysis (1983)',
    HEART: 'Williams, HEART – Human Error Assessment and Reduction Technique (generic task types)',
    GENERIC: 'Typical generic process-industry per-demand failure values (CCPS CPQRA and reliability handbooks)'
  };
  return { ITEMS: L, SOURCES, REFS };
})();
if (typeof module !== 'undefined') module.exports = RCALIB;
