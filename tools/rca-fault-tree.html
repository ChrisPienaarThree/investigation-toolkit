<script>/* RCA Fault Tree — engine: evaluation (probability / frequency), evidence conditioning, minimal cut sets,
   consistency checks, tidy top-down layout and SVG drawing. Pure functions; no DOM.
   Case: { meta, root, nodes:{id: node}, actions:[], libOverrides:{itemId: value}, customLib:[items] }
   Node: { id, code, kind:'gate'|'basic'|'undeveloped'|'house', label, gate:'OR'|'AND'|'INHIBIT'|'VOTE', k, children:[ids],
           status:'confirmed'|'likely'|'unverified'|'ruledout', evidence, test, testOwner, testDue, cause, category, why, notes, collapsed,
           prob:{ src, item, value, unit, note } } */
var RCAE = (function () {
  const LIB = (typeof RCALIB !== 'undefined') ? RCALIB : require('./library.js');
  const STATUS = {
    confirmed: { name: 'Confirmed', col: '#1f7a45', soft: '#e3f3e9' },
    likely: { name: 'Likely', col: '#a86200', soft: '#fff1d9' },
    unverified: { name: 'Unverified', col: '#64707e', soft: '#eef1f4' },
    ruledout: { name: 'Ruled out', col: '#b42318', soft: '#f6e3e1' }
  };
  const GATES = { OR: 'OR – any input causes it', AND: 'AND – all inputs needed', INHIBIT: 'INHIBIT – input plus enabling condition', VOTE: 'VOTE – k of n inputs' };
  const KINDS = { gate: 'Intermediate event (gate)', basic: 'Basic event', undeveloped: 'Undeveloped event', house: 'Condition / house event' };
  const CAUSE = { '': 'Not classified', causal: 'Causal factor', root: 'Root cause', contributing: 'Contributing factor' };
  const CATEGORIES = ['Equipment / hardware', 'Human performance', 'Procedures', 'Design / engineering', 'Maintenance', 'Training / competence', 'Organisation / management', 'Communication', 'Work environment', 'External'];

  const isGate = n => n && n.kind === 'gate';
  const kids = (c, n) => ((n && n.children) || []).map(id => c.nodes[id]).filter(Boolean);

  /* ---------- library lookup ---------- */
  function libItem(c, id) {
    if (!id) return null;
    const custom = (c.customLib || []).find(x => x.id === id);
    const base = custom || LIB.ITEMS.find(x => x.id === id);
    if (!base) return null;
    const ov = c.libOverrides && c.libOverrides[id] != null ? +c.libOverrides[id] : null;
    return Object.assign({}, base, { def: base.value, value: ov != null ? ov : base.value, overridden: ov != null });
  }
  function unitOf(c, n) {
    if (!n) return 'p';
    if (isGate(n)) {
      const ks = kids(c, n);
      if (n.gate === 'OR') return ks.length && ks.every(k => unitOf(c, k) === 'f') ? 'f' : (ks.some(k => unitOf(c, k) === 'f') ? 'mixed' : 'p');
      return ks.some(k => { const u = unitOf(c, k); return u === 'f' || u === 'mixed'; }) ? 'f' : 'p';
    }
    const p = n.prob || {};
    if (p.src === 'freq') return 'f';
    if ((p.src === 'manual' || p.src === 'site') && p.unit === 'f') return 'f';
    if (p.src === 'site') { const it = libItem(c, p.item); if (it && it.unit === 'f') return 'f'; }
    return 'p';
  }
  /* The event's own (prior) value, before evidence: NaN when not quantified. */
  function rawValue(c, n) {
    const p = n.prob || {};
    if (n.kind === 'house' && (!p.src || p.src === 'none')) return 1;
    if (!p.src || p.src === 'none') return NaN;
    const v = p.value;
    if (v === '' || v == null || isNaN(+v)) return NaN;
    return +v;
  }

  /* ---------- evaluation ----------
     mode 'prior'    : every event at its own value (what was likely before the investigation)
     mode 'evidence' : ruled out = 0, confirmed probability events = 1, the rest at their value
     force           : {id: value} overrides (used for conditioning). Returns {v, u, err[]} for the node. */
  function evaluate(c, mode, force) {
    const memo = {}, errs = [];
    const val = id => {
      if (memo[id]) return memo[id];
      const n = c.nodes[id]; if (!n) return { v: NaN, u: 'p' };
      const u = unitOf(c, n);
      let r;
      if (force && force[id] != null) r = { v: force[id], u };
      else if (mode === 'evidence' && n.status === 'ruledout') r = { v: 0, u };
      else if (!isGate(n)) {
        if (mode === 'evidence' && n.status === 'confirmed' && u === 'p') r = { v: 1, u };
        else r = { v: rawValue(c, n), u };
      } else {
        const ks = kids(c, n).map(k => val(k.id));
        if (!ks.length) r = { v: NaN, u };
        else if (n.gate === 'OR') {
          const nz = ks.filter(k => k.v !== 0);
          const hasF = nz.some(k => k.u === 'f'), hasP = nz.some(k => k.u === 'p');
          if (hasF && hasP) { errs.push({ id, code: 'U1' }); r = { v: NaN, u: 'mixed' }; }
          else if (hasF) r = { v: nz.some(k => isNaN(k.v)) ? NaN : nz.reduce((a, k) => a + k.v, 0), u: 'f' };
          else if (nz.some(k => k.v >= 1)) r = { v: 1, u: 'p' };
          else r = { v: nz.some(k => isNaN(k.v)) ? NaN : 1 - nz.reduce((a, k) => a * (1 - k.v), 1), u: 'p' };
        } else if (n.gate === 'VOTE') {
          const k = Math.max(1, Math.min(ks.length, +n.k || 2));
          if (ks.some(x => x.u === 'f')) { errs.push({ id, code: 'U3' }); r = { v: NaN, u: 'p' }; }
          else if (ks.some(x => isNaN(x.v))) r = { v: NaN, u: 'p' };
          else { // P(at least k of n)
            let dp = [1]; ks.forEach(x => { const nd = new Array(dp.length + 1).fill(0); dp.forEach((pv, j) => { nd[j] += pv * (1 - x.v); nd[j + 1] += pv * x.v; }); dp = nd; });
            r = { v: dp.slice(k).reduce((a, b) => a + b, 0), u: 'p' };
          }
        } else { // AND, INHIBIT
          if (ks.some(x => x.v === 0)) r = { v: 0, u };
          else {
            const nf = ks.filter(x => x.u === 'f').length;
            if (nf > 1) { errs.push({ id, code: 'U2' }); r = { v: NaN, u: 'f' }; }
            else r = { v: ks.some(x => isNaN(x.v)) ? NaN : ks.reduce((a, x) => a * x.v, 1), u: nf ? 'f' : 'p' };
          }
        }
      }
      memo[id] = r; return r;
    };
    const top = val(c.root);
    return { top, val, errs, memo };
  }

  /* Posterior share for every unresolved node: how likely it is that it contributed, given the top event and the
     evidence so far. Probability nodes: P(X | top) = p(X) * V(top | X=1) / V(top). Frequency nodes (initiators):
     share of the top frequency, (V(top) - V(top | X=0)) / V(top). */
  function posteriors(c) {
    const base = evaluate(c, 'evidence'), V = base.top.v, out = {};
    if (!(V > 0) || isNaN(V)) return { base, out, ok: false };
    const prior = evaluate(c, 'prior');
    walk(c).forEach(({ n }) => {
      if (n.id === c.root || n.status === 'ruledout') return;
      if (n.status === 'confirmed' && unitOf(c, n) === 'p') { out[n.id] = 1; return; }
      const u = unitOf(c, n);
      if (u === 'f') { const v0 = evaluate(c, 'evidence', { [n.id]: 0 }).top.v; out[n.id] = isNaN(v0) ? NaN : (V - v0) / V; }
      else {
        const p = isGate(n) ? evaluate(c, 'evidence').val(n.id).v : rawValue(c, n);
        const pv = n.status === 'confirmed' ? 1 : (isGate(n) ? p : prior.val(n.id).v);
        const vt = evaluate(c, 'evidence', { [n.id]: 1 }).top.v;
        out[n.id] = (isNaN(pv) || isNaN(vt)) ? NaN : Math.min(1, pv * vt / V);
      }
    });
    return { base, out, ok: true };
  }

  /* ---------- traversal ---------- */
  function walk(c, opts) {
    const out = [], seen = {};
    const go = (id, depth, parent) => {
      const n = c.nodes[id]; if (!n || seen[id]) return; seen[id] = 1;
      out.push({ n, depth, parent });
      if (isGate(n) && !(opts && opts.visibleOnly && n.collapsed)) (n.children || []).forEach(k => go(k, depth + 1, id));
    };
    go(c.root, 0, null);
    return out;
  }
  function parentOf(c, id) { for (const k in c.nodes) { const n = c.nodes[k]; if ((n.children || []).indexOf(id) >= 0) return n; } return null; }
  function descendants(c, id) { const out = []; const go = i => { const n = c.nodes[i]; if (!n) return; (n.children || []).forEach(k => { out.push(k); go(k); }); }; go(id); return out; }

  /* ---------- minimal cut sets ---------- */
  function cutSets(c, opts) {
    opts = opts || {}; const LIMIT = opts.limit || 4000; let truncated = false;
    const excl = n => opts.excludeRuledOut && n.status === 'ruledout';
    const cs = id => {
      const n = c.nodes[id]; if (!n || excl(n)) return [];
      if (!isGate(n)) return [[id]];
      const ks = kids(c, n).map(k => cs(k.id));
      if (n.gate === 'OR') return [].concat(...ks);
      const product = lists => lists.reduce((acc, L) => { const o = []; acc.forEach(a => L.forEach(b => { if (o.length < LIMIT) o.push(a.concat(b)); else truncated = true; })); return o; }, [[]]);
      if (n.gate === 'VOTE') {
        const k = Math.max(1, Math.min(ks.length, +n.k || 2)), out = [];
        const comb = (start, chosen) => { if (chosen.length === k) { out.push(...product(chosen)); return; } for (let i = start; i < ks.length; i++) comb(i + 1, chosen.concat([ks[i]])); };
        comb(0, []); return out;
      }
      return product(ks);
    };
    let sets = cs(c.root).map(s => Array.from(new Set(s)).sort());
    sets.sort((a, b) => a.length - b.length);
    const min = [];
    sets.forEach(s => { if (!min.some(m => m.every(x => s.indexOf(x) >= 0))) min.push(s); });
    return { sets: min, truncated };
  }
  function rankCutSets(c) {
    const { sets, truncated } = cutSets(c, { excludeRuledOut: true });
    const pri = evaluate(c, 'prior'), evd = evaluate(c, 'evidence');
    const prod = (s, E) => { let v = 1, nf = 0; s.forEach(id => { const r = E.val(id); if (r.u === 'f') nf++; v *= r.v; }); return { v: nf > 1 ? NaN : v, u: nf ? 'f' : 'p' }; };
    const rows = sets.map(s => {
      const st = s.map(id => c.nodes[id].status);
      const status = st.every(x => x === 'confirmed') ? 'confirmed' : st.every(x => x === 'confirmed' || x === 'likely') ? 'likely' : 'open';
      return { ids: s, status, prior: prod(s, pri), evid: prod(s, evd) };
    });
    const tot = rows.reduce((a, r) => a + (isNaN(r.evid.v) ? 0 : r.evid.v), 0);
    rows.forEach(r => { r.share = tot > 0 && !isNaN(r.evid.v) ? r.evid.v / tot : NaN; });
    const order = { confirmed: 0, likely: 1, open: 2 };
    rows.sort((a, b) => order[a.status] - order[b.status] || (isNaN(b.evid.v) ? -1 : isNaN(a.evid.v) ? 1 : b.evid.v - a.evid.v) || a.ids.length - b.ids.length);
    const all = cutSets(c, {}).sets.length;
    return { rows, truncated, eliminated: all - sets.length };
  }

  /* ---------- checks ---------- */
  function check(c) {
    const I = [], add = (sev, code, id, msg) => I.push({ sev, code, ids: id ? [].concat(id) : [], msg });
    const nm = n => (n.code ? n.code + ' ' : '') + '“' + ((n.label || '').trim() || 'no description') + '”';
    const root = c.nodes[c.root];
    if (!root) { add('error', 'T0', null, 'The tree has no top event.'); return I; }
    if (!isGate(root) || !(root.children || []).length) add('error', 'T1', root.id, 'Develop the top event: add the causes (gates and events) that could have produced it.');
    if (root.status !== 'confirmed') add('tip', 'T2', root.id, 'The top event is the incident that happened. Mark it Confirmed and record the evidence.');
    const E = evaluate(c, 'evidence');
    E.errs.forEach(e => {
      const n = c.nodes[e.id];
      if (e.code === 'U1') add('error', 'U1', e.id, 'OR gate ' + nm(n) + ' mixes frequencies (/yr) and probabilities. Every input of an OR must use the same unit.');
      if (e.code === 'U2') add('error', 'U2', e.id, 'AND gate ' + nm(n) + ' has more than one frequency input. Only one input may be a frequency; the others must be probabilities.');
      if (e.code === 'U3') add('error', 'U3', e.id, 'VOTE gate ' + nm(n) + ' can only combine probabilities.');
    });
    walk(c).forEach(({ n, parent }) => {
      const p = parent ? c.nodes[parent] : null, ks = kids(c, n);
      if (!(n.label || '').trim()) add('warning', 'Q1', n.id, (n.code || 'An element') + ' has no description.');
      if (isGate(n)) {
        if (!ks.length && n.id !== c.root) add('error', 'G1', n.id, 'Gate ' + nm(n) + ' has no inputs. Add its causes, or change it to an event.');
        if ((n.gate === 'AND' || n.gate === 'INHIBIT') && ks.length === 1) add('warning', 'G2', n.id, n.gate + ' gate ' + nm(n) + ' has only one input. Add the other condition(s), or use OR.');
        if (n.gate === 'INHIBIT' && ks.length && !ks.some(k => k.kind === 'house')) add('tip', 'G3', n.id, 'INHIBIT gate ' + nm(n) + ': show the enabling condition as a condition (house) event.');
        if (n.gate === 'VOTE' && (+n.k < 1 || +n.k > ks.length)) add('error', 'G4', n.id, 'VOTE gate ' + nm(n) + ': k must be between 1 and the number of inputs (' + ks.length + ').');
        if (n.status === 'confirmed' && ks.length) {
          if (ks.every(k => k.status === 'ruledout')) add('error', 'C1', n.id, nm(n) + ' is confirmed but every cause under it is ruled out. The tree is missing the real cause: add it.');
          else if ((n.gate === 'AND' || n.gate === 'INHIBIT') && ks.some(k => k.status === 'ruledout')) add('error', 'C2', n.id, 'AND gate ' + nm(n) + ' is confirmed, but an input it needs is ruled out. Either the input is not ruled out or the gate logic is wrong.');
          else if (n.gate === 'OR' && !ks.some(k => k.status === 'confirmed')) add('warning', 'C3', n.id, nm(n) + ' is confirmed but none of its causes is confirmed yet. Find which one occurred.');
        }
        if (n.status === 'ruledout' && ks.some(k => k.status === 'confirmed')) add('error', 'C4', n.id, nm(n) + ' is ruled out, but a cause under it is confirmed.');
        if ((n.gate === 'AND' || n.gate === 'INHIBIT') && n.status !== 'ruledout' && ks.length > 1 && ks.every(k => k.status === 'confirmed') && n.status !== 'confirmed') add('tip', 'C5', n.id, 'All inputs of ' + nm(n) + ' are confirmed, so the gate itself occurred: mark it Confirmed.');
      } else {
        const pr = n.prob || {};
        if (pr.src && pr.src !== 'none' && isNaN(rawValue(c, n))) add('warning', 'P1', n.id, 'Enter a value for ' + nm(n) + ', or set its source to Not quantified.');
        if (pr.src && pr.src !== 'none' && pr.src !== 'manual' && pr.src !== 'freq' && unitOf(c, n) === 'p' && rawValue(c, n) > 1) add('error', 'P2', n.id, nm(n) + ': a probability cannot be greater than 1.');
        const it = libItem(c, pr.item);
        if (it && pr.value != null && +pr.value !== it.value && !(pr.note || '').trim()) add('tip', 'P3', n.id, nm(n) + ': the value differs from the library value (' + fmt(it.value) + '). Record why in the value note.');
      }
      if (p && p.status === 'ruledout' && n.status === 'confirmed') add('error', 'C6', n.id, nm(n) + ' is confirmed under a branch that is ruled out.');
      if ((n.status === 'confirmed' || n.status === 'ruledout') && !(n.evidence || '').trim()) add('warning', 'V1', n.id, nm(n) + ' is ' + STATUS[n.status].name.toLowerCase() + ' without recorded evidence.');
      if ((n.status === 'unverified' || n.status === 'likely') && !(n.test || '').trim() && n.id !== c.root) add('tip', 'V2', n.id, 'Plan how to test ' + nm(n) + ' (inspection, record, interview, test).');
      if (n.cause === 'root' && n.status === 'ruledout') add('error', 'R1', n.id, nm(n) + ' is marked as a root cause but is ruled out.');
      if (n.cause === 'root' && !(c.actions || []).some(a => a.target === n.id && a.status !== 'Cancelled')) add('warning', 'R2', n.id, 'Root cause ' + nm(n) + ' has no corrective action.');
    });
    const roots = Object.values(c.nodes).filter(n => n.cause === 'root' && n.status !== 'ruledout');
    if (!roots.length && Object.values(c.nodes).some(n => n.status === 'confirmed' && !isGate(n))) add('tip', 'R3', null, 'Classify the confirmed causes: mark which are root causes, causal factors or contributing factors.');
    const o = { error: 0, warning: 1, tip: 2 };
    return I.sort((a, b) => o[a.sev] - o[b.sev]);
  }

  /* ---------- numbers ---------- */
  function fmt(v, u) {
    if (v == null || isNaN(v)) return '—';
    let s;
    if (v === 0) s = '0';
    else if (v >= 0.01 && v < 1000) s = String(+v.toPrecision(2));
    else { const e = v.toExponential(1).replace('e', 'E'); s = e.replace(/E\+?(-?)(\d)$/, 'E$10$2'); }
    return u === 'f' ? s + ' /yr' : s;
  }

  /* ---------- layout (top-down tidy tree) ---------- */
  const BW = 184, BH = 82, SYM = 34, LEVEL = 152, COL = 204;
  function layout(c) {
    const pos = {}; let leaf = 0;
    const place = (id, depth) => {
      const n = c.nodes[id]; if (!n) return 0;
      const ks = isGate(n) && !n.collapsed ? (n.children || []).filter(k => c.nodes[k]) : [];
      let x;
      if (!ks.length) { x = leaf * COL; leaf++; }
      else { const xs = ks.map(k => place(k, depth + 1)); x = (xs[0] + xs[xs.length - 1]) / 2; }
      pos[id] = { x, y: depth * LEVEL }; return x;
    };
    place(c.root, 0);
    return pos;
  }

  /* ---------- drawing ---------- */
  const FONT = 'Arial, Helvetica, sans-serif';
  const xml = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[ch]));
  function wrap(t, max, lines) {
    const w = String(t || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean), out = []; let cur = '';
    w.forEach(x => { if (!cur) cur = x; else if ((cur + ' ' + x).length <= max) cur += ' ' + x; else { out.push(cur); cur = x; } });
    if (cur) out.push(cur);
    if (out.length > lines) { const cut = out.slice(0, lines); cut[lines - 1] = cut[lines - 1].replace(/.{0,2}$/, '') + '…'; return cut; }
    return out;
  }
  function symbol(n, cx, y) { // y = top of symbol area
    const s = '#22324a', f = '#ffffff', w = 1.6;
    if (isGate(n)) {
      const t = n.gate;
      if (t === 'OR' || t === 'VOTE') return `<path d="M${cx - 15},${y + 30} Q${cx - 13},${y + 10} ${cx},${y + 2} Q${cx + 13},${y + 10} ${cx + 15},${y + 30} Q${cx},${y + 21} ${cx - 15},${y + 30}Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>` + (t === 'VOTE' ? `<text x="${cx}" y="${y + 24}" text-anchor="middle" font-family="${FONT}" font-size="9" font-weight="700" fill="${s}">${xml((n.k || 2) + '/' + (n.children || []).length)}</text>` : '');
      if (t === 'AND') return `<path d="M${cx - 14},${y + 30} V${y + 16} A14,14 0 0 1 ${cx + 14},${y + 16} V${y + 30}Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
      if (t === 'INHIBIT') return `<path d="M${cx},${y + 1} L${cx + 14},${y + 9} L${cx + 14},${y + 23} L${cx},${y + 31} L${cx - 14},${y + 23} L${cx - 14},${y + 9}Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
    }
    if (n.kind === 'basic') return `<circle cx="${cx}" cy="${y + 15}" r="13" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
    if (n.kind === 'undeveloped') return `<path d="M${cx},${y + 1} L${cx + 17},${y + 15} L${cx},${y + 29} L${cx - 17},${y + 15}Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
    if (n.kind === 'house') return `<path d="M${cx - 14},${y + 30} V${y + 12} L${cx},${y + 2} L${cx + 14},${y + 12} V${y + 30}Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
    return '';
  }
  /* ctx: {interactive, sel, issues:{id:{error,warning}}, show:'evidence'|'prior'|'none', post:{id:v}} */
  function render(c, ctx) {
    ctx = ctx || {};
    const pos = layout(c);
    const E = ctx.show && ctx.show !== 'none' ? evaluate(c, ctx.show) : null;
    let edges = '', nodes = '';
    let x0 = Infinity, x1 = -Infinity, y1 = 0;
    Object.keys(pos).forEach(id => {
      const n = c.nodes[id], p = pos[id], cx = p.x + BW / 2, top = p.y;
      x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + BW); y1 = Math.max(y1, p.y + BH + SYM + 4);
      const ks = isGate(n) && !n.collapsed ? (n.children || []).filter(k => pos[k]) : [];
      if (ks.length) {
        const by = top + BH + SYM, mid = by + 18;
        edges += `<path d="M${cx},${by} V${mid}" fill="none" stroke="#5a6779" stroke-width="1.4"/>`;
        const xs = ks.map(k => pos[k].x + BW / 2);
        edges += `<path d="M${Math.min.apply(null, xs)},${mid} H${Math.max.apply(null, xs)}" fill="none" stroke="#5a6779" stroke-width="1.4"/>`;
        ks.forEach(k => { edges += `<path d="M${pos[k].x + BW / 2},${mid} V${pos[k].y}" fill="none" stroke="#5a6779" stroke-width="1.4"/>`; });
      }
      const st = STATUS[n.status] || STATUS.unverified, ro = n.status === 'ruledout';
      let s = '';
      s += `<line x1="${cx}" y1="${top + BH}" x2="${cx}" y2="${top + BH + 3}" stroke="#22324a" stroke-width="1.5"/>`;
      s += `<rect x="${p.x}" y="${top}" width="${BW}" height="${BH}" rx="4" fill="${ro ? '#f4f4f2' : '#ffffff'}" stroke="${n.id === c.root ? '#0f2a4d' : '#8a96a6'}" stroke-width="${n.id === c.root ? 2.2 : 1}"${ro ? ' stroke-dasharray="5 3"' : ''}/>`;
      s += `<rect x="${p.x}" y="${top}" width="6" height="${BH}" rx="2" fill="${st.col}"/>`;
      s += `<text x="${p.x + 13}" y="${top + 15}" font-family="${FONT}" font-size="10.5" font-weight="700" fill="${ro ? '#8a8a8a' : '#0f2a4d'}">${xml(n.code || '')}</text>`;
      const chip = st.name.toUpperCase(), cw = chip.length * 5.6 + 10;
      s += `<rect x="${p.x + BW - cw - 6}" y="${top + 5}" width="${cw}" height="14" rx="7" fill="${st.soft}"/><text x="${p.x + BW - cw / 2 - 6}" y="${top + 15}" text-anchor="middle" font-family="${FONT}" font-size="8" font-weight="700" letter-spacing=".4" fill="${st.col}">${chip}</text>`;
      const lines = wrap(n.label, 30, 3);

<span class="eyebrow">User guide</span><h1>RCA Fault Tree</h1>
<p>A cause-and-effect fault tree for <b>root cause analysis</b>. The top event is the incident that happened. Below it you set out every way it could have happened, test each branch against the evidence, and keep the branches that survive. Probabilities are optional. When you enter them, they rank the hypotheses that are still open, so you know what to test first.</p>
<p>It is not a risk-assessment tool: it does not ask whether a design is good enough. For quantitative design studies (PFDavg, SIL, test intervals) use the Fault Tree and PFD Calculator in the Process Safety Analysis Toolkit.</p>

<h2>1. Quick start</h2>
<ul>
<li><b>File ▸ New fault tree</b>, then describe the incident on the <b>Incident</b> tab.</li>
<li>On the <b>Fault tree</b> tab, select the top event and add its causes with <b>+ Gate</b> (an intermediate event that you develop further) or <b>+ Basic event</b> (a cause you do not break down).</li>
<li>Choose the gate logic: <b>OR</b> if any one input is enough, <b>AND</b> if all inputs were needed together.</li>
<li>For each element set the <b>hypothesis status</b> and record the <b>evidence</b>. Plan a <b>test</b> for those still open.</li>
<li>Optionally give events a probability, from the data library or as a manual value.</li>
<li>Classify the confirmed causes (root cause, causal factor, contributing factor), add <b>Actions</b>, and produce the <b>Report</b>.</li>
<li><b>File ▸ Save as</b> links a file in the <code>My cases</code> folder on the stick. After that, every change is written to the file.</li>
</ul>

<h2>2. Symbols</h2>
<ul>
<li><b>Box</b>: the description of every event. The coloured stripe on the left is the hypothesis status.</li>
<li><b>OR gate</b> (curved shield): the output occurs if any input occurs.</li>
<li><b>AND gate</b> (flat-bottomed dome): the output occurs only if all inputs occur together.</li>
<li><b>INHIBIT gate</b> (hexagon): the output occurs if the input occurs while an enabling condition is present. Show the condition as a condition (house) event.</li>
<li><b>VOTE gate</b> (shield with k/n): the output occurs if at least k of the n inputs occur.</li>
<li><b>Basic event</b> (circle): a cause that is not developed further.</li>
<li><b>Undeveloped event</b> (diamond): a cause not developed, for lack of information or because it is outside the scope.</li>
<li><b>Condition / house event</b> (house): a condition that was or was not present (for example, a single operator on shift). Its value is usually 1 (present) or 0 (absent).</li>
<li><b>Triangle</b>: a collapsed branch. Select the gate and choose Expand branch.</li>
</ul>

<h2>3. Hypothesis status</h2>
<ul>
<li><b>Confirmed</b>: the evidence shows it happened.</li>
<li><b>Likely</b>: the evidence points to it but is not conclusive yet.</li>
<li><b>Unverified</b>: still to be tested.</li>
<li><b>Ruled out</b>: the evidence shows it did not happen. The branch is drawn dashed and struck through, and it drops out of the causal combinations.</li>
</ul>
<p>The consistency check (Results tab) flags contradictions. Examples: a confirmed gate whose causes are all ruled out (the real cause is missing from the tree), a confirmed AND gate with a ruled-out input, or a confirmed cause under a ruled-out branch.</p>

<h2>4. Probabilities and the data library</h2>
<p>Each event chooses its own source, so one tree can mix failure types:</p>
<ul>
<li><b>Safeguard / IPL PFD</b>: typical probability of failure on demand of protection layers (CCPS LOPA, IEC 61511 SIL bands).</li>
<li><b>Human error probability</b>: THERP and HEART generic task values.</li>
<li><b>Equipment failure on demand</b>: generic per-demand values for pumps, valves, switches, transmitters, lifting gear and so on.</li>
<li><b>Initiating event frequency</b>: typical frequencies per year (CCPS LOPA).</li>
<li><b>Manual value</b>: your own probability or frequency.</li>
<li><b>Site data</b>: custom items you add on the Data library tab (for example from CMMS history).</li>
</ul>
<p>Picking a library item fills in its value. You can then <b>edit the value for that event</b> (for example, scale a switch PFD up because its proof test was 18 months overdue). The panel then shows the event as edited, and you should record why in the value note. <b>Use library value</b> puts it back. On the Data library tab you can also override an item for the whole case; events that use it and were not edited individually follow the new value.</p>
<p>Units: probability (0 to 1) or frequency (per year). An OR gate must combine inputs of the same unit. An AND gate may have at most one frequency input; the result is then a frequency (frequency × probabilities).</p>

<h2>5. How the numbers are calculated</h2>
<ul>
<li>OR: 1 − Π(1 − p<sub>i</sub>) for probabilities; Σ f<sub>i</sub> for frequencies.</li>
<li>AND / INHIBIT: Π p<sub>i</sub>, or f × Π p<sub>i</sub> with one frequency input.</li>
<li>VOTE k of n: probability that at least k of the n inputs occur.</li>
<li>The tree is evaluated exactly. Each element appears once, so the branches are independent.</li>
<li><b>Before evidence</b>: every hypothesis at its screening value, giving how likely the incident path was before the investigation.</li>
<li><b>Given evidence</b>: ruled-out causes count as 0 and confirmed probability causes as 1.</li>
<li><b>Given the incident</b>, for each open hypothesis X: P(X contributed | top event and evidence) = p(X) × P(top | X occurred) / P(top). For a frequency (initiating) event it is that event's share of the top frequency. This is the ranking on the Results tab and the percentage shown on the tree.</li>
<li><b>Credible causal combinations</b> are the minimal cut sets of the tree with ruled-out causes removed. Each is a set of causes that together are enough to produce the top event. They are sorted by status (all confirmed first) and then by likelihood.</li>
</ul>
<p>If an open branch has an event without a value, the percentages that depend on it show “needs values”. The qualitative analysis still works.</p>

<h2>6. Saving on the USB stick</h2>
<ul>
<li>The tool keeps your work in the browser of the computer you are using. That copy does not travel with the stick.</li>
<li><b>File ▸ Save as</b> (Chrome or Edge) links a file in <code>My cases</code>. Every later change is written to it, and the header shows “Saved to …”.</li>
<li>On another computer, open the tool from the stick and use <b>File ▸ Open file</b>. If the header shows <b>Reconnect file</b>, click it: the browser asks for permission again after a restart.</li>
<li>Firefox and Safari cannot link files. Use <b>Download backup copy</b> and open it again later.</li>
<li>The START HERE dashboard lists the cases in <code>My cases</code> and those kept only in this browser.</li>
</ul>

<h2>7. Limitations</h2>
<ul>
<li>Library values are generic, order-of-magnitude screening values. Use them to rank hypotheses, not as design data. Replace them with site data where you have it.</li>
<li>Elements cannot be shared between branches (each appears once). If the same cause acts in two places, model the dependency explicitly, for example with a common condition event.</li>
<li>Probability never confirms a cause. A low percentage is not evidence that something did not happen; only evidence rules a cause out.</li>
</ul>

function svgToPng(svg) {
  return new Promise((res, rej) => {
    const m = svg.match(/width="(\d+)" height="(\d+)"/), w = +m[1], h = +m[2], k = Math.min(2, 9000 / w, 9000 / h), img = new Image();
    img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k); const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? b.arrayBuffer().then(ab => res({ blob: b, bytes: new Uint8Array(ab), w: cv.width, h: cv.height })) : rej(new Error('png')), 'image/png'); } catch (e) { rej(e); } };
    img.onerror = () => rej(new Error('svg')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

/* ---------- AI drafts (own AI key, KitAI): RCA-1 hypotheses under a gate, RCA-2 tests for open hypotheses ----------
   Every suggestion is reviewed in a dialog before it is added. New events are 'unverified' and carry aiDraft.
   AI never sets probabilities: those come from the data library or site data. */
const RAI = (() => {
  const on = () => !!window.KitAI;
  const str = (v, n) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n || 300);
  const arr = v => Array.isArray(v) ? v : [];
  const RULES = ['Use only the information given. Do not invent facts, names or numbers. Do not give probabilities.',
    'Write plain English in short sentences that a Grade 12 reader working in a second language can follow. Use metric units.',
    'Answer with one JSON object only, no other text.'];
  const head = () => { const m = S.c.meta || {}; return ['INCIDENT', `Title: ${str(m.title, 200)}`, m.description ? `Description: ${str(m.description, 3000)}` : ''].filter(Boolean); };
  const line = n => `${n.code} [${E.isGate(n) ? n.gate + ' gate' : E.KINDS[n.kind]}, ${E.STATUS[n.status] ? E.STATUS[n.status].name : n.status}] ${str(n.label, 200) || '(no description)'}${n.evidence ? ' | evidence: ' + str(n.evidence, 200) : ''}`;
  function treeLines() { return E.walk(S.c).map(({ n, depth }) => '  '.repeat(depth) + '- ' + line(n)); }
  function dialog(title, intro, body, okLabel, onOk) {
    if (!document.getElementById('rai-css')) { const s = document.createElement('style'); s.id = 'rai-css'; s.textContent = '.rai-bg{position:fixed;inset:0;background:rgba(10,18,30,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}.rai{background:var(--surface,#fff);color:var(--ink,#111);border-radius:10px;padding:18px 20px;width:min(720px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.rai-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line,#ddd);font-size:.9rem}.rai-item input{margin-top:3px}'; document.head.appendChild(s); }
    const el = document.createElement('div'); el.className = 'rai-bg'; el.id = 'rai-modal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="rai"><h3>${esc(title)}</h3><p class="small muted">${intro}</p><div>${body}</div><div class="row"><span style="flex:1"></span><button class="btn" type="button" data-rx>Discard</button><button class="btn primary" type="button" data-rok>${esc(okLabel)}</button></div></div>`;
    el.querySelector('[data-rx]').onclick = () => el.remove();
    el.querySelector('[data-rok]').onclick = () => { const pick = new Set(Array.from(el.querySelectorAll('input[data-i]:checked')).map(x => +x.dataset.i)); if (!pick.size) { toast('Tick at least one item, or press Discard.'); return; } onOk(pick); el.remove(); };
    document.body.appendChild(el);
  }
  const item = (i, html) => `<label class="rai-item"><input type="checkbox" data-i="${i}" checked><span>${html}</span></label>`;
  async function ask(prompt) { const t = (await KitAI.sample(prompt)).text; const m = String(t).match(/```(?:json)?\s*([\s\S]*?)```/); const s = m ? m[1] : t; const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a < 0 || b <= a) throw new Error('No JSON in the answer'); return JSON.parse(s.slice(a, b + 1)); }
  async function run(fn) {
    if (!on() || S.aiBusy) return; S.aiBusy = true; toast('Asking the AI… this can take a minute.');
    try { await fn(); } catch (e) { if (!(e && e.code === 'cancelled')) toast((e && e.userMessage) || ('The answer could not be read' + (e && e.message ? ' (' + e.message + ')' : '') + '. Try again.')); }
    S.aiBusy = false;
  }
  function hypotheses(gid) { return run(async () => {
    const g = node(gid); if (!g || !E.isGate(g)) return;
    const path = []; let p = g; while (p) { path.unshift(p); p = E.parentOf(S.c, p.id); }
    const a = await ask(['You are an experienced incident investigator who builds root cause fault trees. Suggest the possible causes (hypotheses) that could lead to the selected event.', '', ...head(), '',
      'WHOLE TREE SO FAR', ...treeLines(), '', 'SELECTED EVENT', ...path.map((n, i) => '  '.repeat(i) + line(n)), '',
      'EXISTING INPUTS OF THE SELECTED EVENT (do not repeat them)', ...(E.kids(S.c, g).map(k => '- ' + line(k)).concat(['(end)'])), '',
      'WHAT TO PRODUCE', 'hypotheses: 3 to 8 possible direct causes of the selected event, each one short and specific. kind: "basic" for a cause that need not be broken down further, "gate" for one that will need its own causes, "undeveloped" for one outside the scope. test: how to confirm or rule it out. Cover equipment, people, procedures and the work environment where they fit.',
      'gate: "OR" if any one input alone could cause the event, "AND" if inputs must happen together.', ...RULES,
      'JSON shape: {"gate":"OR","hypotheses":[{"label":"","kind":"basic","test":""}]}'].join('\n'));
    const hs = arr(a.hypotheses).map(h => ({ label: str(h && h.label, 300), kind: ['basic', 'gate', 'undeveloped'].indexOf(h && h.kind) >= 0 ? h.kind : 'basic', test: str(h && h.test, 400) })).filter(h => h.label).slice(0, 12);
    if (!hs.length) throw new Error('No hypotheses in the answer');
    const gate = a.gate === 'AND' || a.gate === 'OR' ? a.gate : '';
    dialog('Suggested hypotheses for ' + g.code, `Suggested by the AI. Untick anything that does not fit. Each one is added as <b>unverified</b> until evidence confirms or rules it out.${gate && gate !== g.gate ? ` The AI suggests an <b>${gate}</b> gate here; the gate is ${esc(g.gate)} now and is not changed.` : ''}`,
      hs.map((h, i) => item(i, `<b>${esc(h.label)}</b> <span class="small muted">(${esc(h.kind === 'gate' ? 'needs its own causes' : E.KINDS[h.kind])})</span>${h.test ? `<br><span class="small">Test: ${esc(h.test)}</span>` : ''}`)).join(''), 'Add selected', pick => {
        pushUndo(); hs.forEach((h, i) => { if (!pick.has(i)) return; const k = h.kind === 'gate' ? 'gate' : h.kind; const n = mkNode(k, nextCode(k), h.label); n.test = h.test; n.aiDraft = true; S.c.nodes[n.id] = n; g.children.push(n.id); });
        g.collapsed = false; changed(); render(); toast(pick.size + ' hypothesis(es) added as unverified.'); });
  }); }
  function tests() { return run(async () => {
    const open = Object.values(S.c.nodes).filter(n => n.id !== S.c.root && (n.status === 'unverified' || n.status === 'likely'));
    if (!open.length) { toast('There are no unverified or likely hypotheses to test.'); return; }
    const a = await ask(['You are an experienced incident investigator. For each open hypothesis below, say how to test it: the evidence that would confirm it and the evidence that would rule it out.', '', ...head(), '',
      'WHOLE TREE', ...treeLines(), '', 'OPEN HYPOTHESES', ...open.slice(0, 60).map(n => '- ' + line(n) + (n.test ? ' | current test: ' + str(n.test, 200) : '')), '',
      'WHAT TO PRODUCE', 'tests: one entry per open hypothesis, by its code: test (the practical check, inspection, record, interview or measurement, written as an instruction), confirm (what result would confirm it), ruleout (what result would rule it out).', ...RULES,
      'JSON shape: {"tests":[{"code":"E-01","test":"","confirm":"","ruleout":""}]}'].join('\n'));
    const byCode = {}; open.forEach(n => { byCode[n.code] = n; });
    const ts = arr(a.tests).map(t => ({ n: byCode[t && t.code], test: str(t && t.test, 400), confirm: str(t && t.confirm, 300), ruleout: str(t && t.ruleout, 300) })).filter(t => t.n && t.test);
    if (!ts.length) throw new Error('No tests for these hypotheses in the answer');
    dialog('Suggested tests', 'Suggested by the AI. Ticked tests are written into the "How to test it" column. A test you already wrote is replaced only if you leave it ticked.',
      ts.map((t, i) => item(i, `<b>${esc(t.n.code)}</b> ${esc(t.n.label)}<br>${esc(t.test)}${t.confirm ? `<br><span class="small">Confirms: ${esc(t.confirm)}</span>` : ''}${t.ruleout ? `<br><span class="small">Rules out: ${esc(t.ruleout)}</span>` : ''}${t.n.test ? `<br><span class="small muted">Replaces: ${esc(t.n.test)}</span>` : ''}`)).join(''), 'Use selected tests', pick => {
        pushUndo(); ts.forEach((t, i) => { if (!pick.has(i)) return; t.n.test = t.test + (t.confirm ? ' Confirms if: ' + t.confirm : '') + (t.ruleout ? ' Rules out if: ' + t.ruleout : ''); });
        changed(); render(); toast(pick.size + ' test(s) written.'); });
  }); }
  const btn = (act, label, tip, extra) => on() ? `<button class="btn sm" data-act="${act}"${extra || ''} title="${esc(tip)}"${S.aiBusy ? ' disabled' : ''}>&#10022; ${esc(label)}</button>` : '';
  return { on, hypotheses, tests, btn };
})();
Object.assign(A, { aiHyp: () => RAI.hypotheses(S.sel), aiTests: () => RAI.tests(), aiSettings: () => window.KitAI && KitAI.settings() });

let armed = null;
document.addEventListener('focusin', ev => { const t = ev.target; if (t.matches('[data-nf],[data-hf],[data-af],[data-meta],[data-lib],[data-cl]') && armed !== t) { pushUndo(); armed = t; } });
document.addEventListener('focusout', () => { armed = null; });
function nodeField(n, k, v, live) {
  if (k === 'src') { setProbSource(n, v); return 'full'; }
  if (k === 'item') { pickItem(n, v); return 'full'; }
  if (k === 'value') { const num = v.trim() === '' ? null : +v.replace(',', '.'); n.prob.value = (num == null || isNaN(num)) ? (v.trim() === '' ? null : n.prob.value) : num; const it = E.libItem(S.c, n.prob.item); n.prob.edited = !!it && n.prob.value != null && +n.prob.value !== it.value; return live ? 'tree' : 'full'; }
  if (k === 'unit') { n.prob.unit = v; return 'full'; }
  if (k === 'pnote') { n.prob.note = v; return 'none'; }
  if (k === 'k') { n.k = Math.max(1, parseInt(v, 10) || 1); return 'full'; }
  if (k === 'kind' || k === 'gate' || k === 'cause') { n[k] = v; if (k === 'kind' && v === 'house' && n.prob.src === 'none') { n.prob.src = 'manual'; n.prob.value = 1; } return 'full'; }
  n[k] = v; return (k === 'label' || k === 'code') ? 'tree' : (k === 'category' ? 'tree' : 'none');
}
document.addEventListener('input', ev => {
  const t = ev.target; if (!S.c) return;
  if (t.dataset.nf && t.tagName !== 'SELECT') { const r = nodeField(node(S.sel), t.dataset.nf, t.value, true); changed(); if (r !== 'none') { renderTree(); refreshTopcard(); renderTabs(); } return; }
  if (t.dataset.meta && t.tagName !== 'SELECT') { S.c.meta[t.dataset.meta] = t.value; changed(); return; }
  const tr = t.closest('tr');
  if (t.dataset.hf && t.tagName !== 'SELECT') { node(tr.dataset.nid)[t.dataset.hf] = t.value; changed(); return; }
  if (t.dataset.af && t.tagName !== 'SELECT') { S.c.actions[+tr.dataset.ai][t.dataset.af] = t.value; changed(); return; }
  if (t.dataset.cl && t.tagName !== 'SELECT') { const it = S.c.customLib[+tr.dataset.ci]; it[t.dataset.cl] = t.dataset.cl === 'value' ? (isNaN(+t.value) ? it.value : +t.value) : t.value; if (t.dataset.cl === 'value') Object.values(S.c.nodes).forEach(n => { if (n.prob.item === it.id && !n.prob.edited) n.prob.value = it.value; }); changed(); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target; if (!S.c) return;
  if (t.dataset.actChange === 'move') { if (t.value) moveBranch(S.sel, t.value); return; }
  if (t.dataset.nf) { const r = nodeField(node(S.sel), t.dataset.nf, t.value, false); changed(); if (r === 'full' || t.dataset.nf === 'value') { renderTree(); renderInspector(); refreshTopcard(); renderTabs(); } return; }
  if (t.dataset.meta) { S.c.meta[t.dataset.meta] = t.value; changed(); return; }
  const tr = t.closest('tr');
  if (t.dataset.hf) { node(tr.dataset.nid)[t.dataset.hf] = t.value; changed(); if (t.dataset.hf === 'status') render(); return; }
  if (t.dataset.af) { S.c.actions[+tr.dataset.ai][t.dataset.af] = t.value; changed(); if (t.dataset.af === 'target') render(); return; }
  if (t.dataset.lib) { setOverride(t.dataset.lib, t.value.trim() === '' ? null : t.value.replace(',', '.')); render(); return; }
  if (t.dataset.cl) { const it = S.c.customLib[+tr.dataset.ci]; if (t.dataset.cl === 'unit') { it.unit = t.value; changed(); } return; }
});
document.addEventListener('keydown', ev => {
  if (S.tab !== 'tree') return;
  const inField = ev.target.closest && ev.target.closest('input,textarea,select');
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'z' && !inField) { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); if (S.link.handle && S.link.perm === 'granted') writeFile(); else saveAs(); }
  if (!inField && (ev.key === 'Delete' || ev.key === 'Backspace') && S.sel && S.sel !== S.c.root) { ev.preventDefault(); A.del(); }
  if (ev.key === 'Escape' && S.menu) { S.menu = false; renderTop(); }
});
window.addEventListener('pagehide', () => { if (S.c) LS.set('rcaft.case.' + S.c.id, S.c); });
window.TBRCA = { S, E, X, load, newCase, exampleCase, addChild, removeBranch, issues: () => issues(), post: () => post(), render, setOverride, fileText };

/* ---------- boot ---------- */
(async function boot() {
  const hash = location.hash || '';
  let c = null;
  if (hash.startsWith('#case-')) c = LS.get('rcaft.case.' + hash.slice(6));
  if (!c) { const last = LS.get('rcaft.last'); if (last) c = LS.get('rcaft.case.' + last); }
  load(c || exampleCase());
  if (hash === '#handoff') { const h = await KIT.KitHandoff.take('rcaft'); if (h && h.handle) { S.handoff = h; renderTop(); } }
})();
})();
</script>
