<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Tripod Beta Investigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: investigation workbench. Slim brand bar, stage tabs, full-bleed tree canvas between a palette rail and an inspector.
   Tripod symbol colours (red Event, striped Agent, green Object, grey/blue/yellow causation) are fixed method colours, the same in both themes. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #142132; --muted: #5a6779; --line: #d3dae2;
  --accent: #1d4ea3; --accent-ink: #ffffff; --accent-soft: #e3ebf8;
  --err: #b42318; --err-soft: #fdecea; --warn: #9a5b00; --warn-soft: #fff3dc; --tip: #276a8a; --tip-soft: #e4f1f7; --ok: #20734a; --ok-soft: #e3f4ea;
  --canvas: #f9fafb; --grid: #dfe5ec; --edge: #3c4654; --brand: #0f2a4d;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;
  --canvas: #111922; --grid: #222e3c; --edge: #b6c2d1; --brand: #0a1d36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #161f2a; --surface-2: #1c2633; --ink: #e3e9f0; --muted: #96a3b4; --line: #2b3746;
  --accent: #82a8ff; --accent-ink: #0b1220; --accent-soft: #1d2c47;
  --err: #ff8a80; --err-soft: #3a1d1d; --warn: #f5b74e; --warn-soft: #362a14; --tip: #7cc4e4; --tip-soft: #15303c; --ok: #6fd39c; --ok-soft: #14301f;
  --canvas: #111922; --grid: #222e3c; --edge: #b6c2d1; --brand: #0a1d36; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); margin: 0; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .09em; font-size: .8rem; color: var(--muted); font-weight: 600; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.top { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .co { font-family: var(--f-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; color: #9fc0ff; white-space: nowrap; }
.brand .app { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; white-space: nowrap; }
.top .case-name { flex: 1 1 200px; min-width: 0; font-size: .92rem; color: #d6e2f5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .pill { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.22); }
.top .pill.off { color: #ffd38f; } .top .pill.live { color: #8fe3b4; }
.top .btn.ghost { color: #fff; border-color: rgba(255,255,255,.3); }
.top .btn.ghost:hover { background: rgba(255,255,255,.1); }

.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 10px 12px 9px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: .72rem; font-weight: 600; font-family: var(--f-mono); }
.count.err { background: var(--err); color: #fff; } .count.warn { background: var(--warn); color: #fff; } .count.ok { background: var(--ok); color: #fff; }

main { flex: 1; min-height: 0; }
.page { max-width: 1180px; margin: 0 auto; padding-block: 22px 60px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: .9rem; line-height: 1.3; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); border-color: var(--err); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.panel > h2, .panel > h3 { margin-bottom: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--ok); } .pill.off { color: var(--warn); }
.st-Draft { color: var(--muted); } .st-In-review { color: var(--warn); } .st-Final { color: var(--ok); }

.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 16px; font-size: .9rem; border-bottom: 1px solid var(--line); }
.banner.warn { background: var(--warn-soft); color: var(--ink); }
.banner.info { background: var(--tip-soft); }
.banner.err { background: var(--err-soft); }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], input[type=search], input:not([type]), select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 6px 8px; min-width: 0; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[readonly], textarea[readonly], select:disabled { background: var(--surface-2); color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: .9rem; }

/* case list */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.case-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.case-card h3 { font-size: 1.15rem; overflow-wrap: anywhere; }
.case-card .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.case-card .row { margin-top: auto; padding-top: 6px; }
.case-card.example { border-style: dashed; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 26px; text-align: center; color: var(--muted); }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--err-soft); padding: 6px 8px; border-radius: 5px; font-size: .85rem; }

/* tree workbench */
.bench { display: grid; grid-template-columns: 188px minmax(0, 1fr) 330px; height: calc(100vh - 96px); min-height: 520px; }
.palette { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.pal-group { display: flex; flex-direction: column; gap: 5px; }
.pal-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--surface); cursor: grab; text-align: left; font-size: .84rem; }
.pal-item:hover { border-color: var(--accent); }
.pal-item svg { flex: 0 0 auto; }
.stage-card { border-left: 3px solid var(--accent); padding: 2px 0 2px 8px; font-size: .8rem; color: var(--muted); }

.canvas-wrap { position: relative; min-width: 0; background: var(--canvas); overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; }
#cv.panning { cursor: grabbing; }
.toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.toolbar .grp { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.toolbar .grp .btn { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.toolbar .grp .btn:last-child { border-right: 0; }
.zoomlbl { font-family: var(--f-mono); font-size: .78rem; padding: 6px 8px; color: var(--muted); min-width: 52px; text-align: center; }
.hint { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: .78rem; color: var(--muted); pointer-events: none; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.edge.probable { stroke-dasharray: 2 4; stroke-linecap: round; stroke-width: 2; }
.edge.note { stroke-dasharray: 5 4; stroke-width: 1; opacity: .7; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge-sel { stroke: var(--accent) !important; stroke-width: 3; }
.node { cursor: move; }
.node .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 3; display: none; }
.node.sel .sel-ring { display: block; }
.node .port { fill: var(--surface); stroke: var(--accent); stroke-width: 2; cursor: crosshair; opacity: 0; transition: opacity .12s; }
.node:hover .port, .node.sel .port { opacity: 1; }
.node.hl .sel-ring { display: block; stroke: var(--warn); }
.ghost-link { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; pointer-events: none; }
.band { fill: none; stroke: var(--accent); stroke-dasharray: 4 3; fill-opacity: .06; }
.lane-label { font: 600 11px var(--f-display); letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }

.inspector { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.inspector h3 { display: flex; align-items: center; gap: 8px; }
.sym { flex: 0 0 auto; }
.links { display: flex; flex-direction: column; gap: 4px; }
.link-row { display: flex; gap: 6px; align-items: center; font-size: .84rem; padding: 3px 6px; background: var(--surface-2); border-radius: 4px; }
.link-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row .dir { flex: 0 0 auto; font-family: var(--f-mono); color: var(--muted); font-size: .75rem; }
.xbtn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 1rem; line-height: 1; }
.xbtn:hover { color: var(--err); }
.coach { background: var(--tip-soft); border-radius: 6px; padding: 10px 12px; font-size: .86rem; display: flex; flex-direction: column; gap: 6px; }
.coach ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.coach .ref { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }

/* issues */
.issues { display: flex; flex-direction: column; gap: 6px; }
.issue { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); }
.issue .sev { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; padding-top: 2px; }
.issue.error .sev { color: var(--err); } .issue.warning .sev { color: var(--warn); } .issue.tip .sev { color: var(--tip); }
.issue.error { border-left: 4px solid var(--err); } .issue.warning { border-left: 4px solid var(--warn); } .issue.tip { border-left: 4px solid var(--tip); }
.issue .ref { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.allclear { background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 10px 12px; font-weight: 500; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td textarea { min-height: 54px; }
.tbl td select { min-width: 104px; }
.tbl td input[type=date] { min-width: 136px; }
.tbl td input { min-width: 120px; }
.smart { display: flex; gap: 2px; }
.smart label { display: inline-flex; flex-direction: column; align-items: center; font-family: var(--f-mono); font-size: .72rem; gap: 1px; cursor: pointer; }
.tgt { font-size: .8rem; }

/* BRF chart */
.chart-row { display: grid; grid-template-columns: 210px minmax(0, 1fr) 34px; gap: 10px; align-items: center; padding: 3px 0; font-size: .88rem; }
.chart-row .bar { height: 16px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.chart-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chart-row .code { font-family: var(--f-mono); font-weight: 500; display: inline-block; width: 28px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.stat b { display: block; font-family: var(--f-display); font-size: 1.8rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

/* report preview */
.rpt-frame { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 8px; padding: 0; overflow: hidden; }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.sym-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sym-row:last-child { border-bottom: 0; }
dl.gl { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; }
dl.gl dt { font-weight: 600; } dl.gl dd { margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: .9rem; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,18,30,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

/* evidence plan */
.ev-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ev-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 12px; border-radius: 6px; font-size: .9rem; }
.ev-status:empty { display: none; }
.ev-status.busy { background: var(--tip-soft); } .ev-status.err { background: var(--err-soft); } .ev-status.ok { background: var(--ok-soft); }
.spin { width: 14px; height: 14px; border: 2px solid var(--tip); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.tbl tr.urgent td:first-child { box-shadow: inset 3px 0 0 var(--err); }
.tbl td.num { font-family: var(--f-mono); color: var(--muted); white-space: nowrap; }
.tbl td .xbtn + .xbtn { margin-left: 2px; }
.ev-note { white-space: pre-wrap; }
.pill.urgent { color: var(--err); }

@media (max-width: 1100px) { .bench { grid-template-columns: 170px minmax(0, 1fr) 290px; } }
@media (max-width: 860px) {
  .bench { grid-template-columns: 1fr; height: auto; }
  .palette { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px 16px; }
  .pal-group { flex-direction: row; } .pal-group .eyebrow, .stage-card { display: none; }
  .pal-item { white-space: nowrap; }
  .canvas-wrap { height: 62vh; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
  .chart-row { grid-template-columns: 120px minmax(0, 1fr) 28px; }
  .issue { grid-template-columns: minmax(0, 1fr) auto; } .issue .sev { grid-column: 1 / -1; }
  .top { padding: 8px 16px; } .brand .co { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .top, .tabs, .banner, .no-print { display: none !important; } }

<script>/* Incident Investigation Toolkit — shared offline helpers (Istec Training).
   Inlined into every tool and the START HERE dashboard at build time.

   KitStore    tiny IndexedDB key/value store (db "iikit", store "kv"), shared by every page opened from file://
   FileLink    save to / open from a real file on the USB stick (File System Access API in Chrome/Edge),
               remembers file handles so later saves write straight to the file; download / file-input fallback
   KitRegistry list of investigations known on this computer (localStorage "iikit.registry"), shown on the dashboard
   KitHandoff  dashboard -> tool: "open this file" (passes a file handle through IndexedDB)

   Chrome and Edge give all file:// pages one shared storage area, which is what makes the registry and the hand-off
   work. Firefox/Safari keep storage per file, so there the tools still work but the dashboard only sees the folder. */
var KIT = (function () {
  'use strict';
  const VERSION = '1.0';
  const hasFSA = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  const hasDirPicker = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB key/value ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; rej(new Error('IndexedDB timeout')); } }, 4000);
      try {
        const r = indexedDB.open('iikit', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { if (!done) { done = true; clearTimeout(t); res(r.result); } };
        r.onerror = () => { if (!done) { done = true; clearTimeout(t); rej(r.error); } };
      } catch (e) { done = true; clearTimeout(t); rej(e); }
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  const KitStore = {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },

/* KitTips: hover tips with a 0.4 s delay for every element that has a title (or data-tip).
   The title moves to data-tip on first hover, so the browser's own slow tip does not also appear;
   icon-only controls keep an aria-label. On touch screens a long press (0.5 s) shows the tip. */

    if (tip) return tip;
    const s = document.createElement('style');
    s.textContent = '.kit-tip{position:fixed;z-index:2147483000;max-width:320px;padding:6px 9px;border-radius:6px;background:#1f252c;color:#fff;font:12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .12s}.kit-tip.on{opacity:1}@media print{.kit-tip{display:none}}';

    const w = b.offsetWidth, h = b.offsetHeight, vw = innerWidth;
    let y = r.bottom + 6; if (y + h > innerHeight - 4) y = Math.max(4, r.top - h - 6);
    b.style.left = Math.max(4, Math.min(vw - w - 4, r.left + r.width / 2 - w / 2)) + 'px'; b.style.top = y + 'px';
  }
  function hide() { clearTimeout(timer); cur = null; if (tip) tip.classList.remove('on'); }
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const t = target(e.target); if (t === cur) return;
    hide(); if (!t) return; cur = t; timer = setTimeout(() => { if (cur === t && t.isConnected) show(t); }, DELAY);
  }, true);
  document.addEventListener('pointerout', e => { if (cur && !cur.contains(e.relatedTarget)) hide(); }, true);
  document.addEventListener('pointerdown', e => {
    hide();

})();

window.TOOL_MANUAL = {"title":"Tripod Beta Investigator · User manual","html":"\n<h1 id=\"start\">Tripod Beta Investigator: user manual</h1>\n<p>Version 1.5.1 (25 Nov 2026). This manual explains how to use the Tripod Beta Investigator, screen by screen. The pictures use the training case <b>TB-EX-09</b>: a contractor worker drowned at an overflowing return-water dam. The method terms are those of the Tripod Beta User Guide (Stichting Tripod Foundation / Energy Institute). The <span class=\"ui\">Method guide</span> tab in the tool summarises the method itself.</p>\n\n<h2 id=\"about\">1. What the tool is for</h2>\n<p>Tripod Beta is an incident analysis method. You build a <b>tree</b> that answers three questions, in this order:</p>\n<table>\n  <tr><th>Stage</th><th>Question</th><th>What you add to the tree</th></tr>\n  <tr><td>1</td><td>What happened?</td><td>The core diagram: <b>trios</b> of Agent of Change, Object and Event</td></tr>\n  <tr><td>2</td><td>How did it happen?</td><td><b>Barriers</b> on the lines into each Event: Failed, Missing, Inadequate or Effective</td></tr>\n  <tr><td>3</td><td>Why did it happen?</td><td>For each Failed Barrier: <b>Immediate Cause → Precondition → Underlying Cause</b></td></tr>\n</table>\n<p>The tool checks your tree against the Tripod Beta tree rules while you work, helps you write SMART actions, draws the Basic Risk Factor (BRF) profile and writes the report.</p>\n<div class=\"tip\"><b>Key terms.</b> An <b>Agent of Change</b> is anything that can change or harm something (energy, water, a moving vehicle). An <b>Object</b> is what was harmed or changed (a person, equipment, the environment). An <b>Event</b> is the unwanted happening when the Agent acts on the Object. A <b>Barrier</b> is a measure that should stop that from happening. A <b>trio</b> is one Agent, one Object and one Event together.</div>\n\n<h2 id=\"getting-started\">2. Getting started</h2>\n<h3>Where it runs</h3>\n<ul>\n  <li><b>USB stick:</b> open <span class=\"ui\">START HERE.html</span>, then <span class=\"ui\">Tripod Beta Investigator</span> (Chrome or Edge).</li>\n  <li><b>Student website:</b> any modern browser, also on a tablet.</li>\n  <li><b>claude.ai:</b> a team version where cases are shared.</li>\n</ul>\n<h3>The Cases tab</h3>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAAVAAAAAUclRSQwAAAWQAAAAoZ1RSQwAAAWQAAAAoYlRSQwAAAWQAAAAoY3BydAAAAYwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAAAIAAAAHABzAFIARwBCWFlaIAAAAAAAAG+iAAA49QAAA5BYWVogAAAAAAAAYpkAALeFAAAY2lhZWiAAAAAAAAAkoAAAD4QAALbPWFlaIAAAAAAAAPbWAAEAAAAA0y1wYXJhAAAAAAAEAAAAAmZmAADypwAADVkAABPQAAAKWwAAAAAAAAAAbWx1YwAAAAAAAAABAAAADGVuVVMAAAAgAAAAHABHAG8AbwBnAGwAZQAgAEkAbgBjAC4AIAAyADAAMQA2/8AAEQgCDQM0AwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMACgoKCgoKEQoKERkREREZIRkZGRkhKiEhISEhKjMqKioqKiozMzMzMzMzMz09PT09PUdHR0dHUFBQUFBQUFBQUP/bAEMBDA0NFBMUIxMTI1M5LjlTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU//dAAQANP/aAAwDAQACEQMRAD8A83ooq1FZXU+wwxs/mEhcDqR1/Ku85CrRVz+z73yWu an> opens a <code>.tripod.json</code> file, for example from the <span class=\"ui\">Examples</span> folder or <span class=\"ui\">My cases</span> on the stick.</li>\n  <li>Training cases open read only. Click <span class=\"ui\">Make a practice copy</span> to work on your own copy.</li>\n  <li><span class=\"ui\">Duplicate</span> copies a case, and <span class=\"ui\">Delete</span> removes it (you are asked to confirm).</li>\n</ol>\n<h3 id=\"saving\">Saving your work</h3>\n<p>The tool keeps cases in the browser on this computer. On the USB stick, save each case to a file:</p>\n<ol>\n  <li>Open the case and click <span class=\"ui\">Save to file…</span> in the top bar. Choose the <span class=\"ui\">My cases</span> folder.</li>\n  <li>From then on every change is written to the file, and the top bar shows <span class=\"ui\">Saved to …</span>.</li>\n  <li>After a restart the browser may ask again: click <span class=\"ui\">Reconnect file</span>.</li>\n  <li>On a phone, tablet, Safari or Firefox, use <span class=\"ui\">Report</span> › <span class=\"ui\">Case file (.json)</span> to keep a copy, and <span class=\"ui\">Open case file…</span> to load it.</li>\n</ol>\n<p><b>Help in the tool:</b> rest the mouse on a button for a tip (press and hold on a tablet). <span class=\"ui\">Coach on</span> on the tree shows the rules and questions for the element you select. <span class=\"ui\">User manual</span> in the top bar opens this manual.</p>\n\n<h2 id=\"incident\">3. Incident tab</h2>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAADNKADAAQAAAABAAACDQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IB2ElDQ19QUk9GSUxFAAEBAAAByAAAAAAEMAAAbW50clJHQiBYWVogB+AAAQABAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAAkclhZWgAAARQAAAAUZ1hZWgAAASgAAAAUYlhZWgAAATwAAAAUd3RwdAAAA ter shows open rule problems.</li>\n  <li><b>Inspector (right):</b> shows the selected element: its label, notes, evidence, links and quick-add buttons. With nothing selected it shows the tree overview.</li>\n</ul>\n<h3>Connecting elements</h3>\n<ol>\n  <li>Point at an element: small circles (ports) appear on its edge.</li>\n  <li>Drag from a port to the element it leads to, and let go. The line follows time: left to right, towards the Event.</li>\n  <li>Click a line to select it. Press <kbd>Delete</kbd> or use <span class=\"ui\">Remove link</span> to delete it.</li>\n</ol>\n<p>You can also use the <b>Preceding</b> and <b>Following</b> pickers in the inspector. The tool routes links the Tripod way: for example a Precondition links to a Failed Barrier through its Immediate Cause.</p>\n\n<h3 id=\"stage-1\">Stage 1: What happened? (core diagram)</h3>\n<ol>\n  <li>Start with the <b>main Event</b>: the reason for the investigation.</li>\n  <li>Add the <b>Object</b> it changed and the <b>Agent of Change</b> that changed it. Link both to the Event.</li>\n  <li>Look for earlier and later happenings. Select an Event and use <span class=\"ui\">Add prior trio (makes this an Event-Agent)</span>, <span class=\"ui\">Add prior trio (makes this an Event-Object)</span> or <span class=\"ui\">Add subsequent event</span>.</li>\n  <li>Most incidents need 2 to 5 trios.</li>\n</ol>\n<div class=\"ex\"><b>Example (TB-EX-09):</b> Agent \"Deep, moving water between the boat and the bank\" acts on Event-Object \"Workers leave the boat and enter the water\", giving the main Event \"One worker drowns; the other reaches the bank\".</div>\n<div class=\"tip\">Check each trio: does the Event describe a happening to the Object? Does the Object describe the item <i>before</i> it changed? Could the Agent really change the Object to the state in the Event?</div>\n\n<h3 id=\"stage-2\">Stage 2: How did it happen? (barriers)</h3>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARX 1ZtrK3s4vIt12oe2Sf51cooAzl0uxRIY1jG2A7kGTwfz5/GoV0PTVKusWCp3L8zcHrxz+la9FAWOestAtosyXSh5A7MCC2OTkcZxRFoFs08814okMkpdeSMD0OCK6ClouFjLm0fT7ibz5YsucZIJGcdMgEZqR9Msn87fHn7QAJOTzt6d+Me1aFFAGVLo2nzlGkiBKKEHJHyjoDg8/jTrjSNPunEk8QYqu0ckfL6cEVp0U7gUBptmghVEwLc5j5PGev1/Gr46UUUgCiiigAooooAKKKKAM28/1o+lVat3YJkGPSqu1vSmI//9L17zGrFuNMt59Ui1Zy3mxDaoB+Xv1GPf1rXqFu3+e9XEllouRxSeY1NPWkqCkP8xqPMamUUAP8xqPMamUUAP8AMajzGplFAD/MajzGplFAD/MajzGplFAD/MajzGplFAD/ADGo8xqZRQA/zGo8xqZRQA/zGo8xqZRQA/zGo8xqZRQA/wAxqPMamUUwGuA53GmeWtSGkpiP/9k=\" alt=\"\"><figcaption>The palette. The barrier symbols are in the middle group.</figcaption></figure>\n<ol>\n  <li>Barriers go <b>on the lines</b> into an Event. A barrier that controls the Agent goes on the Agent-to-Event line. A barrier that protects the Object goes on the Object-to-Event line.</li>\n  <li>Link the Agent or Object to the Event with a simple connector first. To insert a barrier, <b>drag any barrier from the palette and drop it on the connector</b>. The barrier replaces that connector and is joined to the elements at both ends. You can also select a line and click <span class=\"ui\">Insert Failed Barrier</span>.</li>\n  <li>To add more barriers on the same trajectory, drop the next barrier onto a connector between barriers. It goes into the chain at that point, in line with the others.</li>\n  <li>To move a barrier to another line, drag it onto that connector. Its old chain closes up behind it, and its Immediate Cause stays linked.</li>\n  <li>If you delete a barrier, the chain heals itself: the elements before and after it are joined again. This also works when you delete several barriers in a row.</li>\n  <li>With an Event selected, <span class=\"ui\">Barrier on Agent side</span> and <span class=\"ui\">Barrier on Object side</span> add one in the right place.</li>\n  <li>Start with every barrier as <b>Failed</b>. Change the type in the inspector as facts come in.</li>\n</ol>\n<table>\n  <tr><th>Barrier</th><th>Meaning</th><th>What it needs</th></tr>\n  <tr><td>Failed</td><td>In place, but made ineffective by an Immediate Cause</td><td>Exactly one Immediate Cause</td></tr>\n  <tr><td>Missing</td><td>Reasonably expected, but never put in place, and nobody can be identified who should have done it</td><td>One or more Underlying Causes, directly</td></tr>\n  <tr><td>Inadequate</td><td>In place and in good condition, but not able to do its job</td><td>One or more Underlying Causes, directly</td></tr>\n  <tr><td>Effective</td><td>Worked: stopped further harm</td><td>Nothing; the Event becomes a Potential Event</td></tr>\n</table>\n<div class=\"warn\">Missing and Inadequate Barriers are rare. If someone removed a barrier, or you can say who should have provided it, it is a <b>Failed</b> Barrier: the human error is its Immediate Cause.</div>\n\n<h3 id=\"stage-3\">Stage 3: Why did it happen? (causation path)</h3>\n<ol>\n  <li>Select a Failed Barrier and click <span class=\"ui\">Add Immediate Cause</span>. Word it as the opposite of the barrier: barrier \"Use of life jacket\", Immediate Cause \"Worker does not wear a life jacket\".</li>\n  <li>Classify the <b>error type</b> of the Immediate Cause (slip, lapse, mistake or violation). The coach then lists the Preconditions that usually go with it.</li>\n  <li>Click <span class=\"ui\">Add Precondition</span>: the state of mind or situation that made the act seem normal or acceptable at the time.</li>\n  <li>Click <span class=\"ui\">Add Underlying Cause</span>: the organisational weakness that created the Precondition. Give it a <b>Basic Risk Factor</b> (BRF), for example PR Procedures, TR Training, OR Organisation.</li>\n  <li>One Underlying Cause can feed several Preconditions. Link it again rather than writing it twice.</li>\n</ol>\n\n<h2 id=\"checks\">6. Rules check</h2>\n<p>The Rules check tab tests your tree live against the Tripod Beta tree rules and quality tips. The number on the tab is the count of open errors and warnings.</p>\n<figure><img src=\"data <tr><td>I cannot edit the training case</td><td>It is read only. Click <span class=\"ui\">Make a practice copy</span>.</td></tr>\n  <tr><td>The tree is messy</td><td>Click <span class=\"ui\">Tidy layout</span>, then <span class=\"ui\">Fit</span>. Undo puts it back.</td></tr>\n  <tr><td>My case is missing on another computer</td><td>Use <span class=\"ui\">Open case file…</span> and choose the file in <span class=\"ui\">My cases</span>.</td></tr>\n  <tr><td>AI says the key was not accepted</td><td>Open <span class=\"ui\">AI settings</span>, paste the key again and click <span class=\"ui\">Test connection</span>.</td></tr>\n</table>\n"};

<script>/* Tripod Beta Investigator — method content.
   Source: Tripod Beta User Guide 02a (Stichting Tripod Foundation / Energy Institute),
   Annex 1 (glossary), 2 (quality tips), 3 (error types), 4 (BRFs), 5 (symbols), 6 (tree rules), 8 (worked example).
   Terminology: current User Guide terms only (Agent of Change / Object / Event; Immediate Cause → Precondition → Underlying Cause). */
var TBC = (function () {

  const TYPES = {
    agent:       { name: 'Agent of Change', short: 'Agent', group: 'core', w: 150,
      def: 'Anything with the potential to change, harm or damage an Object upon which it is acting: an energy source, material condition, change of plan, and so on.',
      tips: ['It has no inputs and always connects to an Event, usually through one or more Barriers.', 'Ask: did this Agent have the potential to change the Object to the state described in the Event?', 'If the Agent was itself the outcome of an earlier happening, add a prior trio and turn that Event into an Event-Agent.'] },
    object:      { name: 'Object', short: 'Object', group: 'core', w: 150,
      def: 'The item harmed (injured, damaged or lost) or changed by an Agent of Change: a person, equipment, the environment, reputation, a project schedule.',
      tips: ['It has no inputs and always connects to an Event, usually through one or more Barriers.', 'Describe the Object as it was before its condition changed.', 'If the Object only existed because of an earlier happening, add a prior trio and turn that Event into an Event-Object.'] },
    event:       { name: 'Event', short: 'Event', group: 'core', w: 150,
      def: 'An unplanned and unwanted happening involving the release or exposure of an Agent of Change: damage, injury or loss to the Object.',
      tips: ['An Event has exactly two inputs: one from an Agent and one from an Object.', 'Define the Event first, then the Object it changed, then the Agent that changed it. Reasoning runs back in time; the tree runs left to right.', 'If an Effective Barrier stopped the trio, the Event becomes a Potential Event (near miss).'] },
    eventAgent:  { name: 'Event-Agent', short: 'Event-Agent', group: 'core', w: 150,
      def: 'An Event that goes on to act as the Agent of Change in a later trio. Example: an explosion weakens a structure, which falls on rescue workers.',
      tips: ['It takes one Agent input and one Object input, like an Event.', 'Its output acts as an Agent in the next trio.'] },
    eventObject: { name: 'Event-Object', short: 'Event-Object', group: 'core', w: 150,
      def: 'An Event that creates a new Object for a later trio. Example: a man falls 30 m into the sea; the fall creates a new Object (the man) for a new Agent (the sea).',
      tips: ['It takes one Agent input and one Object input, like an Event.', 'Its output acts as an Object in the next trio.'] },
    failed:      { name: 'Failed Barrier', short: 'Failed Barrier', group: 'barrier', w: 160,
      def: 'A Barrier that was in place but was made ineffective by an Immediate Cause, letting the Agent and Object meet.',
      tips: ['Exactly one Immediate Cause per Failed Barrier.', 'Describe it specifically: the relevant step of a procedure, not the title of the procedure.', 'Had it worked, would it have prevented the next Event?', 'Check the management system, JRA/JSA, Permit to Work and BowTie for barriers you may have missed.'] },
    missing:     { name: 'Missing Barrier', short: 'Missing Barrier', group: 'barrier', w: 160,
      def: 'A Barrier it was reasonable to expect, but which was never established, and nobody can be identified who should have designed or implemented it.',
      tips: ['Linked directly to one or more Underlying Causes. No Immediate Cause and no Precondition.', 'Rare. If a Barrier was removed, or you can identify who should have provided it, it is a Failed Barrier: make that human error the Immediate Cause.'] },
    inadequate:  { name: 'Inadequate Barrier', short: 'Inadequate Barrier', group: 'barrier', w: 160,
      def: 'A Barrier that was in place and in proper condition but could not do its job (a fence intact but built too low). Treated the same way as a Missing Barrier.',
      tips: ['Linked directly to one or more Underlying Causes. No Immediate Cause and no Precondition.', 'Drawn with the same symbol as a Missing Barrier.'] },
