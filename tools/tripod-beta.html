        TS('The request to the contractor was a one-off decision in the emergency (exceptional violation)', 'Conclusion', 'Engineering manager and contractor owner interviews; phone records'),
        TS('Contractors are routinely asked to do work outside their scope because the contractor process is slow (routine scope creep)', 'Assumption', 'Records of out-of-scope jobs; contractor management procedure and approval times; interviews with other contractors'),
        TS('The boat had not been used or inspected for years', 'Assumption', 'Stores and asset records; boat condition; interviews'),
        TS('The current and wind pushed the boat faster than the shore attendant could hold it', 'Assumption', 'Wind data; spillway flow; rope condition and anchor; shore attendant interview; phone video', 'd_ea2'),
        TS('The workers left the boat because they feared going over the spillway', 'Assumption', 'Surviving worker and shore attendant accounts; position of the boat when found; any video', 'd_eo3'),
        TS('The swim distance to the bank was 15 to 20 m', 'Open question', 'Survey of the boat position and the bank', ''),
        TS('Their clothing and boots hampered swimming', 'Assumption', 'Clothing and boots recovered; post-mortem; expert opinion'),
        TS('The worker who drowned could not swim; none of them had water-safety, rescue or first-aid training', 'Assumption', 'Training records; surviving worker, contractor and family interviews'),
        TS('How the surviving worker reached the bank (swam, held the boat, was pulled out?)', 'Open question', 'Surviving worker and shore attendant interviews; recovery team'),
        TS('No risk assessment, permit or job plan was made for the task', 'Conclusion', 'Permit office and SHE records; interviews'),
        TS('No life jackets, ring buoys or throw lines were available at the dam', 'Conclusion', 'Site inspection; stores records; emergency team interview')
      ]
    },
    log: []
  };
  const EXAMPLES = [DAM];

  return { TYPES, PALETTE, BRF, ERRORS, OBJECT_KINDS, STAGES, TIPS, SMART, GLOSSARY, EXAMPLE, DAM, EXAMPLES };
})();
if (typeof module !== 'undefined') module.exports = TBC;
</script>
<script>/* Tripod Beta tree rules (User Guide Annex 5 + 6) and quality checks (Annex 2, section 6.5/6.6).
   Pure functions over a case: { nodes:[{id,type,...}], edges:[{id,from,to}], actions:[{target,...}] }.
   Edges always run cause -> effect: Agent/Object -> Barrier -> Event, IC -> Failed Barrier, PC -> IC, UC -> PC or Missing/Inadequate Barrier. */
var TBR = (function () {
  const AGENTISH = { agent: 1, eventAgent: 1 };
  const OBJECTISH = { object: 1, eventObject: 1 };
  const EVENTS = { event: 1, eventAgent: 1, eventObject: 1 };
  const BARRIERS = { failed: 1, missing: 1, inadequate: 1, effective: 1 };
  const SOURCES = { agent: 1, object: 1, eventAgent: 1, eventObject: 1 };
  const ACTIONABLE = { failed: 1, missing: 1, inadequate: 1, uc: 1 };

  const isEvent = t => !!EVENTS[t], isBarrier = t => !!BARRIERS[t];
  const isTraj = t => !!(SOURCES[t] || BARRIERS[t]);
  const edgeKind = (ft, tt) => {
    if (ft === 'narrative' || tt === 'narrative') return 'note';
    if (ft === 'pc' && tt === 'ic') return 'probable';
    if (ft === 'ic' || ft === 'pc' || ft === 'uc') return 'cause';
    return 'trajectory';
  };

  /* Which connections the canvas allows. Returns {ok, reason}. */
  function canConnect(ft, tt) {
    if (ft === 'narrative' || tt === 'narrative') return { ok: true };
    if (tt === 'agent' || tt === 'object') return { ok: false, reason: 'Agents and Objects have no inputs. They are the start of a trajectory.' };
    if (tt === 'uc') return { ok: false, reason: 'An Underlying Cause is an end node; nothing feeds into it.' };
    if (ft === 'event') return { ok: false, reason: 'A plain Event is the end of a trio. To carry it into the next trio, change it to an Event-Agent or Event-Object.' };
    if (SOURCES[ft] || BARRIERS[ft]) {
      if (BARRIERS[tt] || EVENTS[tt]) return { ok: true };
      return { ok: false, reason: 'A trajectory runs from an Agent or Object, through Barriers, to an Event.' };
    }
    if (ft === 'ic') {
      if (tt === 'failed') return { ok: true };
      if (tt === 'missing' || tt === 'inadequate') return { ok: false, reason: 'A Missing or Inadequate Barrier has no Immediate Cause; link it to an Underlying Cause. If someone can be identified who should have provided it, make it a Failed Barrier.' };
      if (tt === 'effective') return { ok: false, reason: 'An Effective Barrier did not fail, so it has no causation path.' };
      return { ok: false, reason: 'An Immediate Cause links to the Failed Barrier it defeated.' };
    }
    if (ft === 'pc') {
      if (tt === 'ic') return { ok: true };
      if (BARRIERS[tt]) return { ok: false, reason: 'A Precondition links to an Immediate Cause, not directly to a barrier.' };
      return { ok: false, reason: 'A Precondition links to the Immediate Cause it promoted.' };
    }
    if (ft === 'uc') {
      if (tt === 'pc' || tt === 'missing' || tt === 'inadequate') return { ok: true };
      if (tt === 'ic') return { ok: false, reason: 'An Underlying Cause links to a Precondition, which in turn links to the Immediate Cause.' };
      if (tt === 'failed') return { ok: false, reason: 'A Failed Barrier must be linked through an Immediate Cause. Use a Missing or Inadequate Barrier if nobody could have prevented the failure.' };
      if (tt === 'effective') return { ok: false, reason: 'An Effective Barrier did not fail, so it has no causation path.' };
      return { ok: false, reason: 'An Underlying Cause links to a Precondition or to a Missing/Inadequate Barrier.' };
    }
    return { ok: false, reason: 'These two elements cannot be linked.' };
  }

  /* Try both directions; returns {ok, from, to, reason}. */
  function orient(a, b) {
    if (a.id === b.id) return { ok: false, reason: 'A node cannot link to itself.' };
    const f = canConnect(a.type, b.type);
    if (f.ok) return { ok: true, from: a.id, to: b.id };
    const r = canConnect(b.type, a.type);
    if (r.ok) return { ok: true, from: b.id, to: a.id };
    return { ok: false, reason: f.reason };
  }

  function index(c) {
    const byId = {}, ins = {}, outs = {};
    c.nodes.forEach(n => { byId[n.id] = n; ins[n.id] = []; outs[n.id] = []; });
    c.edges.forEach(e => { if (byId[e.from] && byId[e.to]) { outs[e.from].push(e); ins[e.to].push(e); } });
    const inN = (id, pred) => ins[id].map(e => byId[e.from]).filter(n => n && n.type !== 'narrative' && (!pred || pred(n)));
    const outN = (id, pred) => outs[id].map(e => byId[e.to]).filter(n => n && n.type !== 'narrative' && (!pred || pred(n)));
    return { byId, ins, outs, inN, outN };
  }

  /* Walk upstream through barriers to the source of a trajectory. */
  function trajectoryOrigin(ix, id, seen) {
    seen = seen || {};
    let n = ix.byId[id], path = [];
    while (n && BARRIERS[n.type]) {
      if (seen[n.id]) return { origin: null, barriers: path, loop: true };
      seen[n.id] = 1; path.push(n);
      const up = ix.inN(n.id, m => isTraj(m.type));
      if (up.length !== 1) return { origin: null, barriers: path };
      n = up[0];
    }
    return { origin: n || null, barriers: path };
  }

  /* For each event-type node: its agent-side and object-side inputs with the barriers on them. */
  function trios(c, ix) {
    ix = ix || index(c);
    return c.nodes.filter(n => EVENTS[n.type]).map(ev => {
      const inputs = ix.inN(ev.id, m => isTraj(m.type)).map(m => {
        const t = trajectoryOrigin(ix, m.id);
        const side = t.origin ? (AGENTISH[t.origin.type] ? 'agent' : OBJECTISH[t.origin.type] ? 'object' : null) : null;
        return { side, origin: t.origin, barriers: t.barriers.slice().reverse(), loop: t.loop };
      });
      const agents = inputs.filter(i => i.side === 'agent'), objects = inputs.filter(i => i.side === 'object');
      const allBarriers = inputs.reduce((a, i) => a.concat(i.barriers), []);
      const potential = allBarriers.some(b => b.type === 'effective');
      return { event: ev, inputs, agents, objects, barriers: allBarriers, potential };
    });
  }

  function findCycle(c, ix) {
    const color = {}; let hit = null;
    const visit = id => {
      color[id] = 1;
      for (const e of ix.outs[id]) {
        if (hit) return;
        if (color[e.to] === 1) { hit = e.to; return; }
        if (!color[e.to]) visit(e.to);
      }
      color[id] = 2;
    };
    c.nodes.forEach(n => { if (!color[n.id] && !hit) visit(n.id); });
    return hit;
  }

  /* Underlying Causes reachable from an Immediate Cause through its Preconditions. */
  function ucsOfIC(ix, icId) {
    const out = [];
    ix.inN(icId, m => m.type === 'pc').forEach(pc => ix.inN(pc.id, m => m.type === 'uc').forEach(u => { if (out.indexOf(u) < 0) out.push(u); }));
    return out;
  }

  /* Causation path for a barrier: {ic, pcs:[{pc, ucs}], ucs(direct)} */
  function pathOf(c, barrierId, ix) {
    ix = ix || index(c);
    const b = ix.byId[barrierId];
    if (!b) return null;
    if (b.type === 'failed') {
      const ic = ix.inN(b.id, m => m.type === 'ic')[0] || null;
      const pcs = ic ? ix.inN(ic.id, m => m.type === 'pc').map(pc => ({ pc, ucs: ix.inN(pc.id, m => m.type === 'uc') })) : [];
      return { barrier: b, ic, pcs, ucs: [] };
    }
    return { barrier: b, ic: null, pcs: [], ucs: ix.inN(b.id, m => m.type === 'uc') };
  }

  const GENERIC = /^(procedures?|ptw|permit( to work)?|training|ppe|risk assessments?|supervision|jsa|jha|jra|induction|signage|inspection|maintenance|guarding|competence)$/i;

  function check(c) {
    const ix = index(c), I = [];
    const add = (sev, code, ids, msg, ref) => I.push({ sev, code, ids: [].concat(ids), msg, ref: ref || '' });
    const nm = n => '“' + ((n.label || '').trim() || '(no label)') + '”';
    const T = c.nodes.length;

    if (!T) { add('tip', 'Q0', [], 'The tree is empty. Start with the Main Event, then add the Object it changed and the Agent that changed it.', 'Annex 2 A1'); return I; }

    const cyc = findCycle(c, ix);
    if (cyc) add('error', 'T1', [cyc], 'The tree contains a loop through ' + nm(ix.byId[cyc]) + '. Links must run one way, from cause to effect.', 'Annex 6');

    c.edges.forEach(e => {
      const f = ix.byId[e.from], t = ix.byId[e.to];
      if (!f || !t) return;
      const ok = canConnect(f.type, t.type);
      if (!ok.ok) add('error', 'L1', [f.id, t.id], 'Invalid link from ' + TYPE_NAME(f.type) + ' ' + nm(f) + ' to ' + TYPE_NAME(t.type) + ' ' + nm(t) + '. ' + ok.reason, 'Annex 6');
    });

    const tr = trios(c, ix);
    tr.forEach(t => {
      const ev = t.event;
      if (t.agents.length !== 1) add('error', 'E1', [ev.id], TYPE_NAME(ev.type) + ' ' + nm(ev) + ' needs exactly one Agent of Change input; it has ' + t.agents.length + '.', 'Annex 6.1 A–C');
      if (t.objects.length !== 1) add('error', 'E2', [ev.id], TYPE_NAME(ev.type) + ' ' + nm(ev) + ' needs exactly one Object input; it has ' + t.objects.length + '.', 'Annex 6.1 A–C');
      t.inputs.filter(i => !i.side && !i.loop).forEach(i => { const b = i.barriers[0]; if (b) add('error', 'E3', [b.id, ev.id], 'The trajectory into ' + nm(ev) + ' through ' + nm(b) + ' does not start at an Agent or Object.', 'Annex 5'); });
      if (!t.barriers.length && t.inputs.length) add('warning', 'Q2', [ev.id], 'No barrier on either trajectory into ' + nm(ev) + '. If no barrier can be found for a trio, merge it with a trio that has one.', 'Annex 2 B11');
      if (ev.type !== 'event' && !ix.outN(ev.id).length) add('warning', 'E4', [ev.id], TYPE_NAME(ev.type) + ' ' + nm(ev) + ' does not act on a later Event. Link it on, or change it to a plain Event.', 'Annex 5');
    });
    const nTrio = tr.length;
    if (nTrio && (nTrio < 2 || nTrio > 5)) add('tip', 'Q1', [], 'The core diagram has ' + nTrio + ' trio' + (nTrio === 1 ? '' : 's') + '. A final core diagram normally has 2 to 5; ' + (nTrio < 2 ? 'look for prior and subsequent events.' : 'consider collapsing trios that add little.'), 'Annex 2 A6');

    c.nodes.forEach(n => {
      const ins = ix.inN(n.id), outs = ix.outN(n.id);
      const label = (n.label || '').trim();
      if (n.type !== 'narrative' && !label) add('warning', 'Q4', [n.id], 'A ' + TYPE_NAME(n.type) + ' has no description.', '');
      if (n.type !== 'narrative' && !ins.length && !outs.length && T > 1) add('warning', 'Q5', [n.id], TYPE_NAME(n.type) + ' ' + nm(n) + ' is not linked to anything.', '');
      switch (n.type) {
        case 'agent': case 'object':
          if (outs.length && !reachesEvent(ix, n.id)) add('error', 'A1', [n.id], TYPE_NAME(n.type) + ' ' + nm(n) + ' does not reach an Event. A trajectory must end at an Event.', 'Annex 5');
          break;
        case 'failed': case 'missing': case 'inadequate': case 'effective': {
          const tin = ins.filter(m => isTraj(m.type)), tout = outs.filter(m => isTraj(m.type) || EVENTS[m.type]);
          if (tin.length !== 1 || tout.length !== 1) add('error', 'B1', [n.id], TYPE_NAME(n.type) + ' ' + nm(n) + ' must sit on one trajectory: one line in from the Agent/Object side and one line out toward the Event (now ' + tin.length + ' in, ' + tout.length + ' out).', 'Annex 5');
          const ics = ins.filter(m => m.type === 'ic'), ucs = ins.filter(m => m.type === 'uc');
          if (n.type === 'failed') {
            if (!ics.length) add('error', 'B2', [n.id], 'Failed Barrier ' + nm(n) + ' has no Immediate Cause. Every Failed Barrier is defeated by exactly one Immediate Cause.', 'Annex 6.3');
            if (ics.length > 1) add('error', 'B3', [n.id].concat(ics.map(m => m.id)), 'Failed Barrier ' + nm(n) + ' has ' + ics.length + ' Immediate Causes. There can only be one.', 'Annex 6.3 C');
          }
          if ((n.type === 'missing' || n.type === 'inadequate') && !ucs.length) add('error', 'B4', [n.id], TYPE_NAME(n.type) + ' ' + nm(n) + ' must be linked to at least one Underlying Cause.', 'Annex 6.2 / 6.4');
          if (label && n.type !== 'effective' && (GENERIC.test(label) || label.split(/\s+/).length < 2)) add('tip', 'Q6', [n.id], 'Describe barrier ' + nm(n) + ' in specific terms: the relevant step of the procedure or the specific control, not its title or type.', 'Annex 2 B9');
          break;
        }
        case 'ic': {
          const fb = outs.filter(m => m.type === 'failed');
          if (!fb.length) add('error', 'I1', [n.id], 'Immediate Cause ' + nm(n) + ' is not linked to a Failed Barrier.', 'Annex 5');
          const pcs = ins.filter(m => m.type === 'pc');
          const reach = ucsOfIC(ix, n.id).length;
          if (!pcs.length || !reach) {
            if ((n.justification || '').trim()) add('tip', 'I2', [n.id], 'Immediate Cause ' + nm(n) + ' has no ' + (!pcs.length ? 'Precondition' : 'Underlying Cause') + '. Justification recorded: ' + n.justification.trim(), 'Annex 6.3 E');
            else if (!pcs.length) add('warning', 'I2', [n.id], 'Immediate Cause ' + nm(n) + ' has no Precondition. Ask why the person thought the act was normal or acceptable. Only an uncontrollable outside party justifies leaving it out: record the reason.', 'Annex 6.3 E');
          }
          if ((n.act || 'act') === 'act' && !n.errorType) add('tip', 'I3', [n.id], 'Classify the error type of ' + nm(n) + ' (slip, lapse, mistake or violation). It points to the likely Preconditions.', 'Annex 3');
          break;
        }
        case 'pc': {
          if (!outs.filter(m => m.type === 'ic').length) add('error', 'P1', [n.id], 'Precondition ' + nm(n) + ' is not linked to an Immediate Cause.', 'Annex 5');
          if ((n.scope || 'org') === 'org' && !ins.filter(m => m.type === 'uc').length) add('error', 'P2', [n.id], 'Organisational Precondition ' + nm(n) + ' needs an Underlying Cause. If it is outside the company’s influence (a natural phenomenon, for example), mark it as external.', 'Annex 5');
          break;
        }
        case 'uc': {
          if (!outs.filter(m => m.type === 'pc' || m.type === 'missing' || m.type === 'inadequate').length) add('error', 'U1', [n.id], 'Underlying Cause ' + nm(n) + ' is not linked to a Precondition or a Missing/Inadequate Barrier.', 'Annex 6.6');
          if (!n.brf) add('warning', 'U2', [n.id], 'Assign a Basic Risk Factor to Underlying Cause ' + nm(n) + '.', 'Annex 4');
          break;
        }
      }
    });

    const acts = c.actions || [];
    c.nodes.filter(n => ACTIONABLE[n.type]).forEach(n => {
      if (!acts.some(a => a.target === n.id && a.status !== 'Cancelled')) add('warning', 'R1', [n.id], 'No recommended action yet for ' + TYPE_NAME(n.type) + ' ' + nm(n) + '. Each Failed or Missing Barrier and each Underlying Cause should have at least one.', '6.5');
    });
    acts.forEach(a => {
      const t = ix.byId[a.target];
      if (!t) add('warning', 'R2', [], 'Action “' + (a.text || '').slice(0, 60) + '” is not linked to a barrier or Underlying Cause in the tree.', '6.6');
      else if (!ACTIONABLE[t.type]) add('warning', 'R2', [t.id], 'Action “' + (a.text || '').slice(0, 60) + '” is linked to a ' + TYPE_NAME(t.type) + '. Actions belong on Failed/Missing Barriers or Underlying Causes.', '6.6');
      const sm = a.smart || {};
      const miss = ['S', 'M', 'A', 'R', 'T'].filter(k => !sm[k]);
      if (miss.length || !a.owner || !a.due) add('tip', 'R3', t ? [t.id] : [], 'Action “' + (a.text || '').slice(0, 60) + '”' + (miss.length ? ' is not yet SMART (' + miss.join(', ') + ')' : '') + (!a.owner ? (miss.length ? ';' : '') + ' has no owner' : '') + (!a.due ? ' has no due date' : '') + '.', '6.6');
    });
    const order = { error: 0, warning: 1, tip: 2 };
    return I.sort((a, b) => order[a.sev] - order[b.sev]);
  }

  function reachesEvent(ix, id, seen) {
    seen = seen || {};
    if (seen[id]) return false; seen[id] = 1;
    return ix.outN(id).some(m => EVENTS[m.type] || (BARRIERS[m.type] && reachesEvent(ix, m.id, seen)));
  }

  let TYPE_NAME = t => t;
  function setNames(fn) { TYPE_NAME = fn; }

  return { canConnect, orient, index, trios, pathOf, check, edgeKind, isEvent, isBarrier, isTraj, setNames, ucsOfIC, EVENTS, BARRIERS, SOURCES, ACTIONABLE };
})();
if (typeof module !== 'undefined') module.exports = TBR;
</script>
<script>/* Tripod Beta Investigator — tree geometry, SVG rendering, tidy layout and exports
   (SVG, draw.io, Word .docx, HTML report, Storyline Casebook package). Pure string builders; no DOM. */
var TBX = (function () {
  const C = (typeof TBC !== 'undefined') ? TBC : require('./content.js');
  const R = (typeof TBR !== 'undefined') ? TBR : require('./rules.js');
  const T = C.TYPES;
  const FONT = 'Arial, Helvetica, sans-serif';
  const COL = { event: '#d7262e', object: '#1f8f4e', ic: '#9aa1a8', pc: '#2f6db5', uc: '#f2c230', stripeA: '#ffd200', stripeB: '#161616', ink: '#141414', cap: '#5b5b5b', edge: '#3a3f47' };

  const xml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  const html = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- geometry ---------------------------------------------------- */
  function wrap(text, max, maxLines) {
    const words = String(text || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    const lines = []; let cur = '';
    words.forEach(w => {
      while (w.length > max) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, max - 1) + '-'); w = w.slice(max - 1); }
      if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { const cut = lines.slice(0, maxLines); cut[maxLines - 1] = cut[maxLines - 1].replace(/.{0,2}$/, '') + '…'; return cut; }
    return lines.length ? lines : [''];
  }
  const charsFor = px => Math.max(8, Math.floor(px / 6.2));
  function geom(n) {
    const t = T[n.type] || T.narrative, w = t.w;
    if (R.BARRIERS[n.type]) {
      const lines = wrap(n.label || '', charsFor(w - 16), 5);
      const boxH = 26 + lines.length * 14;
      return { w, h: 22 + boxH, ay: 11, lines, boxY: 22 };
    }
    const lines = wrap(n.label || '', charsFor(w - (n.type === 'narrative' ? 16 : 24)), n.type === 'narrative' ? 7 : 6);
    const h = Math.max(64, 12 + 14 + lines.length * 14 + 10);
    return { w, h, ay: h / 2, lines };
  }

  function caption(n, ctx) {
    let c = (T[n.type] || {}).name || '';
    if (R.EVENTS[n.type]) { if (ctx.potential && ctx.potential[n.id]) c = 'Potential ' + (n.type === 'event' ? 'Event' : c); else if (n.mainEvent) c = 'Main ' + c; }
    if (n.type === 'ic' && n.act === 'condition') c = 'Immediate Cause · condition';
    if (n.type === 'pc' && n.scope === 'external') c = 'Precondition · external';
    if (n.verified === false && n.type !== 'narrative') c += ' · assumed';
    return c.toUpperCase();
  }

  function defs(p) {
    p = p || 'tb';
    return `<defs><pattern id="${p}Stripe" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="${COL.stripeA}"/><rect width="5.5" height="11" fill="${COL.stripeB}"/></pattern>` +
      `<clipPath id="${p}Top"><rect x="0" y="0" width="400" height="50%"/></clipPath></defs>`;
  }

  function textLines(lines, x, y0, opts) {
    opts = opts || {};
    return `<text font-family="${FONT}" font-size="${opts.size || 12}" fill="${opts.fill || COL.ink}"${opts.italic ? ' font-style="italic"' : ''}${opts.anchor ? ' text-anchor="' + opts.anchor + '"' : ''}>` +
      lines.map((l, i) => `<tspan x="${x}" y="${y0 + i * 14}">${xml(l)}</tspan>`).join('') + '</text>';
  }

  function frameFill(type, p) {
    return { event: COL.event, object: COL.object, ic: COL.ic, pc: COL.pc, uc: COL.uc, agent: `url(#${p}Stripe)` }[type];
  }

  function nodeSVG(n, ctx) {
    const g = geom(n), p = ctx.p || 'tb', w = g.w, h = g.h;
    const pot = R.EVENTS[n.type] && ctx.potential && ctx.potential[n.id];
    const edgeStroke = ctx.interactive ? '' : ` stroke="${COL.edge}"`;
    let s = '';
    const cap = caption(n, ctx);
    if (R.BARRIERS[n.type]) {
      const cx = w / 2;
      s += `<line x1="0" y1="11" x2="${w}" y2="11" class="edge"${edgeStroke} stroke-width="1.6"/>`;
      if (n.type === 'failed') s += `<rect x="${cx - 18}" y="3" width="14" height="16" fill="${COL.ink}"/><rect x="${cx + 4}" y="3" width="14" height="16" fill="${COL.ink}"/>`;
      else if (n.type === 'effective') s += `<rect x="${cx - 18}" y="3" width="36" height="16" fill="${COL.ink}"/>`;
      else s += `<rect x="${cx - 18}" y="3" width="14" height="16" fill="#ffffff" stroke="${COL.ink}" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="${cx + 4}" y="3" width="14" height="16" fill="#ffffff" stroke="${COL.ink}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
      const dashed = (n.type === 'missing' || n.type === 'inadequate') ? ' stroke-dasharray="5 3"' : '';
      s += `<rect x="0" y="${g.boxY}" width="${w}" height="${h - g.boxY}" rx="3" fill="#ffffff" stroke="#3b3b3b" stroke-width="${n.type === 'effective' ? 2 : 1}"${dashed}/>`;
      s += `<text x="8" y="${g.boxY + 14}" font-family="${FONT}" font-size="8.5" letter-spacing=".6" fill="${COL.cap}">${xml(cap)}</text>`;
      s += textLines(g.lines, 8, g.boxY + 30);
    } else if (n.type === 'narrative') {
      s += `<rect x="0" y="0" width="${w}" height="${h}" rx="3" fill="#fbfaf2" stroke="#8b8a7a" stroke-dasharray="5 3"/>`;
      s += `<text x="8" y="16" font-family="${FONT}" font-size="8.5" letter-spacing=".6" fill="${COL.cap}">NARRATIVE</text>`;
      s += textLines(g.lines, 8, 31, { italic: true, size: 11.5 });
    } else {
      const op = pot ? ' fill-opacity=".45"' : '';
      const st = pot ? ' stroke-dasharray="6 3"' : '';
      const sw = n.mainEvent && R.EVENTS[n.type] ? 2.4 : .8;
      if (n.type === 'eventAgent' || n.type === 'eventObject') {
        s += `<rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="${COL.event}"${op}/>`;
        s += `<path d="M4 0 H${w - 4} Q${w} 0 ${w} 4 V${h / 2} H0 V4 Q0 0 4 0Z" fill="${n.type === 'eventAgent' ? `url(#${p}Stripe)` : COL.object}"${op}/>`;
        s += `<rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="none" stroke="#202020" stroke-width="${sw}"${st}/>`;
      } else {
        s += `<rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="${frameFill(n.type, p)}"${op} stroke="#202020" stroke-width="${sw}"${st}/>`;
      }
      const assumed = n.verified === false ? ' stroke="#8a8a8a" stroke-dasharray="3 2"' : '';
      s += `<rect x="6" y="6" width="${w - 12}" height="${h - 12}" rx="2" fill="#ffffff"${assumed}/>`;
      s += `<text x="12" y="20" font-family="${FONT}" font-size="8.5" letter-spacing=".6" fill="${COL.cap}">${xml(cap)}</text>`;
      s += textLines(g.lines, 12, 35);
      if (n.type === 'uc' && n.brf) s += `<rect x="${w - 36}" y="${h - 19}" width="30" height="14" rx="2" fill="${COL.ink}"/><text x="${w - 21}" y="${h - 8.5}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="9.5" fill="${COL.uc}">${xml(n.brf)}</text>`;
    }
    if (ctx.interactive) {
      const iss = ctx.issues && ctx.issues[n.id];
      s = `<rect class="sel-ring" x="-5" y="-5" width="${w + 10}" height="${h + 10}" rx="6"/>` + s;
      if (iss) s += `<g class="badge"><circle cx="${w}" cy="0" r="9" fill="${iss.error ? '#b42318' : iss.warning ? '#9a5b00' : '#276a8a'}"/><text x="${w}" y="3.5" text-anchor="middle" font-family="${FONT}" font-size="10" font-weight="700" fill="#fff">${iss.error || iss.warning || iss.tip}</text></g>`;
      s += `<circle class="port" data-port="${xml(n.id)}" cx="${w}" cy="${g.ay}" r="6"/>`;
      const cls = 'node' + (ctx.sel && ctx.sel.has(n.id) ? ' sel' : '') + (ctx.hl && ctx.hl.has(n.id) ? ' hl' : '');
      return `<g class="${cls}" data-id="${xml(n.id)}" transform="translate(${n.x || 0},${n.y || 0})">${s}</g>`;
    }
    return `<g transform="translate(${n.x || 0},${n.y || 0})">${s}</g>`;
  }

  function anchors(a, ga, b, gb, kind) {
    if (kind === 'trajectory') {
      if (b.x >= a.x + ga.w - 10) return { x1: a.x + ga.w, y1: a.y + ga.ay, x2: b.x, y2: b.y + gb.ay, hz: true };
      return { x1: a.x, y1: a.y + ga.ay, x2: b.x + gb.w, y2: b.y + gb.ay, hz: true };
    }
    const ca = { x: a.x + ga.w / 2, y: a.y + ga.h / 2 }, cb = { x: b.x + gb.w / 2, y: b.y + gb.h / 2 };
    const dx = cb.x - ca.x, dy = cb.y - ca.y;
    if (Math.abs(dy) > Math.abs(dx) * 0.45 || Math.abs(dx) < (ga.w + gb.w) / 2) {
      return dy < 0 ? { x1: ca.x, y1: a.y, x2: cb.x, y2: b.y + gb.h, hz: false } : { x1: ca.x, y1: a.y + ga.h, x2: cb.x, y2: b.y, hz: false };
    }
    return dx > 0 ? { x1: a.x + ga.w, y1: ca.y, x2: b.x, y2: cb.y, hz: true } : { x1: a.x, y1: ca.y, x2: b.x + gb.w, y2: cb.y, hz: true };
  }
  function pathD(an) {
    const { x1, y1, x2, y2, hz } = an;
    if (hz) { const k = Math.max(24, Math.abs(x2 - x1) / 2) * (x2 >= x1 ? 1 : -1); return `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}`; }
    const k = Math.max(20, Math.abs(y2 - y1) / 2) * (y2 >= y1 ? 1 : -1);
    return `M${x1},${y1} C${x1},${y1 + k} ${x2},${y2 - k} ${x2},${y2}`;
  }

  function potentialMap(c) {
    const m = {};
    R.trios(c).forEach(t => { if (t.potential) m[t.event.id] = 1; });
    return m;
  }

  /* Render edges + nodes; returns {body, bbox}. ctx: {interactive, sel:Set, selEdge, issues, hl:Set, p} */
  function renderTree(c, ctx) {
    ctx = Object.assign({ p: 'tb' }, ctx || {});
    ctx.potential = potentialMap(c);
    const byId = {}; c.nodes.forEach(n => byId[n.id] = n);
    const G = {}; c.nodes.forEach(n => G[n.id] = geom(n));
    let edges = '';
    c.edges.forEach(e => {
      const a = byId[e.from], b = byId[e.to]; if (!a || !b) return;
      const kind = R.edgeKind(a.type, b.type);
      const d = pathD(anchors(a, G[a.id], b, G[b.id], kind));
      if (ctx.interactive) {
        edges += `<g data-edge="${xml(e.id)}"><path class="edge ${kind}${ctx.selEdge === e.id ? ' edge-sel' : ''}" d="${d}"/><path class="edge-hit" d="${d}"/></g>`;
      } else {
        const dash = kind === 'probable' ? ' stroke-dasharray="2 4" stroke-linecap="round" stroke-width="2"' : kind === 'note' ? ' stroke-dasharray="5 4" stroke-width="1"' : ' stroke-width="1.6"';
        edges += `<path d="${d}" fill="none" stroke="${COL.edge}"${dash}/>`;
      }
    });
    const nodes = c.nodes.map(n => nodeSVG(n, ctx)).join('');
    return { body: edges + nodes, bbox: bbox(c, G) };
  }
  function bbox(c, G) {
    if (!c.nodes.length) return { x: 0, y: 0, w: 600, h: 400 };
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    c.nodes.forEach(n => { const g = G ? G[n.id] : geom(n); x0 = Math.min(x0, n.x || 0); y0 = Math.min(y0, n.y || 0); x1 = Math.max(x1, (n.x || 0) + g.w); y1 = Math.max(y1, (n.y || 0) + g.h); });
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  /* Standalone SVG file (literal colours, white ground, title strip). */
  function treeSVG(c, opts) {
    opts = opts || {};
    const r = renderTree(c, { p: 'tbx' }), b = r.bbox, pad = 28, head = opts.noTitle ? 0 : 34;
    const W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2 + head);
    const m = c.meta || {};
    const title = opts.noTitle ? '' : `<text x="${pad}" y="${pad + 4}" font-family="${FONT}" font-size="15" font-weight="700" fill="#0f2a4d">${xml(m.title || 'Tripod Beta tree')}</text><text x="${W - pad}" y="${pad + 4}" text-anchor="end" font-family="${FONT}" font-size="11" fill="#5b5b5b">${xml([m.ref, m.date, 'Tripod Beta tree'].filter(Boolean).join('  ·  '))}</text>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs('tbx')}<rect width="${W}" height="${H}" fill="#ffffff"/>${title}<g transform="translate(${pad - b.x},${pad + head - b.y})">${r.body}</g></svg>`;
  }

  /* ---------- tidy layout ------------------------------------------------- */
  function tidy(c) {
    const ix = R.index(c), byId = ix.byId;
    const core = c.nodes.filter(n => R.isTraj(n.type) || R.EVENTS[n.type]);
    const coreSet = {}; core.forEach(n => coreSet[n.id] = 1);
    const trajIn = id => ix.inN(id, m => coreSet[m.id] && (R.isTraj(m.type) || R.EVENTS[m.type]));
    const rank = {}, busy = {};
    const rk = id => {
      if (rank[id] != null) return rank[id];
      if (busy[id]) return 0; busy[id] = 1;
      const ins = trajIn(id); const r = ins.length ? Math.max.apply(null, ins.map(m => rk(m.id))) + 1 : 0;
      busy[id] = 0; return (rank[id] = r);
    };
    core.forEach(n => rk(n.id));
    // as-late-as-possible: pull agents, objects and barriers right, next to the event they feed
    const trajOut = id => ix.outN(id, m => coreSet[m.id]);
    const alap = {}, busy2 = {};
    const al = id => {
      if (alap[id] != null) return alap[id];
      if (busy2[id]) return rank[id]; busy2[id] = 1;
      const outs = trajOut(id);
      const r = outs.length ? Math.min.apply(null, outs.map(m => al(m.id))) - 1 : rank[id];
      busy2[id] = 0; return (alap[id] = Math.max(rank[id], r));
    };
    core.forEach(n => al(n.id));
    core.forEach(n => rank[n.id] = alap[n.id]);
    const COLW = 205, ROWH = 118;
    const sinks = core.filter(n => !ix.outN(n.id, m => coreSet[m.id]).length);
    sinks.sort((a, b) => rank[b.id] - rank[a.id]);
    let slot = 0; const Y = {};
    const visit = (id, guard) => {
      if (Y[id] != null) return Y[id];
      guard = guard || {}; if (guard[id]) return slot * ROWH; guard[id] = 1;
      const n = byId[id];
      let ins = trajIn(id);
      if (R.EVENTS[n.type]) {
        // agent-side input first (upper), object-side second (lower)
        const side = m => { let x = m; const seen = {}; while (x && R.BARRIERS[x.type] && !seen[x.id]) { seen[x.id] = 1; x = trajIn(x.id)[0]; } return x && (x.type === 'agent' || x.type === 'eventAgent') ? 0 : 1; };
        ins = ins.slice().sort((a, b) => side(a) - side(b));
      }
      if (!ins.length) { Y[id] = slot * ROWH; slot++; return Y[id]; }
      const ys = ins.map(m => visit(m.id, guard));
      Y[id] = R.BARRIERS[n.type] ? ys[0] : ys.reduce((a, b) => a + b, 0) / ys.length;
      return Y[id];
    };
    sinks.forEach(s => visit(s.id));
    core.forEach(n => { if (Y[n.id] == null) visit(n.id); });
    core.forEach(n => { n.x = 40 + rank[n.id] * COLW; n.y = 40 + Y[n.id]; });
    // centre each node on its row line
    core.forEach(n => { const g = geom(n); n.y = Math.round(n.y - g.ay + 32); });
    // causation band below the core
    let coreBottom = 0; core.forEach(n => { coreBottom = Math.max(coreBottom, n.y + geom(n).h); });
    const placed = {}; core.forEach(n => placed[n.id] = 1);
    const row1 = coreBottom + 70, CW = 172;
    const rows = [row1, row1 + 130, row1 + 260];
    let cursor = 40;
    const bars = core.filter(n => n.type === 'failed' || n.type === 'missing' || n.type === 'inadequate').sort((a, b) => a.x - b.x || a.y - b.y);
    let maxY = row1;
    bars.forEach(b => {
      const gx = Math.max(cursor, b.x);
      let pcCur = gx, ucCur = gx;
      const putUC = (u, minX) => { if (placed[u.id]) return; ucCur = Math.max(ucCur, minX); u.x = ucCur; u.y = rows[2]; placed[u.id] = 1; ucCur += CW; };
      if (b.type === 'failed') {
        const ic = ix.inN(b.id, m => m.type === 'ic')[0];
        if (ic && !placed[ic.id]) { ic.x = gx; ic.y = rows[0]; placed[ic.id] = 1; }
        if (ic) ix.inN(ic.id, m => m.type === 'pc').forEach(pc => {
          if (!placed[pc.id]) { pc.x = pcCur; pc.y = rows[1]; placed[pc.id] = 1; pcCur += CW; }
          ix.inN(pc.id, m => m.type === 'uc').forEach(u => putUC(u, pc.x));
        });
        cursor = Math.max(gx + CW, pcCur, ucCur) + 24;
      } else {
        ix.inN(b.id, m => m.type === 'uc').forEach(u => { if (!placed[u.id]) { u.x = ucCur; u.y = rows[0]; placed[u.id] = 1; ucCur += CW; } });
        cursor = Math.max(gx + CW, ucCur) + 24;
      }
    });
    c.nodes.forEach(n => { if (placed[n.id]) maxY = Math.max(maxY, n.y + geom(n).h); });
    let lx = 40; const ly = maxY + 60;
    c.nodes.forEach(n => {
      if (placed[n.id]) return;
      if (n.type === 'narrative') {
        const tgt = ix.outs[n.id].map(e => byId[e.to]).concat(ix.ins[n.id].map(e => byId[e.from])).filter(Boolean)[0];
        if (tgt && placed[tgt.id]) { n.x = tgt.x; n.y = tgt.y - geom(n).h - 30; placed[n.id] = 1; return; }
      }
      n.x = lx; n.y = ly; lx += geom(n).w + 22; placed[n.id] = 1;
    });
    // resolve overlaps of nodes that landed on top of each other
    for (let pass = 0; pass < 3; pass++) {
      const list = c.nodes.slice().sort((a, b) => a.y - b.y || a.x - b.x);
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j], ga = geom(a), gb = geom(b);
        if (a.x < b.x + gb.w + 8 && b.x < a.x + ga.w + 8 && a.y < b.y + gb.h + 8 && b.y < a.y + ga.h + 8) b.y = a.y + ga.h + 14;
      }
    }
    c.nodes.forEach(n => { n.x = Math.round(n.x / 10) * 10; n.y = Math.round(n.y / 10) * 10; });
    return c;
  }

  /* ---------- report model (shared by HTML and Word) ---------------------- */
  const brfName = code => { const b = C.BRF.find(x => x.code === code); return b ? b.name : ''; };
  const errName = code => { const e = C.ERRORS.find(x => x.code === code); return e ? e.name : ''; };
  function model(c) {
    const ix = R.index(c), tr = R.trios(c, ix);
    tr.sort((a, b) => (a.event.x || 0) - (b.event.x || 0));
    const trioOf = {}; tr.forEach((t, i) => t.barriers.forEach(b => trioOf[b.id] = i + 1));
    const barrierRows = [];
    tr.forEach((t, i) => t.inputs.forEach(inp => inp.barriers.forEach(b => barrierRows.push({ trio: i + 1, event: t.event.label, side: inp.side === 'agent' ? 'Agent side' : inp.side === 'object' ? 'Object side' : '–', label: b.label, type: T[b.type].name, kind: b.type, id: b.id }))));
    const paths = barrierRows.filter(b => b.kind === 'failed').map(b => {
      const p = R.pathOf(c, b.id, ix);
      return { trio: b.trio, barrier: b.label, id: b.id, ic: p.ic ? { label: p.ic.label, kind: p.ic.act === 'condition' ? 'Sub-standard condition' : 'Sub-standard act', error: errName(p.ic.errorType), notes: p.ic.notes, justification: p.ic.justification } : null,
        pcs: p.pcs.map(x => ({ label: x.pc.label, scope: x.pc.scope === 'external' ? 'External' : 'Organisational', ucs: x.ucs.map(u => ({ label: u.label, brf: u.brf || '', brfName: brfName(u.brf) })) })) };
    });
    const missing = barrierRows.filter(b => b.kind === 'missing' || b.kind === 'inadequate').map(b => ({ trio: b.trio, barrier: b.label, type: b.type, ucs: R.pathOf(c, b.id, ix).ucs.map(u => ({ label: u.label, brf: u.brf || '', brfName: brfName(u.brf) })) }));
    const effective = barrierRows.filter(b => b.kind === 'effective');
    const ucs = c.nodes.filter(n => n.type === 'uc');
    const brf = C.BRF.map(b => ({ code: b.code, name: b.name, n: ucs.filter(u => u.brf === b.code).length, items: ucs.filter(u => u.brf === b.code).map(u => u.label) }));
    const byId = ix.byId;
    const acts = (c.actions || []).map((a, i) => { const t = byId[a.target]; return Object.assign({ n: i + 1, targetLabel: t ? t.label : '(not linked)', targetType: t ? T[t.type].name : '', smartOk: ['S', 'M', 'A', 'R', 'T'].every(k => a.smart && a.smart[k]) }, a); });
    const issues = R.check(c);
    return {
      meta: c.meta || {}, team: c.team || [], trios: tr.map((t, i) => ({ n: i + 1, agent: t.agents[0] ? t.agents[0].origin.label : '–', object: t.objects[0] ? t.objects[0].origin.label : '–', event: t.event.label, type: T[t.event.type].name, potential: t.potential, main: !!t.event.mainEvent, barriers: t.barriers.length })),
      barrierRows, paths, missing, effective, brf, actions: acts, issues,
      counts: { failed: barrierRows.filter(b => b.kind === 'failed').length, missing: missing.length, effective: effective.length, uc: ucs.length, actions: acts.length,
        errors: issues.filter(i => i.sev === 'error').length, warnings: issues.filter(i => i.sev === 'warning').length },
      narratives: c.nodes.filter(n => n.type === 'narrative').map(n => n.label)
    };
  }

  /* ---------- HTML report ------------------------------------------------- */
  const REPORT_CSS = `.rpt{font:14px/1.55 Arial,Helvetica,sans-serif;color:#141c26;background:#fff;max-width:1000px;margin:0 auto;padding:36px 40px 60px}
.rpt h1,.rpt h2,.rpt h3{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.rpt h1{font-size:28px;margin:6px 0 4px;color:#0f2a4d;line-height:1.2}.rpt h2{font-size:19px;color:#0f2a4d;border-bottom:2px solid #0f2a4d;padding-bottom:4px;margin:30px 0 10px}.rpt h3{font-size:15px;margin:18px 0 6px}
.rpt .cover{border-top:8px solid #0f2a4d;padding-top:18px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.rpt .cover img{max-height:70px;max-width:200px}
.rpt .brand{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#1d4ea3}.rpt .kv{display:grid;grid-template-columns:170px 1fr;gap:4px 14px;margin:14px 0}.rpt .kv b{color:#4b5563;font-weight:600}
.rpt table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 10px}.rpt th,.rpt td{border:1px solid #b9c1cc;padding:5px 7px;text-align:left;vertical-align:top}.rpt th{background:#e4eaf3;font-weight:600}
.rpt .tree{overflow-x:auto;border:1px solid #d0d6de;padding:6px;margin:8px 0}.rpt .tree svg{max-width:100%;height:auto}.rpt .tag{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;border-radius:3px;background:#141414;color:#f2c230}
.rpt .path{border-left:4px solid #9aa1a8;padding:4px 0 4px 12px;margin:10px 0}.rpt .path p{margin:2px 0}.rpt .muted{color:#5b6573}.rpt .bar{display:inline-block;height:11px;background:#1d4ea3;vertical-align:middle;border-radius:2px}
.rpt .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}.rpt .sign div{border-top:1px solid #333;padding-top:4px;font-size:12px;min-height:60px}
.rpt .foot{margin-top:40px;font-size:11px;color:#6b7280;border-top:1px solid #d0d6de;padding-top:8px}
@media print{.rpt{padding:0;max-width:none}.rpt h2{break-after:avoid}.rpt .tree{border:0}.rpt table{break-inside:auto}.rpt tr{break-inside:avoid}.rpt .pb{break-before:page}}`;

  function reportBody(c, treeSvg) {
    const M = model(c), m = M.meta, e = html;
    const fmt = d => d || '–';
    const sev = n => ['', 'Minor', 'Moderate', 'Serious', 'Major', 'Catastrophic'][+n] || '–';
    let s = `<div class="rpt"><div class="cover"><div><div class="brand">Istec Training · Tripod Beta incident analysis</div><h1>${e(m.title || 'Untitled investigation')}</h1><div class="muted">${e([m.ref, m.client].filter(Boolean).join(' · '))}</div></div>${m.logo ? `<img src="${e(m.logo)}" alt="Client logo">` : ''}</div>`;
    s += `<div class="kv"><b>Date and time</b><span>${e(fmt(m.date))}${m.time ? ', ' + e(m.time) : ''}</span><b>Location</b><span>${e(fmt(m.location))}</span><b>Site / business unit</b><span>${e(fmt(m.site))}</span><b>Loss category</b><span>${e(fmt(m.incidentType))}</span><b>Severity</b><span>Actual ${e(m.actualSeverity || '–')} (${sev(m.actualSeverity)}), potential ${e(m.potentialSeverity || '–')} (${sev(m.potentialSeverity)})</span><b>Tripod Beta practitioner</b><span>${e(fmt(m.practitioner))}</span><b>Report status</b><span>${e(m.status || 'Draft')}</span></div>`;
    s += `<h2>1. Summary</h2><p>${e(m.summary || m.description || '').replace(/\n/g, '<br>')}</p>`;
    s += `<p class="muted">${M.trios.length} trio(s) · ${M.counts.failed} failed, ${M.counts.missing} missing/inadequate and ${M.counts.effective} effective barrier(s) · ${M.counts.uc} underlying cause(s) · ${M.counts.actions} recommended action(s).</p>`;

  const TEST_RE = /\b(assum\w*|believe\w*|probabl\w*|likely|seem\w*|appear\w*|i think|we think|possibl\w*|suspect\w*|might|may have|could have|concluded?|conclusion|therefore|caused by|because|due to|unclear|not sure|unknown)\b/i;

  function cell(ref, v, s) {

  /* spec: {name, title, sub:[lines], cols:[{h, w, k(row)=>value, s?, list?:[]}], rows:[...], headRow} */
  function tableSheet(spec) {
    const top = [spec.title].concat(spec.sub || []), hr = top.length + 1, n = spec.cols.length, last = colL(n - 1);

async function saveFile(name, data, mime) {
  if (HAS_RUNTIME) {
    const dl = Store.dl || await window.claude.use('downloads').catch(() => null);
    if (!dl) { toast('Saving files is not available in this view.'); return; }
    try { await dl.save({ filename: name, data: data instanceof Uint8Array ? new Blob([data], { type: mime }) : data }); }
    catch (e) { if (e && e.code !== 'declined') toast('Not saved: ' + (e.message || e.code) + '.'); }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast('This browser could not save the file.'); }
}
function pickFile(accept, cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.style.display = 'none';
  i.onchange = () => { const f = i.files && i.files[0]; i.remove(); if (f) cb(f); };
  document.body.appendChild(i); i.click();
}
const fileBase = () => slug((S.c.meta.ref ? S.c.meta.ref + '-' : '') + S.c.meta.title);
function caseFile(c) { return JSON.stringify({ format: 'tripod-beta-case', version: 1, exportedAt: nowISO(), app: 'Istec Training Tripod Beta Investigator', case: c }, null, 1); }
function importCase(file) {
  file.text().then(t => {
    let o; try { o = JSON.parse(t); } catch (e) { toast('That file is not a valid case file (it is not JSON).'); return; }
    const c = o && o.format === 'tripod-beta-case' ? o.case : (o && o.nodes && o.meta ? o : null);
    if (!c) { toast('That file is not a Tripod Beta case file.'); return; }
    const exists = Store.list.some(x => x.id === c.id) || c.example;
    if (exists) { c.id = uid('tb-'); c.meta = c.meta || {}; c.meta.title = (c.meta.title || 'Imported case') + ' (imported copy)'; delete c.example; }
    createCase(normalise(c), 'Opened from file ' + file.name);
  });
}
function svgToPng(svg, scale) {
  return new Promise((res, rej) => {
    const m = svg.match(/width="(\d+)" height="(\d+)"/), w = +m[1], h = +m[2];
    const k = Math.min(scale || 2, 9000 / w, 9000 / h);
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(b => { if (!b) return rej(new Error('no png')); b.arrayBuffer().then(ab => res({ blob: b, bytes: new Uint8Array(ab), w: cv.width, h: cv.height })); }, 'image/png');
      } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error('svg load'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function dataUrlBytes(d) { const b = atob(d.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function pickLogo() {
  pickFile('image/png,image/jpeg,image/webp,image/svg+xml', f => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 360 / img.width, 160 / img.height), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        S.c.meta.logo = cv.toDataURL('image/png'); changed('Added the client logo'); render();
      };
      img.onerror = () => toast('That image could not be read.');
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

function centreOn(ids) {
  const svg = $('#cv'); if (!svg) return;
  const ns = ids.map(node).filter(Boolean); if (!ns.length) return;
  const n = ns[0], g = X.geom(n);
  S.view.x = svg.clientWidth / 2 - (n.x + g.w / 2) * S.view.k; S.view.y = svg.clientHeight / 2 - (n.y + g.h / 2) * S.view.k; applyView();
}

/* ---------- AI advice: TB-1 rules-check help, TB-3 SMART check ---------------------------------
   Advice only: nothing in the case changes. Uses Store.sample (built-in Claude in the artifact, the
   viewer's own AI key offline). Method terms are those of the Tripod Beta User Guide. */
const TBA = (() => {
  const str = (v, n) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n || 300);
  const arr = v => Array.isArray(v) ? v : [];
  const RULES = ['Use the Tripod Beta User Guide terms exactly: Agent of Change, Object, Event, Event-Agent, Event-Object, Failed / Missing / Inadequate / Effective Barrier, Immediate Cause, Precondition, Underlying Cause, Basic Risk Factor. Do not use terms from other methods.',
    'Use only the information given. Do not invent facts.', 'Write plain English in short sentences that a Grade 12 reader working in a second language can follow.',
    'Answer with one JSON object only, no other text.'];
  function treeLines() {
    const lab = n => `${n.id} [${TY[n.type] ? TY[n.type].name : n.type}${n.brf ? ', BRF ' + n.brf : ''}${n.errorType ? ', error type ' + n.errorType : ''}] ${str(n.label, 160) || '(no label)'}`;
    return [...S.c.nodes.filter(n => n.type !== 'narrative').map(n => '- ' + lab(n)), '', 'LINKS (from -> to)', ...S.c.edges.map(e => `- ${e.from} -> ${e.to}`)];
  }
  function head() { const m = S.c.meta || {}; return ['INCIDENT', `Title: ${str(m.title, 200)}`, m.description ? `Description: ${str(m.description, 3000)}` : ''].filter(Boolean); }
  const JOBS = {
    rules: {
      title: 'Rules check explained',
      need: () => issues().filter(i => i.sev !== 'tip').length ? '' : 'There are no rule errors or warnings to explain.',
      prompt: () => ['You are an experienced Tripod Beta practitioner and tutor. A learner\'s tree has the rule-check problems listed below. For each problem, explain in plain words what is wrong and say exactly what to change in the tree to fix it.', '',
        ...head(), '', 'TREE ELEMENTS (id [type] label)', ...treeLines(), '',
        'PROBLEMS FOUND', ...issues().filter(i => i.sev !== 'tip').slice(0, 40).map((i, k) => `P${k + 1} (${i.sev}, ${i.code}, ${i.ref}) ${str(i.msg, 300)} [elements: ${i.ids.join(', ') || 'none'}]`), '',
        'WHAT TO PRODUCE', 'items: one entry per problem, in the same order: ref (P1, P2 ...), explain (one or two sentences: what is wrong and why the rule matters), fix (the change to make, naming the elements by their label).', ...RULES,
        'JSON shape: {"items":[{"ref":"P1","explain":"...","fix":"..."}]}'].join('\n'),
      body: a => { const is = issues().filter(i => i.sev !== 'tip'); const items = arr(a && a.items).slice(0, 40); if (!items.length) throw new Error('The answer had no explanations.');
        return items.map(x => { const k = parseInt(String(x.ref || '').replace(/\D/g, ''), 10) - 1, i = is[k];
          return `<div class="issue ${i ? i.sev : 'tip'}"><span class="sev">${esc(str(x.ref, 6))}</span><div>${i ? `<div class="small muted">${esc(i.msg)}</div>` : ''}<div>${esc(str(x.explain, 600))}</div><div><b>Fix:</b> ${esc(str(x.fix, 600))}</div></div>${i && i.ids.length ? `<button class="btn sm" data-act="showIssue" data-ids="${esc(i.ids.join(','))}" data-close-modal="1">Show on tree</button>` : '<span></span>'}</div>`; }).join(''); }
    },
    smart: {
      title: 'SMART check of the actions',
      need: () => S.c.actions.length || S.c.nodes.some(n => R.ACTIONABLE[n.type]) ? '' : 'Add actions (or Failed / Missing Barriers and Underlying Causes) first.',
      prompt: () => { const tgt = id => { const n = node(id); return n ? `${TY[n.type].name}${n.brf ? ' [' + n.brf + ']' : ''}: ${str(n.label, 160)}` : 'not linked'; };
        const open = S.c.nodes.filter(n => R.ACTIONABLE[n.type] && !S.c.actions.some(a => a.target === n.id && a.status !== 'Cancelled'));
        return ['You are an experienced Tripod Beta practitioner. Review the recommended actions below against SMART as the Tripod Beta User Guide defines it: ' + C.SMART.map(s => `${s.name} (${s.q})`).join('; ') + '.', '',
          ...head(), '', 'ACTIONS', ...(S.c.actions.length ? S.c.actions.map((a, i) => `A${i + 1} addresses ${tgt(a.target)} | action: ${str(a.text, 400) || '(empty)'} | owner: ${str(a.owner, 80) || 'not set'} | due: ${a.due || 'not set'} | agreed by owner: ${a.agreed ? 'yes' : 'no'}`) : ['(none)']), '',
          'FAILED / MISSING BARRIERS AND UNDERLYING CAUSES WITHOUT AN ACTION', ...(open.length ? open.map(n => '- ' + tgt(n.id)) : ['(none)']), '',
          'WHAT TO PRODUCE', 'actions: for each action A1, A2 and so on: S, M, A, R, T (true or false), issues (short lines), better (one improved wording). Actions on Underlying Causes should correct the management system, not only the local barrier.',
          'gaps: one line for each barrier or Underlying Cause that still needs an action, or whose action would not stop it happening again.', ...RULES,
          'JSON shape: {"actions":[{"ref":"A1","S":true,"M":false,"A":true,"R":true,"T":false,"issues":["..."],"better":"..."}],"gaps":["..."]}'].join('\n'); },
      body: a => { const rows = arr(a && a.actions).slice(0, 60), gaps = arr(a && a.gaps).slice(0, 30); if (!rows.length && !gaps.length) throw new Error('The answer had no review.');
        const yn = v => v === true ? '&#10003;' : v === false ? '<b style="color:var(--err)">&#10007;</b>' : '?';
        return `${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Action</th>${C.SMART.map(s => `<th title="${esc(s.name)}">${s.k}</th>`).join('')}<th>Problems and better wording</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${esc(str(r.ref, 6))}</td>${C.SMART.map(s => `<td>${yn(r[s.k])}</td>`).join('')}<td>${arr(r.issues).map(x => esc(str(x, 300))).join('<br>')}${r.better ? `<br><em>Better: ${esc(str(r.better, 500))}</em>` : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}
          ${gaps.length ? `<h3 style="margin-top:6px">Still needs an action</h3><ul>${gaps.map(g => `<li>${esc(str(g, 300))}</li>`).join('')}</ul>` : ''}`; }
    }
  };
  function modal(title, html) {
    const el = document.createElement('div'); el.className = 'modal-bg'; el.id = 'tba-modal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', title);
    el.innerHTML = `<div class="modal" style="width:min(780px,100%)"><h3>${esc(title)}</h3><p class="small muted">Advice from ${esc(AIN)}. Nothing in the case has been changed: check it, then make the changes yourself.</p><div class="issues">${html}</div><div class="row"><span class="spacer"></span><button class="btn" type="button" data-tba-close>Close</button></div></div>`;
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-tba-close],[data-close-modal]')) setTimeout(() => el.remove(), 0); });
    document.body.appendChild(el);
  }
  async function run(kind) {
    const job = JOBS[kind], s = Store.sample; if (!job || !s || S.aiBusy) return;
    const why = job.need(); if (why) { toast(why); return; }
    S.aiBusy = kind; render(); toast('Asking ' + AIN + '… this can take a minute.');
    let ans;
    try { const p = job.prompt(); ans = typeof s.json === 'function' ? await s.json(p, {}) : EV.parseText((await s(p, {})).text); }
    catch (e) { S.aiBusy = null; render(); if (e && e.code === 'cancelled') return; toast((e && e.userMessage) || EV_FAIL[e && e.code] || ('The answer could not be read' + (e && e.message ? ' (' + e.message + ')' : '') + '. Try again.')); return; }
    S.aiBusy = null; render();
    try { modal(job.title, job.body(ans)); } catch (e) { toast((e.message || 'The answer could not be used.') + ' Try again.'); }
  }
  const btn = (kind, label, tip) => Store.sample ? `<button class="btn" data-act="aiAdvice" data-k="${kind}" title="${esc(tip)}"${S.aiBusy ? ' disabled' : ''}>&#10022; ${esc(label)}</button>` : '';
  return { run, btn, JOBS };
})();
Object.assign(ACT, { aiAdvice: d => TBA.run(d.k), aiSettings: () => window.KitAI && KitAI.settings() });

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  ev.preventDefault(); fn(b.dataset, b);
});
document.addEventListener('submit', ev => {
  if (ev.target.dataset.form === 'new') { ev.preventDefault(); const t = ($('#f-newtitle').value || '').trim(); createCase(newCase(t || 'New investigation')); }
});
let editUndoArmed = null;
document.addEventListener('focusin', ev => { const t = ev.target; if (t.matches('[data-nf],[data-af],[data-smart]')) { if (editUndoArmed !== t) { pushUndo(); editUndoArmed = t; } } });
document.addEventListener('focusout', () => { editUndoArmed = null; });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'f-myname') { prefs.name = t.value.trim(); savePrefs(); return; }
  if (!S.c || S.readonly) return;
  if (t.dataset.meta) { S.c.meta[t.dataset.meta] = t.value; changed('Edited the incident details', 'meta'); if (t.dataset.meta === 'title' || t.dataset.meta === 'ref') renderTop(); return; }
  if (t.dataset.team != null) { S.c.team[+t.dataset.team][t.dataset.k] = t.value; changed('Edited the team', 'team'); return; }
  if (t.dataset.ev && t.type !== 'checkbox' && t.tagName !== 'SELECT') { evEdit(t); return; }
  if (t.dataset.nf && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    const n = node(Array.from(S.sel)[0]); if (!n) return;
    n[t.dataset.nf] = t.value; changed('Edited ' + TY[n.type].name + ' text', 'text-' + n.id); renderTree(); return;
  }
  const row = t.closest('[data-row]');
  if (row && t.dataset.af && t.type !== 'checkbox' && t.tagName !== 'SELECT') { S.c.actions[+row.dataset.row][t.dataset.af] = t.value; changed('Edited an action', 'action-' + row.dataset.row); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (!S.c || S.readonly) return;
  if (t.dataset.actChange === 'setType') return setType(Array.from(S.sel)[0], t.value);
  if (t.dataset.actChange === 'linkTo' || t.dataset.actChange === 'linkFrom') {
    if (!t.value) return; const me = Array.from(S.sel)[0]; pushUndo();
    const ok = t.dataset.actChange === 'linkTo' ? linkDir(me, t.value) : linkDir(t.value, me);
    if (!ok) S.undo.pop(); renderTree(); renderInspector(); if (ok && S.sel.size === 1 && Array.from(S.sel)[0] !== me) focusLabel(); return;
  }
  if (t.dataset.ev && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'date')) { evEdit(t); return; }
  if (t.dataset.meta && t.tagName === 'SELECT') { S.c.meta[t.dataset.meta] = t.value; changed(t.dataset.meta === 'status' ? 'Set the report status to ' + t.value : 'Edited the incident details', t.dataset.meta === 'status' ? '' : 'meta'); return; }
  if (t.dataset.nf && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
    const n = node(Array.from(S.sel)[0]); if (!n) return;
    if (t.dataset.nf === 'mainEvent' && t.checked) S.c.nodes.forEach(m => { if (m !== n) m.mainEvent = false; });
    n[t.dataset.nf] = t.type === 'checkbox' ? t.checked : t.value;
    changed('Edited ' + TY[n.type].name, 'prop-' + n.id); renderTree(); renderInspector(); return;
  }
  const row = t.closest('[data-row]');
  if (row) {
    const a = S.c.actions[+row.dataset.row];
    if (t.dataset.smart) { a.smart = Object.assign({}, a.smart, { [t.dataset.smart]: t.checked }); changed('Edited an action', 'action-' + row.dataset.row); return; }
    if (t.dataset.af) { a[t.dataset.af] = t.type === 'checkbox' ? t.checked : t.value; changed(t.dataset.af === 'status' ? 'Set an action to ' + t.value : 'Edited an action', t.dataset.af === 'status' ? '' : 'action-' + row.dataset.row); if (t.dataset.af === 'target' || t.dataset.af === 'status') render(); }
  }
});
document.addEventListener('keydown', ev => {
  const inField = ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable]');
  if (S.tab !== 'tree' || !S.c) return;
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'z' && !inField) { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y' && !inField) { ev.preventDefault(); redo(); return; }
  if (inField) return;
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && (S.sel.size || S.selEdge)) { ev.preventDefault(); deleteSelection(); return; }
  if (ev.key === 'Escape') { S.sel.clear(); S.selEdge = null; renderTree(); renderInspector(); return; }
  const arrows = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, -10], ArrowDown: [0, 10] }[ev.key];
  if (arrows && S.sel.size && !S.readonly) { ev.preventDefault(); pushUndo(); S.sel.forEach(id => { const n = node(id); n.x += arrows[0] * (ev.shiftKey ? 5 : 1); n.y += arrows[1] * (ev.shiftKey ? 5 : 1); }); changed('Moved elements', 'move'); renderTree(); }
});
window.addEventListener('beforeunload', () => flushSave());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

/* test hook for the automated tests */
window.TBApp = { EV, LINK, linkDir, register, openLinkedFile, centreOn: ids => centreOn(ids), S, Store, X, R, C, openCase, exampleCase, newCase, link, addNode, insertBarrier, quickAdd, deleteSelection, issues, render, save: () => save(), flushSave };

/* ---------- boot ------------------------------------------------------------- */
if (!HAS_RUNTIME) Store.list = localList();
if (OFF) Store.list.forEach(x => { const c = localGet(x.id); if (c) register(c); });
render();
initRuntime();
if (OFF) {
  const h = location.hash || '';
  if (h.startsWith('#case-')) { const c = localGet(h.slice(6)); if (c) openCase(c); }
  if (h === '#handoff') KIT.KitHandoff.take('tripod').then(v => { if (v && v.handle) { S.handoff = v; render(); } });
}
})();
</script>
</body></html>
